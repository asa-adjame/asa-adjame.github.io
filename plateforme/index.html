/* ═══════════════════════════════════ RAPPORT AU PRÉSIDENT ═══════════════════════════════════
   Le rapport ne part jamais d'un clic sec : le DT relit d'abord la feuille
   telle que le président la recevra, l'enregistre en PDF, et confirme ensuite.
   C'est le seul document de la plateforme qui sort du club — il vaut la peine
   d'être vu avant de partir.

   Contrairement aux trois fiches, il grandit : le DT peut ajouter des points.
   Sa feuille porte donc la classe `flot`, qui laisse le navigateur couper les
   pages naturellement au lieu de rogner ce qui dépasse. */

/* ─────────────────────────────── matière du rapport global
   Trois blocs que la plateforme sait produire seule : le championnat,
   l'effectif, et l'encadrement. Ils sont recalculés à chaque ouverture —
   aucun chiffre n'est recopié à la main, donc aucun ne peut être périmé. */

function chiffresEffectif(){
  const med = DB.medical || [];
  const indispo = med.filter(m => m.statut === 'Indisponible').length;
  const adapte  = med.filter(m => m.statut === 'Reprise adaptée').length;
  const suivi   = med.filter(m => m.statut === 'Disponible avec suivi').length;
  const parEq = DB.equipes.map(e => {
    const js = parEq_(e.id);
    const dern = j => j.moyennes[j.moyennes.length - 1];
    return {
      id: e.id, nom: e.nom, n: js.length,
      niveau: +moy(js.map(dern)).toFixed(1),
      depart: +moy(js.map(j => j.moyennes[0])).toFixed(1),
      tir: moyTirGroupe(js, 0).pct,
      presence: Math.round(moy(js.map(j => j.presence || 0))),
      sessions: js.reduce((a, j) => a + bilanTir(j).nb, 0),
      sansSession: js.filter(j => !bilanTir(j).nb).length
    };
  });
  return {total: DB.joueurs.length, indispo, adapte, suivi,
          dispo: DB.joueurs.length - indispo - adapte, parEq};
}
// parEq est déjà pris par le noyau ; alias local pour rester lisible ici
const parEq_ = e => DB.joueurs.filter(j => j.equipe === e);

/* Ce que la plateforme a effectivement enregistré, par personne. On ne compte
   que ce qui y passe : ni la séance menée sur le terrain, ni l'entretien avec
   un joueur n'y laissent de trace. La feuille le dit noir sur blanc, sinon un
   compteur à zéro se lit comme un reproche alors qu'il ne mesure rien. */
function livrablesStaff(m){
  const L = [];
  const n = (lib, v) => { if (v) L.push({lib, n: v}); };
  const dirs = DB.joueurs.reduce((a, j) => a + j.directives.filter(d => d.de === m.role).length, 0);

  if (m.role === 'an'){
    n('séances filmées et déposées', (DB.seances || []).length);
    n('oppositions d\'entraînement relevées', (DB.oppositions || []).length);
    n('séances de tir saisies en secours',
      DB.joueurs.reduce((a, j) => a + ((j.tir && j.tir.sessions) || [])
        .filter(x => x.saisiPar === 'an').length, 0));
  }
  if (['hc','ca','cd'].includes(m.role)){
    n('quiz vision de jeu posés', (DB.quiz || []).filter(q => q.auteur === m.id).length);
    n('clips vidéo envoyés aux joueurs', (DB.clips || []).filter(c => c.auteur === m.id).length);
    n('consignes écrites aux joueurs', dirs);
  }
  if (m.role === 'ki'){
    n('signalements publiés au staff', (DB.medical || []).filter(x => x.auteur === m.id).length);
    n('joueurs suivis ce mois-ci',
      new Set((DB.medical || []).filter(x => x.auteur === m.id).map(x => x.joueur)).size);
  }
  return L;
}

/* ══════════════════════════════════════════════════════════════════════════
   BIBLIOTHÈQUE D'EXERCICES

   Le DT filme un exercice et le dépose ici ; les coachs le reprennent en
   l'adaptant à leur groupe. L'original ne bouge jamais : une adaptation crée
   une variante signée, posée à côté. C'est ce qui permet au DT de diffuser une
   intention commune sans imposer un déroulé au mot près — et c'est aussi ce qui
   évite qu'un coach efface sans le vouloir l'exercice de référence.

   Réservée au DT et aux trois coachs. Les joueurs n'ont rien à y faire :
   l'exercice se donne sur le terrain, pas dans une application.
   ══════════════════════════════════════════════════════════════════════════ */

const COUL_CAT = {
  'Tir':'var(--or)', 'Attaque':'var(--attaque)', 'Défense':'var(--defense)',
  'Transition':'var(--analyste)', 'Fondamentaux':'var(--medical)', 'Physique':'var(--physique)',
};
const coulCat = c => COUL_CAT[c] || 'var(--gris)';

let BIB = {cat: 'Toutes', q: '', ouvert: null, adapte: null};

/* Le panier de séance vit sur l'appareil du coach : c'est un brouillon de
   préparation, pas une donnée du club. Il n'a rien à faire en base. */
const clePanier = () => 'asa.seance.' + (E.role || '?') + '.' + ((E.moi || {}).id || '');
function panier(){
  try { return JSON.parse(localStorage.getItem(clePanier()) || '[]'); } catch (e){ return []; }
}
function ecrisPanier(t){
  try { localStorage.setItem(clePanier(), JSON.stringify(t)); } catch (e){}
}

/* Un élément du panier référence soit un exercice du DT, soit une variante.
   On résout ici pour n'avoir qu'un seul objet à afficher partout. */
function bloc(ref){
  if (ref.type === 'variante'){
    const v = (DB.variantes || []).find(x => x.id === ref.id);
    if (!v) return null;
    const base = (DB.exercices || []).find(x => x.id === v.exercice) || {};
    return Object.assign({}, base, v, {estVariante: true, base});
  }
  const e = (DB.exercices || []).find(x => x.id === ref.id);
  return e ? Object.assign({}, e, {estVariante: false}) : null;
}
const variantesDe = id => (DB.variantes || []).filter(v => v.exercice === id);

      <span class="rel-nb pousse" style="color:var(--or)">${duree} min</span></div>

        <button class="hf-b" style="color:var(--gris)" onclick="otePanier(${i})">Retirer</button>

  <div class="ong" style="margin-top:14px">

  ${E.role === 'dt' ? `<div class="carte" style="margin-top:14px;border-style:dashed">

/* La recherche couvre aussi les adaptations : un coach qui cherche « lancer
   franc » doit tomber sur la version d'un collègue qui part d'un lancer manqué,
   même si l'exercice d'origine n'en parle pas. */
function exercicesFiltres(){
  const q = BIB.q.trim().toLowerCase();
  return (DB.exercices || []).filter(e => {
    if (BIB.cat !== 'Toutes' && e.categorie !== BIB.cat) return false;
    if (!q) return true;
    const vs = variantesDe(e.id);
    const texte = [e.titre, e.objectif, (e.deroule || []).join(' '), (e.points || []).join(' '),
                   vs.map(v => v.titre + ' ' + v.note + ' ' + (v.deroule || []).join(' ')).join(' ')
                  ].join(' ').toLowerCase();
    return texte.indexOf(q) >= 0;
  });
}

function enregistreAdaptation(){
  const A = BIB.adapte;
  const titre = (A.titre || '').trim();

  if (!titre) { toast('Donne un titre'); return; }

  if (A.neuf){
    if (E.role !== 'dt') { toast('Seul le directeur technique dépose un exercice'); return; }
    const points = A.points.map(t => t.trim()).filter(Boolean);
    const e = {id: nouvelId(), titre, categorie: A.categorie, duree: A.duree,
               niveau: A.niveau, joueurs: A.joueurs.trim() || '—', materiel: A.materiel.trim() || '—',
               objectif: A.objectif.trim() || '—', deroule, points,
               video: A.video.trim(), auteur: 'dt', date: AUJ_FR()};
    DB.exercices = DB.exercices || [];
    DB.exercices.unshift(e);
    enregistrer('exercices', {id: e.id, titre: e.titre, categorie: e.categorie, duree: e.duree,
                              niveau: e.niveau, joueurs: e.joueurs, materiel: e.materiel,
                              objectif: e.objectif, deroule: e.deroule, points: e.points,
                              video: e.video, auteur_id: (E.moi || {}).id || null});
    journalChat(`a déposé un exercice dans la bibliothèque — « ${titre} »`);
    toast('Exercice déposé');
  } else {
    const v = {id: nouvelId(), exercice: A.base, auteur: (E.moi || {}).id || E.role,
               date: AUJ_FR(), titre, note: (A.note || '').trim() || '—',
               duree: A.duree, joueurs: A.joueurs.trim(), materiel: A.materiel.trim(),
               objectif: A.objectif.trim(), deroule};
    DB.variantes = DB.variantes || [];
    DB.variantes.unshift(v);
    /* auteur_id = l'identifiant d'effectif (« st02 »), PAS le rôle : la règle
       d'accès de la table exige auteur_id = mon_staff(). Avec le rôle, chaque
       adaptation d'un coach était refusée par la base (vérifié en production
       le 12/10/2026). */
    enregistrer('exercices_variantes', {id: v.id, exercice_id: A.base, titre: v.titre, note: v.note,

                                        auteur_id: (E.moi || {}).staffId || (E.moi || {}).id || null});
    toast('Ta version est enregistrée');

  BIB.adapte = null;
  rendVue(); rendNav(); window.scrollTo(0,0);

/* ══════════════════════════════════════════════════════════════════════════
   PLAYBOOK — construire un système

   Demi-terrain vertical, panier en haut : c'est l'orientation d'une planche de
   coach et celle de tous les playbooks. Elle diffère volontairement du terrain
   horizontal utilisé pour le challenge de tir et les oppositions, qui sert à
   pointer des tirs, pas à dessiner des courses.

   Notation classique, celle que les joueurs lisent déjà au tableau :
     · attaquants     cercles numérotés 1 à 5
     · défenseurs     X1 à X5
     · déplacement    trait plein, flèche pleine
     · dribble        trait ondulé, flèche
     · passe          trait tireté, flèche
     · écran          trait plein terminé par une barre perpendiculaire
     · tir            trait plein, double chevron vers le cercle

   Un système se lit en plusieurs temps : chaque étape porte son propre jeu de
   tracés, et « dupliquer » reprend les positions sans les courses — c'est
   exactement la façon dont un coach dessine la suite d'une action.
   ══════════════════════════════════════════════════════════════════════════ */

/* ─────────────────────────────── géométrie du demi-terrain vertical
   300 de large (15 m, ligne de touche à ligne de touche) sur 280 de haut
   (14 m, ligne de fond au milieu de terrain). Panier à 1,575 m de la ligne
   de fond, arc à 6,75 m, corners à 0,90 m des touches. */
const PB_L = 300, PB_H = 280;
const PB_PANIER = {x: 150, y: 31.5};
/* La bande HORS TERRAIN (12/10/2026) : 1,5 m derrière la ligne de fond et le
   long des deux touches. Elle sert aux remises en jeu — le passeur se pose
   dehors, comme au match. Le terrain garde ses coordonnées : la bande
   s'ajoute en coordonnées négatives et au-delà de 300, donc les systèmes
   dessinés avant elle restent exactement où ils étaient. */
const PB_HORS = 30;

function terrainPlaybook(id, contenu, clair){
  /* Parquet (13/10, demande de Fathy) : lames verticales qui filent vers le
     panier, comme dans une salle. Un bois teinté plutôt sombre, pour que les
     courses blanches, les dribbles dorés et les passes vertes restent lisibles.
     Le hors-terrain est peint en marine, la couleur du club. L'impression
     (clair) garde son fond blanc : on n'imprime pas un parquet. */
  const pq     = `${id}-parquet`;
  const fond   = clair ? '#FFFFFF' : `url(#${pq})`;
  const trait  = clair ? '#8A8578' : 'rgba(255,255,255,.82)';
  const cercle = clair ? '#B5462B' : 'var(--or)';
  const dehors = clair ? '#EFEBE2' : '#14213D';
  const m = PB_HORS;
  const lames = clair ? '' : `<defs><pattern id="${pq}" width="30" height="150" patternUnits="userSpaceOnUse">
    <rect width="30" height="150" fill="#7A4D2A"/>
    <rect x="0" width="7.5" height="150" fill="#81532E"/>
    <rect x="7.5" width="7.5" height="150" fill="#744827"/>
    <rect x="15" width="7.5" height="150" fill="#7E512D"/>
    <rect x="22.5" width="7.5" height="150" fill="#704525"/>
    <path d="M7.5 0V150M15 0V150M22.5 0V150M30 0V150M0 46H7.5M7.5 118H15M15 22H22.5M22.5 87H30"

/* ─────────────────────────────── les symboles */
const PB_COUL = {
  cut:     {nuit:'#EDF3FA', clair:'#1A1A18', lib:'Déplacement'},
  dribble: {nuit:'#FFB246', clair:'#B5462B', lib:'Dribble'},
  passe:   {nuit:'#4FA83A', clair:'#2E7D52', lib:'Passe'},
  ecran:   {nuit:'#A47FE0', clair:'#5B3E8E', lib:'Écran'},
  tir:     {nuit:'#F2564B', clair:'#C77A00', lib:'Tir'},
  main:    {nuit:'#3FC1C9', clair:'#127A80', lib:'Main à main'},
};
const PB_OUTILS = [
  {id:'joueur',  lib:'Attaquant'}, {id:'def', lib:'Défenseur'}, {id:'ballon', lib:'Ballon'},
  {id:'plot',    lib:'Plot'},
  {id:'cut',     lib:'Déplacement'}, {id:'dribble', lib:'Dribble'}, {id:'passe', lib:'Passe'},
  {id:'ecran',   lib:'Écran'}, {id:'tir', lib:'Tir'}, {id:'main', lib:'Main à main'},
  {id:'deplacer', lib:'Déplacer'}, {id:'gomme',   lib:'Gommer'},
];
const PB_TRAITS = ['cut','dribble','passe','ecran','tir','main'];
const estTrait = t => PB_TRAITS.includes(t);

/* ─────────────────────────────── finesse du trait (12/10/2026)
   Fathy : « des lignes plus fines, des symboles qui prennent moins de place,
   plus précis ». Les premières tailles étaient pensées pour un doigt sur un
   terrain vu de loin ; sur un téléphone, un cercle de 12 couvrait près d'un
   sixième de la largeur du terrain et cachait les courses qui en partaient.
   Toutes les tailles vivent ici, pour qu'un réglage ne se fasse qu'une fois. */
const PB_T = {
  trait: 1.5,          // épaisseur des courses, passes, dribbles
  fleche: 5.5,         // longueur de la pointe
  joueur: 8.5,         // rayon du cercle de l'attaquant
  joueurTrait: 1.5,
  joueurTexte: 10,
  def: 5.5,            // demi-branche de la croix du défenseur
  defTrait: 1.8,
  ballon: 4.2,
  plot: 5,
  onde: 3,             // amplitude du dribble
  pasOnde: 8,
  barre: 6.5,          // demi-barre de l'écran
};

function pbFleche(x1, y1, x2, y2, coul, double){
  const a = Math.atan2(y2 - y1, x2 - x1), t = PB_T.fleche;
  const tete = (recul) => {
    const bx = x2 - Math.cos(a) * recul, by = y2 - Math.sin(a) * recul;
    const p = ang => [(bx - Math.cos(ang) * t).toFixed(1), (by - Math.sin(ang) * t).toFixed(1)];
    const A = p(a - 0.42), B = p(a + 0.42);
    return `<polygon points="${bx.toFixed(1)},${by.toFixed(1)} ${A[0]},${A[1]} ${B[0]},${B[1]}" fill="${coul}"/>`;
  };
  return double ? tete(0) + tete(4.5) : tete(0);
}

/* ─────────────────────────────── traits courbes (13/10/2026)
   Fathy : « un moyen de faire des lignes incurvées ». Une course réelle
   contourne un écran, une passe lobée passe au-dessus d'un défenseur : la
   ligne droite mentait sur le trajet.

   Un trait garde ses deux bouts et gagne, s'il est courbé, UN point de
   contrôle (cx, cy) : une courbe de Bézier quadratique. Sans cx/cy, le point
   de contrôle est le milieu du segment — et une Bézier dont le contrôle est
   au milieu EST la ligne droite. Les systèmes déjà enregistrés se dessinent
   donc exactement comme avant, sans conversion.

   Pas d'outil de plus : avec « Déplacer », on attrape le milieu d'un trait
   et on le tire. La courbe passe sous le doigt. Le ramener sur la ligne
   droite la redresse. */
const pbCourbe = e => e.cx != null && e.cy != null;
const pbCtrl = e => pbCourbe(e) ? {x: e.cx, y: e.cy} : {x: (e.x1 + e.x2) / 2, y: (e.y1 + e.y2) / 2};
function pbBez(e, t){
  const c = pbCtrl(e), u = 1 - t;
  return {x: u * u * e.x1 + 2 * u * t * c.x + t * t * e.x2,
          y: u * u * e.y1 + 2 * u * t * c.y + t * t * e.y2};
}
function pbTan(e, t){                     // direction (unitaire) de la courbe en t
  const c = pbCtrl(e);
  let x = 2 * (1 - t) * (c.x - e.x1) + 2 * t * (e.x2 - c.x);
  let y = 2 * (1 - t) * (c.y - e.y1) + 2 * t * (e.y2 - c.y);
  const L = Math.hypot(x, y) || 1;
  return {x: x / L, y: y / L};
}
/* le chemin SVG du trait : droit (L) ou courbe (Q) */
const pbChemin = e => pbCourbe(e)
  ? `M${e.x1},${e.y1} Q${e.cx},${e.cy} ${e.x2},${e.y2}`
  : `M${e.x1},${e.y1} L${e.x2},${e.y2}`;
/* la pointe suit la tangente d'arrivée : on lui donne un point « d'où elle
   vient » pris juste avant le bout, dans l'axe de la courbe */
function pbFlecheTrait(e, coul, double){
  const d = pbTan(e, 1);
  return pbFleche(e.x2 - d.x * 10, e.y2 - d.y * 10, e.x2, e.y2, coul, double);
}

/* trait ondulé du dribble : une suite de quarts d'onde perpendiculaires,
   posés le long de la courbe (ou du segment, qui en est le cas droit) */
function pbOndule(e){
  const L = Math.hypot(e.x2 - e.x1, e.y2 - e.y1);
  if (L < 6) return pbChemin(e);
  const n = Math.max(2, Math.round(L / PB_T.pasOnde));
  let d = `M${e.x1},${e.y1}`;
  for (let i = 1; i <= n; i++){
    const t = i / n, m = t - 0.5 / n, s = (i % 2 ? 1 : -1) * PB_T.onde;
    const pm = pbBez(e, m), tg = pbTan(e, m), pt = pbBez(e, t);
    d += ` Q${(pm.x - tg.y * s).toFixed(1)},${(pm.y + tg.x * s).toFixed(1)} ${pt.x.toFixed(1)},${pt.y.toFixed(1)}`;
  }
  return d;
}

/* Courber un trait sous le doigt : le point de la courbe à mi-parcours vaut
   (P1 + 2C + P2) / 4, donc pour qu'il tombe sur le doigt, C = 2·doigt − (P1+P2)/2.
   Revenu à moins de 4 unités de la droite, le trait est redressé. */
function pbCourbeVers(e, p){
  const mx = (e.x1 + e.x2) / 2, my = (e.y1 + e.y2) / 2;
  if (Math.hypot(p.x - mx, p.y - my) < 4){ delete e.cx; delete e.cy; return; }
  e.cx = +(2 * p.x - mx).toFixed(1);
  e.cy = +(2 * p.y - my).toFixed(1);
}
/* le trait dont le MILIEU (sur la courbe) est le plus proche du doigt */
function pbTraitProche(p, max){
  let pris = null, min = max || 20;
  pbEtape().elements.forEach(e => {
    if (!estTrait(e.t)) return;
    const m = pbBez(e, 0.5), d = Math.hypot(m.x - p.x, m.y - p.y);
    if (d < min){ min = d; pris = e; }
  });
  return pris;
}

function pbElement(e, clair){
  const c = k => (PB_COUL[k] || {})[clair ? 'clair' : 'nuit'];
  const fondJ = clair ? '#FFFFFF' : '#04101F';
  const T = PB_T;

  if (e.t === 'joueur')
    return `<g><circle cx="${e.x}" cy="${e.y}" r="${T.joueur}" fill="${fondJ}"
        stroke="${clair ? '#1A1A18' : '#FFB246'}" stroke-width="${T.joueurTrait}"/>
      <text x="${e.x}" y="${(e.y + T.joueurTexte * 0.36).toFixed(1)}" text-anchor="middle"
        font-size="${T.joueurTexte}" font-weight="700"
        fill="${clair ? '#1A1A18' : '#FFB246'}" font-family="DM Sans,sans-serif">${e.n}</text></g>`;

  if (e.t === 'def'){
    const k = T.def, C = clair ? '#0E6CA8' : '#3993D1';
    return `<g><line x1="${e.x - k}" y1="${e.y - k}" x2="${e.x + k}" y2="${e.y + k}" stroke="${C}" stroke-width="${T.defTrait}" stroke-linecap="round"/>
      <line x1="${e.x + k}" y1="${e.y - k}" x2="${e.x - k}" y2="${e.y + k}" stroke="${C}" stroke-width="${T.defTrait}" stroke-linecap="round"/>
      <text x="${e.x + k + 2}" y="${e.y + k + 2}" font-size="8" font-weight="700" fill="${C}"
        font-family="DM Sans,sans-serif">${e.n}</text></g>`;
  }

  if (e.t === 'ballon')
    return `<g><circle cx="${e.x}" cy="${e.y}" r="${T.ballon}" fill="${clair ? '#B5462B' : '#F2564B'}"
      stroke="${fondJ}" stroke-width="1"/></g>`;

  if (e.t === 'plot'){
    const k = T.plot;
    return `<polygon points="${e.x},${e.y - k} ${e.x + k * 0.85},${e.y + k * 0.75} ${e.x - k * 0.85},${e.y + k * 0.75}"
      fill="none" stroke="${clair ? '#8A8578' : '#93AAC6'}" stroke-width="1.3" stroke-linejoin="round"/>`;
  }

  if (e.t === 'texte')
    return `<text x="${e.x}" y="${e.y}" font-size="10" font-weight="700"
      fill="${clair ? '#1A1A18' : '#EDF3FA'}" font-family="DM Sans,sans-serif">${esc(e.s || '')}</text>`;

  const C = c(e.t) || '#EDF3FA';
  const L = Math.hypot(e.x2 - e.x1, e.y2 - e.y1);
  if (L < 3) return '';

  if (e.t === 'ecran'){
    // la barre est perpendiculaire au trait À SON ARRIVÉE (tangente de la courbe)
    const b = T.barre, d = pbTan(e, 1), px = -d.y, py = d.x;
    return `<g stroke="${C}" stroke-width="${T.trait + 0.3}" fill="none" stroke-linecap="round">
      <path d="${pbChemin(e)}"/>
      <line x1="${(e.x2 + px * b).toFixed(1)}" y1="${(e.y2 + py * b).toFixed(1)}"
            x2="${(e.x2 - px * b).toFixed(1)}" y2="${(e.y2 - py * b).toFixed(1)}"/></g>`;
  }
  if (e.t === 'dribble')
    return `<g><path d="${pbOndule(e)}" stroke="${C}" stroke-width="${T.trait}"
      fill="none" stroke-linecap="round"/>${pbFlecheTrait(e, C)}</g>`;

  /* MAIN À MAIN — le seul signe ajouté à la notation du tableau.
     Trait plein du porteur vers le receveur, coupé en son milieu par deux
     barres parallèles : le « # » du main à main. Il se lit comme une passe
     qu'on ne lance pas, et reste reconnaissable en noir et blanc. Sur un
     trait courbe, les barres se posent au milieu DE LA COURBE. */
  if (e.t === 'main'){
    const m = pbBez(e, 0.5), u = pbTan(e, 0.5), px = -u.y, py = u.x, b = 5, ecart = 2.4;
    const barre = s => `<line x1="${(m.x + u.x * s + px * b).toFixed(1)}" y1="${(m.y + u.y * s + py * b).toFixed(1)}"
      x2="${(m.x + u.x * s - px * b).toFixed(1)}" y2="${(m.y + u.y * s - py * b).toFixed(1)}"/>`;
    return `<g><g stroke="${C}" stroke-width="${T.trait}" fill="none" stroke-linecap="round">
      <path d="${pbChemin(e)}"/>${barre(-ecart)}${barre(ecart)}</g>
      ${pbFlecheTrait(e, C)}</g>`;
  }

  const tirets = e.t === 'passe' ? ' stroke-dasharray="5,3.5"' : '';
  return `<g><path d="${pbChemin(e)}" stroke="${C}" fill="none"
    stroke-width="${T.trait}" stroke-linecap="round"${tirets}/>
    ${pbFlecheTrait(e, C, e.t === 'tir')}</g>`;
}

const pbDessin = (els, clair) => (els || []).map(e => pbElement(e, clair)).join('');

  return {id: null, nom: '', categorie: 'Attaque placée', equipe: E.equipe,
          etapes: [{elements: [], note: ''}], i: 0, outil: 'joueur', provisoire: null};
}
const pbEtape = () => PB.etapes[PB.i];

function ouvrePlaybook(id){
  const s = (DB.systemes || []).find(x => x.id === id);
  PB = s ? JSON.parse(JSON.stringify({
        id: s.id, nom: s.nom, categorie: s.categorie, equipe: s.equipe,
        etapes: s.etapes, i: 0, outil: 'joueur', provisoire: null}))
      : nouveauSysteme();
  PB.i = 0; PB.outil = 'joueur'; PB.provisoire = null;
  rendVue(); window.scrollTo(0,0);
}

function pbVignette(t, clair){
  const petite = c => `<svg class="pb-min" viewBox="0 0 34 20">${c}</svg>`;
  const J = clair ? '#1A1A18' : '#FFB246';
  const D = clair ? '#0E6CA8' : '#3993D1';
  const B = clair ? '#B5462B' : '#F2564B';
  const G = clair ? '#8A8578' : '#93AAC6';
  if (t === 'joueur')  return petite(`<circle cx="17" cy="10" r="8" fill="none" stroke="${J}" stroke-width="2"/><text x="17" y="14" text-anchor="middle" font-size="10" font-weight="700" fill="${J}" font-family="DM Sans">1</text>`);
  if (t === 'def')     return petite(`<line x1="11" y1="4" x2="23" y2="16" stroke="${D}" stroke-width="2.4"/><line x1="23" y1="4" x2="11" y2="16" stroke="${D}" stroke-width="2.4"/>`);
  if (t === 'ballon')  return petite(`<circle cx="17" cy="10" r="5" fill="${B}"/>`);
  if (t === 'plot')    return petite(`<polygon points="17,4 23,16 11,16" fill="none" stroke="${G}" stroke-width="2"/>`);
  if (t === 'deplacer') return petite(`<path d="M17,3 L17,17 M10,10 L24,10 M17,3 l-2.5,3 M17,3 l2.5,3 M17,17 l-2.5,-3 M17,17 l2.5,-3 M10,10 l3,-2.5 M10,10 l3,2.5 M24,10 l-3,-2.5 M24,10 l-3,2.5" fill="none" stroke="${G}" stroke-width="1.6" stroke-linecap="round"/>`);
  if (t === 'main')    { const C = PB_COUL.main[clair ? 'clair' : 'nuit'];
                         return petite(`<g stroke="${C}" stroke-width="1.8" stroke-linecap="round"><line x1="5" y1="10" x2="24" y2="10"/><line x1="13" y1="5" x2="13" y2="15"/><line x1="17" y1="5" x2="17" y2="15"/></g>${pbFleche(5,10,27,10,C)}`); }
  if (t === 'gomme')   return petite(`<path d="M8,14 L18,4 L26,12 L20,18 L10,18 Z" fill="none" stroke="${G}" stroke-width="2"/>`);
  const C = PB_COUL[t][clair ? 'clair' : 'nuit'];
  if (t === 'dribble') return petite(`<path d="${pbOndule({x1: 5, y1: 10, x2: 25, y2: 10})}" stroke="${C}" stroke-width="2" fill="none"/>${pbFleche(5,10,27,10,C)}`);
  if (t === 'ecran')   return petite(`<line x1="5" y1="10" x2="25" y2="10" stroke="${C}" stroke-width="2.4"/><line x1="25" y1="4" x2="25" y2="16" stroke="${C}" stroke-width="2.4"/>`);
  const d = t === 'passe' ? ' stroke-dasharray="5,4"' : '';
  return petite(`<line x1="5" y1="10" x2="24" y2="10" stroke="${C}" stroke-width="2.4"${d}/>${pbFleche(5,10,27,10,C,t === 'tir')}`);
}

/* ─────────────────────────────── actions de l'éditeur */
function pbVaEtape(d){
  if (PB_ANIM) pbArrete();
  const n = PB.i + d;
  if (n < 0 || n >= PB.etapes.length) return;
  PB.i = n; PB.provisoire = null; rendVue();
}
/* LA SUITE D'UN TEMPS : où sont les joueurs quand les courses sont jouées.

   Jusqu'au 12/10/2026, « + Temps suivant » recopiait les joueurs à leur place
   de DÉPART : il fallait gommer et reposer chacun d'eux pour dessiner la suite
   — alors que la note du playbook promettait l'inverse. Désormais :
   · un joueur d'où part une course, un dribble ou un écran va au bout du trait ;
   · le ballon suit son porteur ; une passe ou un main à main l'emmène au
     joueur qui se trouve au bout du trait ;
   · le reste ne bouge pas. Les courses, elles, ne sont pas recopiées : c'est
     la suite qu'on dessine. */
const PB_ACCROCHE = 14;        // distance max entre un joueur et le départ de son trait
function pbSuite(els){
  const d = (a, x, y) => Math.hypot(a.x - x, a.y - y);
  const traits = els.filter(e => estTrait(e.t));
  const symboles = els.filter(e => !estTrait(e.t)).map(e => Object.assign({}, e));
  const joueurs = symboles.filter(e => e.t === 'joueur' || e.t === 'def');
  const ballon = symboles.find(e => e.t === 'ballon');

  // le porteur, AVANT que quiconque bouge
  const porteur = ballon ? joueurs.filter(j => j.t === 'joueur' && d(j, ballon.x, ballon.y) < 18)
                                  .sort((a, b) => d(a, ballon.x, ballon.y) - d(b, ballon.x, ballon.y))[0] : null;
  const decalage = porteur ? {x: ballon.x - porteur.x, y: ballon.y - porteur.y} : {x: 6, y: -6};
  const depart = new Map(joueurs.map(j => [j, {x: j.x, y: j.y}]));

  joueurs.forEach(j => {
    const t = traits.filter(e => ['cut', 'dribble', 'ecran'].includes(e.t) && d(j, e.x1, e.y1) < PB_ACCROCHE)
                    .sort((a, b) => d(j, a.x1, a.y1) - d(j, b.x1, b.y1))[0];
    if (t){ j.x = t.x2; j.y = t.y2; }
  });

  if (ballon){
    const p0 = porteur ? depart.get(porteur) : {x: ballon.x, y: ballon.y};
    const passe = traits.filter(e => (e.t === 'passe' || e.t === 'main')
                                     && Math.hypot(p0.x - e.x1, p0.y - e.y1) < PB_ACCROCHE + 6)[0];
    if (passe){
      const recoit = joueurs.filter(j => j.t === 'joueur' && j !== porteur && d(j, passe.x2, passe.y2) < 22)
                            .sort((a, b) => d(a, passe.x2, passe.y2) - d(b, passe.x2, passe.y2))[0];
      const ici = recoit || {x: passe.x2, y: passe.y2};
      ballon.x = +(ici.x + (recoit ? decalage.x : 0)).toFixed(1);
      ballon.y = +(ici.y + (recoit ? decalage.y : 0)).toFixed(1);
    } else if (porteur){
      ballon.x = +(porteur.x + decalage.x).toFixed(1);
      ballon.y = +(porteur.y + decalage.y).toFixed(1);
    }
  }
  return symboles;
}

function pbDupliqueEtape(){
  const suite = pbSuite(pbEtape().elements);
  PB.etapes.splice(PB.i + 1, 0, {elements: suite, note: ''});
  PB.i++; PB.provisoire = null;
  toast('Temps ajouté — chacun est au bout de sa course, trace la suite');
  rendVue();
}

/* ═══════════════════════════════════ LECTURE ANIMÉE ═══════════════════════════════════
   Les temps s'enchaînent : chaque joueur glisse de sa place au temps N vers sa
   place au temps N+1, le ballon avec lui, pendant que les courses du temps N
   restent affichées en transparence. On reconnaît un joueur d'un temps à
   l'autre par son signe et son numéro (attaquant 3 = attaquant 3) : aucun
   changement de format, les systèmes déjà enregistrés s'animent tels quels. */
let PB_ANIM = null;
const PB_DUREE = 1300, PB_PAUSE = 650;

function pbCle(e, i){
  if (e.t === 'joueur' || e.t === 'def') return e.t + e.n;
  if (e.t === 'ballon') return 'ballon';
  return e.t + '#' + i;            // plots, textes : par ordre d'apparition
}
function pbIndex(els){
  const m = new Map(), rang = {};
  els.filter(e => !estTrait(e.t)).forEach(e => {
    const k = (e.t === 'plot' || e.t === 'texte') ? e.t + '#' + (rang[e.t] = (rang[e.t] || 0) + 1) : pbCle(e);
    m.set(k, e);
  });
  return m;
}
const pbLisse = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

function pbImage(k, t){
  const A = PB.etapes[k].elements, B = (PB.etapes[k + 1] || PB.etapes[k]).elements;
  const ia = pbIndex(A), ib = pbIndex(B), u = pbLisse(Math.min(1, Math.max(0, t)));
  /* Un joueur (ou le ballon) dont le trajet a été dessiné COURBE suit la
     courbe, pas la corde. On reconnaît son trait à ses deux bouts : il part
     près de sa place au temps N et arrive près de sa place au temps N+1. Le
     ballon part de la main du porteur, pas de son centre : d'où la marge. */
  const courbes = A.filter(e => estTrait(e.t) && pbCourbe(e));
  const trajet = (a, b) => courbes
    .filter(e => Math.hypot(a.x - e.x1, a.y - e.y1) < 26 && Math.hypot(b.x - e.x2, b.y - e.y2) < 26)
    .sort((p, q) => Math.hypot(a.x - p.x1, a.y - p.y1) - Math.hypot(a.x - q.x1, a.y - q.y1))[0];
  const sur = (a, b) => {
    const tr = trajet(a, b);
    if (!tr) return {x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u};
    // même courbe, recalée sur les vraies places de départ et d'arrivée
    const c = {x: tr.cx + ((a.x - tr.x1) + (b.x - tr.x2)) / 2,
               y: tr.cy + ((a.y - tr.y1) + (b.y - tr.y2)) / 2};
    return pbBez({x1: a.x, y1: a.y, x2: b.x, y2: b.y, cx: c.x, cy: c.y}, u);
  };
  const sortie = [];
  ia.forEach((a, cle) => {
    const b = ib.get(cle);
    if (b){ const p = sur(a, b); sortie.push(Object.assign({}, a, {x: +p.x.toFixed(1), y: +p.y.toFixed(1)})); }
    else if (u < .5) sortie.push(a);                 // il quitte le dessin à mi-chemin
  });
  ib.forEach((b, cle) => { if (!ia.has(cle) && u >= .5) sortie.push(b); });   // il y entre
  const courses = A.filter(e => estTrait(e.t));
  return `<g opacity="${(0.85 - 0.55 * u).toFixed(2)}">${pbDessin(courses)}</g>${pbDessin(sortie)}`;
}

function pbJoue(){
  if (PB_ANIM) return pbArrete();
  if (!PB || PB.etapes.length < 2){ toast('Il faut au moins deux temps pour animer'); return; }
  PB_ANIM = {k: 0, t0: performance.now()};
  const bouton = document.getElementById('pbJouer');
  if (bouton) bouton.textContent = '■ Arrêter';
  const pas = maintenant => {
    if (!PB_ANIM || !PB) return;
    const s = document.getElementById('pbSvg');
    if (!s) { PB_ANIM = null; return; }
    let ecoule = maintenant - PB_ANIM.t0;
    if (ecoule > PB_DUREE + PB_PAUSE){
      PB_ANIM.k++; PB_ANIM.t0 = maintenant; ecoule = 0;
      if (PB_ANIM.k >= PB.etapes.length - 1){
        PB.i = PB.etapes.length - 1; PB_ANIM = null; rendVue(); return;
      }
    }
    const t = Math.max(0, ecoule - PB_PAUSE) / PB_DUREE;
    s.querySelectorAll('g[data-pb]').forEach(g => g.remove());
    s.insertAdjacentHTML('beforeend', `<g data-pb="1">${pbImage(PB_ANIM.k, t)}</g>`);
    const titre = document.getElementById('pbTempsTitre');
    if (titre) titre.textContent = t > 0 ? `Temps ${PB_ANIM.k + 1} → ${PB_ANIM.k + 2}` : `Temps ${PB_ANIM.k + 1}`;
    const note = document.getElementById('pbAnimNote');
    if (note) note.textContent = PB.etapes[PB_ANIM.k].note || '';
    PB_ANIM.raf = requestAnimationFrame(pas);
  };
  PB_ANIM.raf = requestAnimationFrame(pas);
}
function pbArrete(){
  if (PB_ANIM && PB_ANIM.raf) cancelAnimationFrame(PB_ANIM.raf);
  PB_ANIM = null;
  if (PB) rendVue();
}
/* Depuis la liste : ouvrir le système et lancer la lecture d'un geste. */
function animeSysteme(id){
  ouvrePlaybook(id);
  setTimeout(pbJoue, 60);
}

/* ═══════════════════════════════════ L'ANIMATION EN VIDÉO ═══════════════════════════════════
   Fathy (12/10/2026) : « faire passer les planches de système en vidéo ». La
   lecture animée existe dans la plateforme ; ce qui manquait, c'est un FICHIER
   qu'on envoie au groupe sur WhatsApp et que le joueur regarde sans compte.

   Comment. La même image que la lecture (pbImage) est dessinée image par
   image sur un canevas, que le navigateur enregistre lui-même (MediaRecorder).
   Rien ne part sur un serveur, rien n'est installé : la vidéo naît dans le
   téléphone. Sous le terrain, un bandeau porte le nom du système, le temps en
   cours et sa consigne — la vidéo doit se comprendre sans le coach à côté.

   Le format est celui que le navigateur sait écrire : MP4 sur iPhone (Safari),
   WebM sur Android et ordinateur. WhatsApp lit les deux. Sur téléphone, on
   ouvre directement le menu de partage ; sinon, le fichier se télécharge. */
const PB_VID = {echelle: 2, bandeau: 92, ips: 30, debut: 900, fin: 1600};
let PB_VIDEO = false;

/* L'ORDRE COMPTE (mesuré le 12/10/2026). Un « video/mp4 » sans codec précisé
   est accepté par Chromium… qui y range du VP9 : un MP4 que l'iPhone lit mal,
   alors que la vidéo est faite pour WhatsApp. D'où :
   1. H.264 nommé explicitement, quand le navigateur sait l'écrire ;
   2. sur Apple (Safari), le MP4 générique — Safari y met du H.264 ;
   3. ailleurs, WebM, que WhatsApp lit sur Android et sur ordinateur ;
   4. le MP4 générique en tout dernier recours. */
function pbFormatVideo(){
  if (typeof MediaRecorder === 'undefined') return null;
  const ok = f => { try { return MediaRecorder.isTypeSupported(f); } catch (e){ return false; } };
  const apple = /Apple/.test(navigator.vendor || '');
  const formats = ['video/mp4;codecs=avc1.42E01E', 'video/mp4;codecs=avc1.4D401F', 'video/mp4;codecs=avc1']
    .concat(apple ? ['video/mp4'] : [])
    .concat(['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4']);
  return formats.find(ok) || null;
}

/* Le terrain en SVG autonome : une image dessinée sur un canevas ne voit ni
   les variables CSS ni les polices de la page. */
function pbSvgAutonome(contenu){
  return terrainPlaybook('pbVid', contenu)
    .replace('<svg class="pb-svg" id="pbVid"', '<svg')
    .replace(/var\(--or\)/g, '#FFB246');
}

function pbChargeImage(svg){
  return new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = () => ko(new Error('image du terrain illisible'));
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function pbBandeau(ctx, L, y, h, nom, temps, note){
  ctx.fillStyle = '#04101F'; ctx.fillRect(0, y, L, h);
  ctx.fillStyle = '#FFB246'; ctx.fillRect(0, y, L, 3);
  ctx.textBaseline = 'top';
  ctx.fillStyle = '#FFB246'; ctx.font = '700 26px "DM Sans", Arial, sans-serif';
  ctx.fillText(temps, 22, y + 14);
  const larg = ctx.measureText(temps).width;
  ctx.fillStyle = '#EDF3FA'; ctx.font = '600 22px "DM Sans", Arial, sans-serif';
  ctx.fillText(('· ' + nom).slice(0, 60), 22 + larg + 10, y + 17);
  // la consigne, sur deux lignes au plus
  ctx.fillStyle = 'rgba(237,243,250,.78)'; ctx.font = '400 19px "DM Sans", Arial, sans-serif';
  const mots = (note || '').split(/\s+/).filter(Boolean), lignes = [''];
  mots.forEach(m => {
    const essai = (lignes[lignes.length - 1] + ' ' + m).trim();
    if (ctx.measureText(essai).width > L - 44 && lignes[lignes.length - 1]) lignes.push(m);
    else lignes[lignes.length - 1] = essai;
  });
  lignes.slice(0, 2).forEach((l, i) => {
    const txt = i === 1 && lignes.length > 2 ? l.replace(/.{0,2}$/, '…') : l;
    ctx.fillText(txt, 22, y + 48 + i * 22);
  });
}

async function pbExporteVideo(){
  if (PB_VIDEO) return;
  if (!PB || PB.etapes.length < 2){ toast('Il faut au moins deux temps pour faire une vidéo'); return; }
  const format = pbFormatVideo();
  if (!format){ toast('Ce navigateur ne sait pas enregistrer de vidéo — essaie Chrome ou Safari à jour'); return; }
  if (PB_ANIM) pbArrete();

  PB_VIDEO = true;
  const nom = (PB.nom || '').trim() || 'Système';
  const vb = {x: -PB_HORS, y: -PB_HORS, l: PB_L + 2 * PB_HORS, h: PB_H + PB_HORS};
  const e = PB_VID.echelle;
  const L = Math.round(vb.l * e / 2) * 2, Ht = Math.round(vb.h * e / 2) * 2;   // dimensions paires : exigées par les encodeurs
  const toile = document.createElement('canvas');
  toile.width = L; toile.height = Ht + PB_VID.bandeau;
  const ctx = toile.getContext('2d');

  const flux = toile.captureStream(PB_VID.ips);
  const morceaux = [];
  const rec = new MediaRecorder(flux, {mimeType: format, videoBitsPerSecond: 2500000});
  rec.ondataavailable = ev => { if (ev.data && ev.data.size) morceaux.push(ev.data); };
  const fini = new Promise(ok => { rec.onstop = ok; });

  const bouton = document.getElementById('pbVideo');
  const n = PB.etapes.length - 1;
  const total = PB_VID.debut + n * (PB_PAUSE + PB_DUREE) + PB_VID.fin;
  if (bouton){ bouton.disabled = true; bouton.textContent = 'Enregistrement… ' + Math.ceil(total / 1000) + ' s'; }

  try {
    /* Une image = un état (temps, avancement). On la dessine, puis on attend
       l'horloge : la vidéo dure exactement le temps de la lecture. */
    const image = async (k, t, titre, note) => {
      const im = await pbChargeImage(pbSvgAutonome(pbImage(k, t)));
      ctx.drawImage(im, 0, 0, L, Ht);
      pbBandeau(ctx, L, Ht, PB_VID.bandeau, nom, titre, note);
    };
    await image(0, 0, 'Temps 1', PB.etapes[0].note);
    rec.start(250);
    const t0 = performance.now();
    let fait = false;
    while (!fait){
      const ecoule = performance.now() - t0;
      if (ecoule < PB_VID.debut){
        await image(0, 0, 'Temps 1', PB.etapes[0].note);
      } else if (ecoule < total - PB_VID.fin){
        const r = ecoule - PB_VID.debut, k = Math.min(n - 1, Math.floor(r / (PB_PAUSE + PB_DUREE)));
        const dans = r - k * (PB_PAUSE + PB_DUREE), t = Math.max(0, dans - PB_PAUSE) / PB_DUREE;
        await image(k, t, t > 0 ? `Temps ${k + 1} → ${k + 2}` : `Temps ${k + 1}`, PB.etapes[k].note);
      } else if (ecoule < total){
        // le dernier temps, tenu : on voit où chacun est arrivé
        const k = n - 1;
        await image(k, 1, `Temps ${n + 1}`, PB.etapes[n].note);
      } else fait = true;
      if (bouton) bouton.textContent = 'Enregistrement… ' + Math.max(0, Math.ceil((total - ecoule) / 1000)) + ' s';
      await new Promise(r => setTimeout(r, 1000 / PB_VID.ips));
    }
    rec.stop();
    await fini;

    const type = format.split(';')[0];
    const ext = type === 'video/mp4' ? 'mp4' : 'webm';
    const fichierNom = nom.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                          .replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase() + '.' + ext;
    const blob = new Blob(morceaux, {type});
    PB_DERNIERE_VIDEO = {blob, nom: fichierNom};
    await pbLivreVideo(blob, fichierNom);
  } catch (err){
    try { if (rec.state !== 'inactive') rec.stop(); } catch (e){}
    toast('La vidéo n\'a pas pu être enregistrée : ' + (err && err.message || err));
  } finally {
    PB_VIDEO = false;
    flux.getTracks().forEach(t => t.stop());
    if (bouton){ bouton.disabled = false; bouton.textContent = '⤓ Vidéo à partager'; }
  }
}
let PB_DERNIERE_VIDEO = null;

/* Le menu de partage du téléphone d'abord (WhatsApp y est), le
   téléchargement sinon. Le partage peut être refusé — par exemple si trop de
   temps s'est écoulé depuis le geste qui l'a demandé : on télécharge alors. */
async function pbLivreVideo(blob, nomFichier){
  const fichier = (typeof File === 'function') ? new File([blob], nomFichier, {type: blob.type}) : null;
  if (fichier && navigator.canShare && navigator.canShare({files: [fichier]})){
    try {
      await navigator.share({files: [fichier], title: nomFichier});
      toast('Vidéo prête à envoyer');
      return;
    } catch (e){
      if (e && e.name === 'AbortError') { toast('Partage annulé — la vidéo reste téléchargeable'); }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomFichier; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  toast('Vidéo enregistrée — ' + nomFichier);
}
function pbOteEtape(){
  if (PB.etapes.length <= 1) return;
  PB.etapes.splice(PB.i, 1);
  PB.i = Math.max(0, PB.i - 1);
  rendVue();
}
function pbVideEtape(){ pbEtape().elements = []; PB.provisoire = null; rendVue(); }
function pbAnnule(){
  const els = pbEtape().elements;
  if (!els.length) { toast('Rien à annuler'); return; }
  els.pop(); PB.provisoire = null; rendVue();
}

/* ─────────────────────────────── pointeur : poser un symbole ou tirer un trait */
function pbPoint(ev, svg){
  const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
  /* + vb.x / vb.y : depuis la bande hors terrain, l'origine du dessin n'est
     plus en haut à gauche de l'image. Sans ce décalage, chaque symbole se
     poserait 30 unités à côté du doigt. */
  const x = vb.x + (ev.clientX - r.left) * vb.width / r.width;
  const y = vb.y + (ev.clientY - r.top) * vb.height / r.height;
  return {x: +Math.min(vb.x + vb.width, Math.max(vb.x, x)).toFixed(1),
          y: +Math.min(vb.y + vb.height, Math.max(vb.y, y)).toFixed(1)};
}

/* Le symbole le plus proche du doigt, s'il est assez près pour être visé. */
function pbSymboleProche(p, max){
  let pris = null, min = max || 18;
  pbEtape().elements.forEach(e => {
    if (estTrait(e.t)) return;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < min){ min = d; pris = e; }
  });
  return pris;
}

function branchePlaybook(){
  const enrob = document.getElementById('pbEnrob');
  if (!enrob || enrob._pb) return;
  enrob._pb = true;
  let depart = null;
  let saisi = null;            // le symbole qu'on fait glisser avec l'outil Déplacer
  let courbe = null;           // ou le trait qu'on courbe en tirant son milieu

  const svg = () => document.getElementById('pbSvg');

  enrob.addEventListener('pointerdown', ev => {
    const s = svg(); if (!s || !PB || PB_ANIM) return;
    const p = pbPoint(ev, s);
    if (PB.outil === 'deplacer'){
      /* un symbole d'abord : un joueur posé sur le milieu d'une course doit
         rester attrapable ; sinon, le milieu d'un trait, qu'on courbe */
      saisi = pbSymboleProche(p, 20);
      if (!saisi) courbe = pbTraitProche(p, 20);
      if (!saisi && !courbe){ toast('Vise un joueur, le ballon, un plot — ou le milieu d\'un trait pour le courber'); return; }
      enrob.setPointerCapture(ev.pointerId);
      return;
    }
    if (estTrait(PB.outil)){
      depart = p;
      enrob.setPointerCapture(ev.pointerId);
    } else {
      poseSymbole(p);
    }
  });

  enrob.addEventListener('pointermove', ev => {
    if ((saisi || courbe) && PB){
      const s = svg(); if (!s) return;
      const p = pbPoint(ev, s);
      if (saisi){ saisi.x = p.x; saisi.y = p.y; }
      else pbCourbeVers(courbe, p);
      majDessinPb();
      return;
    }
    if (!depart || !PB) return;
    const s = svg(); if (!s) return;
    const p = pbPoint(ev, s);
    PB.provisoire = {t: PB.outil, x1: depart.x, y1: depart.y, x2: p.x, y2: p.y};
    majDessinPb();
  });

  enrob.addEventListener('pointerup', ev => {
    if (saisi || courbe){ saisi = null; courbe = null; rendVue(); return; }
    if (!depart || !PB) return;
    const s = svg();
    const p = s ? pbPoint(ev, s) : null;
    const d0 = depart; depart = null; PB.provisoire = null;
    if (p && Math.hypot(p.x - d0.x, p.y - d0.y) > 8){
      pbEtape().elements.push({t: PB.outil, x1: d0.x, y1: d0.y, x2: p.x, y2: p.y});
    }
    rendVue();
  });
  enrob.addEventListener('pointercancel', () => { depart = null; saisi = null; courbe = null; if (PB) PB.provisoire = null; rendVue(); });
}

function poseSymbole(p){
  const els = pbEtape().elements;
  if (PB.outil === 'deplacer') return;
  if (PB.outil === 'gomme'){
    let k = -1, min = 26;
    els.forEach((e, i) => {
      const d = estTrait(e.t)
        ? Math.min(Math.hypot(e.x1 - p.x, e.y1 - p.y), Math.hypot(e.x2 - p.x, e.y2 - p.y))
        : Math.hypot(e.x - p.x, e.y - p.y);
      if (d < min){ min = d; k = i; }
    });
    if (k >= 0) els.splice(k, 1); else toast('Rien à cet endroit');
    return rendVue();
  }
  if (PB.outil === 'ballon'){
    const i = els.findIndex(e => e.t === 'ballon');
    if (i >= 0) els.splice(i, 1);
    els.push({t: 'ballon', x: p.x, y: p.y});
    return rendVue();
  }
  if (PB.outil === 'plot'){
    els.push({t: 'plot', x: p.x, y: p.y});
    return rendVue();
  }
  // attaquant ou défenseur : on prend le premier numéro libre, 5 au maximum
  const pris = els.filter(e => e.t === PB.outil).map(e => e.n);
  const n = [1,2,3,4,5].find(k => !pris.includes(k));
  if (!n) { toast(PB.outil === 'joueur' ? 'Cinq attaquants au maximum' : 'Cinq défenseurs au maximum'); return; }
  els.push({t: PB.outil, n, x: p.x, y: p.y});
  rendVue();
}

/* Pendant le glissé on ne re-rend que le SVG : re-rendre l'écran entier
   couperait le suivi du doigt. */
function majDessinPb(){
  const s = document.getElementById('pbSvg');
  if (!s || !PB) return;
  const els = pbEtape().elements.concat(PB.provisoire ? [PB.provisoire] : []);
  s.querySelectorAll('g[data-pb]').forEach(g => g.remove());
  s.insertAdjacentHTML('beforeend', `<g data-pb="1">${pbDessin(els)}</g>`);
}

/* ─────────────────────────────── enregistrement */
function enregistreSysteme(){
  const nom = (PB.nom || '').trim();
  if (!nom) { toast('Donne un nom au système'); return; }
  if (!PB.etapes.some(e => e.elements.length)) { toast('Le terrain est vide'); return; }

  const s = {id: PB.id || ('sy' + Date.now()), nom, categorie: PB.categorie, equipe: PB.equipe,
             auteur: (E.moi || {}).id || E.role, date: AUJ_FR(),
             etapes: PB.etapes.map(e => ({elements: e.elements, note: (e.note || '').trim()}))};
  DB.systemes = DB.systemes || [];
  const i = DB.systemes.findIndex(x => x.id === s.id);
  if (i >= 0) DB.systemes[i] = s; else DB.systemes.unshift(s);

  enregistrer('systemes', {id_systeme: s.id, nom: s.nom, categorie: s.categorie,
                           equipe_code: s.equipe, etapes: s.etapes,
                           auteur_id: (E.moi || {}).id || null, maj: maintenant().toISOString()},
              /* (club_id, id_systeme) : c'est LA contrainte unique de la table.
                 « id_systeme » seul ne correspond à aucune, et Postgres refuse
                 alors toute l'écriture — chaque système partait en 400 et sortait
                 de la file. C'est la vraie raison du playbook vide (12/10/2026). */
              'club_id,id_systeme');
  if (i < 0) journalChat(`a ajouté un système au playbook — « ${nom} » · ${nomEq(s.equipe)}`);
  toast(i >= 0 ? 'Système mis à jour' : 'Système enregistré');
  PB = null;
  rendVue(); rendNav(); window.scrollTo(0,0);
}

/* ══════════════════════════════════════════════════════════════════════════
   SOURCE DES DONNÉES — le seul endroit à modifier pour brancher la plateforme

   Tant que `mode` vaut 'demo', la page tourne sur le jeu de données fictives
   et ne contacte rien. Le jour du branchement : mode 'supabase', l'adresse du
   projet et sa clé publique. Aucun écran n'a à changer — tous lisent l'objet
   DB, qui est rempli ici, et écrivent par `enregistrer()`, qui route ici.

   TOUTE écriture passe d'abord par une file d'attente durable (IndexedDB).
   Rien ne part directement au réseau : on écrit, on rend la main à l'écran,
   et la file se vide quand la connexion le permet. À Adjamé, la coupure est
   la norme, pas l'incident : une session de tir saisie sans réseau doit se
   retrouver intacte le lendemain, même si le téléphone a été éteint entre-temps.
   ══════════════════════════════════════════════════════════════════════════ */

const SOURCE = {
  mode: 'supabase',            // 'demo' | 'supabase'
  url:  'https://ptkefnqrhlsfbnktnvec.supabase.co',                // https://xxxx.supabase.co
  cle:  'sb_publishable_mQyPb28euafQQ8p05U3XAg_zPvMeVAW',                // clé « anon » du projet (Settings > API)
  club: 'ASA',
  jeton: null,             // jeton de session, posé à la connexion
  membre: null             // ligne de `membres` de la personne connectée
};

const enLigne = () => SOURCE.mode === 'supabase';

/* ─────────────────────────────────────────── appels REST */
async function api(chemin, opts){
  opts = opts || {};
  let r;
  const t0 = Date.now();
  try {
    r = await fetch(SOURCE.url + '/rest/v1/' + chemin, {
      method: opts.methode || 'GET',
      headers: Object.assign({
        'apikey': SOURCE.cle,
        'Authorization': 'Bearer ' + (SOURCE.jeton || SOURCE.cle),
        'Content-Type': 'application/json'
      }, opts.entetes || {}),
      body: opts.corps ? JSON.stringify(opts.corps) : undefined
    });
  } catch (e){
    // fetch ne rejette que sur coupure réseau : c'est le cas qu'on veut réessayer
    const err = new Error('Réseau injoignable sur « ' + chemin + ' »');
    err.reseau = true;
    throw err;
  }
  /* L'heure du serveur, à chaque réponse, même en erreur : c'est elle qui
     corrige un téléphone mal réglé (voir L'HEURE DU CLUB, p3a). */
  try { recaleHorloge(r.headers.get('date'), t0, Date.now()); } catch (e) {}
  if (!r.ok){
    const err = new Error('Plateforme (' + r.status + ') sur « ' + chemin + ' » : ' +
                          (await r.text()).slice(0, 200));
    err.statut = r.status;
    throw err;
  }
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

/* ══════════════════════════════════════════════════════════════════════════
   FILE D'ATTENTE DURABLE
   IndexedDB de préférence — elle survit à la fermeture de l'onglet, à
   l'extinction du téléphone et tient des volumes sans commune mesure avec
   localStorage. Repli sur localStorage si le navigateur la refuse (navigation
   privée de certains Android).
   ══════════════════════════════════════════════════════════════════════════ */

const FA = {
  base: null,
  mode: null,              // 'idb' | 'ls'
  cleLs: 'asa.file',

  async init(){
    if (this.mode) return this.mode;
    try {
      this.base = await new Promise((ok, ko) => {
        if (!('indexedDB' in window)) return ko(new Error('sans IndexedDB'));
        const r = indexedDB.open('bizon-asa', 1);
        r.onupgradeneeded = () => {
          if (!r.result.objectStoreNames.contains('file'))
            r.result.createObjectStore('file', {keyPath: 'id', autoIncrement: true});
        };
        r.onsuccess = () => ok(r.result);
        r.onerror   = () => ko(r.error || new Error('IndexedDB refusée'));
        setTimeout(() => ko(new Error('IndexedDB muette')), 2500);
      });
      this.mode = 'idb';
    } catch (e){
      this.mode = 'ls';
    }
    return this.mode;
  },

  _tx(acces){
    return this.base.transaction('file', acces).objectStore('file');
  },
  _ls(){
    try { return JSON.parse(localStorage.getItem(this.cleLs) || '[]'); }
    catch (e){ return []; }
  },
  _ecrisLs(t){
    try { localStorage.setItem(this.cleLs, JSON.stringify(t)); } catch (e){}
  },

  async tout(){
    await this.init();
    if (this.mode === 'ls') return this._ls();
    return new Promise(ok => {
      const d = this._tx('readonly').getAll();
      d.onsuccess = () => ok(d.result || []);
      d.onerror   = () => ok([]);
    });
  },

  async pousser(o){
    await this.init();
    if (this.mode === 'ls'){
      const t = this._ls();
      o.id = (t.length ? t[t.length - 1].id : 0) + 1;
      t.push(o); this._ecrisLs(t); return o.id;
    }
    return new Promise(ok => {
      const d = this._tx('readwrite').add(o);
      d.onsuccess = () => ok(d.result);
      d.onerror   = () => ok(null);
    });
  },

  async oter(id){
    await this.init();
    if (this.mode === 'ls'){ this._ecrisLs(this._ls().filter(x => x.id !== id)); return; }
    return new Promise(ok => {
      const d = this._tx('readwrite').delete(id);
      d.onsuccess = d.onerror = () => ok();
    });
  },

  async compte(){ return (await this.tout()).length; }
};

  sessions_tir:'Session de tir', tirs:'Tir en match', tirs_opposition:'Tir en opposition', oppositions:'Opposition',
  seances:'Séance', departs:'Départ anticipé', medical:'Signalement médical', messages:'Message au staff',

  rapports:'Rapport au président', exercices:'Exercice',

};

/* Les tables qui n'ont PAS de colonne club_id. Voir envoyerElement() pour le
   pourquoi — et pour ce qui arriverait si on l'oubliait. */
/* « quiz_reponses » s'y ajoute le 12/10/2026 : sa clé est (quiz_id, joueur_id)
   et elle n'a jamais eu de club_id. Chaque réponse d'un joueur partait avec
   un club_id ajouté ici, revenait en 400 et sortait de la file. */
const SANS_CLUB = ['presences', 'quiz_reponses', 'departs'];

/* Un identifiant définitif, fabriqué dans la page au moment de la saisie.

   Pourquoi (12/10/2026). Les signalements médicaux, quiz, exercices et
   oppositions naissaient avec un identifiant local (« m1728… ») et la base leur
   en donnait un autre (un uuid). Toute action ultérieure sur la même ligne
   — changer un statut médical, adapter un exercice tout juste déposé — visait
   l'identifiant local, que la base ne connaît pas : 400, et la saisie sortait
   de la file. On fabrique donc l'uuid ICI et on l'envoie : la page et la base
   parlent de la même ligne dès la première seconde, hors ligne compris. */
function nouvelId(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const o = crypto.getRandomValues(new Uint8Array(16));
  o[6] = (o[6] & 0x0f) | 0x40; o[8] = (o[8] & 0x3f) | 0x80;
  const h = Array.from(o, b => b.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
}

/* ─────────────────────────────────────────── écriture
   Tous les écrans passent par ici : on dépose dans la file et on rend la main
   immédiatement. Aucun écran n'attend le réseau, aucune saisie ne se perd. */
/* L'identifiant du club, tel que la base le connaît.

   Il n'est PAS posé à la connexion : la fonction Edge rend le rôle et le nom
   de la personne, pas le club. Il arrive au premier chargement, quand la
   plateforme demande son club par son sigle — et il est rangé dans la session
   pour que la réouverture hors ligne l'ait aussi. */
function clubCourant(){
  return SOURCE.clubId
      || (SESSION && SESSION.clubId)
      || (SOURCE.membre && SOURCE.membre.club_id)
      || null;
}

async function enregistrer(table, ligne, surConflit){
  /* On NE met PAS le club dans la ligne ici.
     Il est ajouté au moment de l'envoi, pas au moment de la saisie. La
     différence compte : une saisie faite avant le premier chargement — ou
     hors ligne, ce qui est la règle à Adjamé — ne connaît pas encore le
     club. L'écrire maintenant graverait « null » dans la file, et toutes les
     tables de la plateforme ont club_id en « not null » : la base répondrait
     400, et le traitement des 4xx juste en dessous SORTIRAIT la saisie de la
     file en la présentant comme refusée. Un message, un signalement médical,
     un système de playbook : jetés, avec un motif qui accuse la base. */
  await FA.pousser({
    table, surConflit: surConflit || null,
    corps: ligne,
    demo: !enLigne(),
    quand: maintenant().getTime(),
    par: (E && E.moi && E.moi.nom) || ''
  });
  await majFile();
  videFile();              // volontairement sans await
  return true;
}

/* Modifier une ligne qui existe déjà — un statut, un « vu », un « lu ».

   Pourquoi une deuxième porte (12/10/2026). Ces changements passaient par
   enregistrer() avec une ligne réduite à {id, statut}. C'est une INSERTION qui
   se rabat sur une mise à jour en cas de doublon — et Postgres vérifie les
   colonnes obligatoires de la ligne proposée AVANT de constater le doublon.
   {id, statut} n'a ni joueur, ni type : refusée à chaque fois, sortie de la
   file. Même chose pour « consignes lues », qui visait en plus une clé
   (joueur_id) qui n'est unique nulle part.

   Ici on envoie un vrai PATCH, limité par un filtre. Il passe par la même file
   durable que tout le reste : hors ligne, il attend. */
async function modifier(table, filtre, champs){
  await FA.pousser({
    table, filtre, methode: 'PATCH',
    corps: champs,
    demo: !enLigne(),
    quand: maintenant().getTime(),
    par: (E && E.moi && E.moi.nom) || ''
  });
  await majFile();
  videFile();
  return true;
}

/* envoi d'un élément — en démonstration, on simule le trajet réseau pour que
   le comportement hors ligne soit exactement le même que le jour du branchement */
async function envoyerElement(it){
  if (it.demo || !enLigne()){
    await new Promise(r => setTimeout(r, 90));
    return;
  }

  /* Le club est ajouté ICI, au dernier moment, et jamais deviné. S'il n'est
     pas connu, on ne tente pas l'envoi : une ligne sans club_id revient en
     400, et un 400 fait sortir la saisie de la file. On lève une erreur sans
     statut, que videFile() traite comme une coupure — la saisie RESTE en
     file et repartira au prochain passage, une fois le club chargé. */
  const club = clubCourant();
  if (!club) throw new Error('club pas encore chargé — on garde la saisie en file');

  /* « presences » n'a PAS de colonne club_id, et c'est voulu : une présence
     tient son club de sa séance, et les politiques de lecture font déjà la
     jointure. Dupliquer la colonne créerait deux vérités qui peuvent se
     contredire — une présence rattachée à la séance d'un club et marquée d'un
     autre.

     Mais la conséquence pratique est brutale : si on ajoutait club_id ici comme
     pour toutes les autres tables, PostgREST répondrait 400, et un 400 fait
     SORTIR la ligne de la file en la présentant comme refusée par la base.
     L'appel du gymnase disparaîtrait, sans réseau et sans message. D'où cette
     liste, et d'où le contrôle automatique qui la vérifie. */
  const sansClub = SANS_CLUB.indexOf(it.table) >= 0;

  /* Une modification : le club va dans le FILTRE, pas dans le corps. On ne
     touche ainsi qu'aux lignes de son club, même si la politique de sécurité
     venait un jour à être plus large qu'elle ne l'est. */
  if (it.methode === 'PATCH'){
    await api(it.table + '?' + it.filtre + (sansClub ? '' : '&club_id=eq.' + club), {
      methode: 'PATCH',
      corps: it.corps,
      entetes: {'Prefer': 'return=minimal'}
    });
    return;
  }

  const corps = sansClub
    ? it.corps
    : Object.assign({club_id: club}, it.corps);

  await api(it.table + (it.surConflit ? '?on_conflict=' + it.surConflit : ''), {
    methode: 'POST',
    corps: corps,
    entetes: {'Prefer': 'resolution=merge-duplicates,return=minimal'}
  });
}

async function videFile(){
  if (FA_EN_COURS) return;

  /* Le drapeau se pose AVANT le moindre await, et c'est tout l'enjeu.

     Il était posé quatre lignes plus bas, après « await FA.tout() ». Or
     enregistrer() appelle videFile() sans l'attendre : une action qui écrit
     plusieurs lignes d'un coup — une séance et ses présences, par exemple — en
     déclenche donc plusieurs en rafale. Toutes franchissaient le test avant
     que la première ne pose le drapeau, toutes lisaient la MÊME file, et toutes
     envoyaient TOUTES les lignes.

     Mesuré par verif_appel.js : un seul enregistrement de séance par
     l'analyste — quatre écritures en rafale — faisait partir chaque ligne
     QUATRE fois. Invisible en base, parce que les écritures sont des upserts
     sur une clé de conflit. Mais c'est quatre fois le forfait mobile à Abidjan,
     et deux parcours concurrents qui retirent les mêmes éléments de la file :
     de quoi perdre une saisie au lieu de la dupliquer. */
  FA_EN_COURS = true;

  let items;
  try {
    items = await FA.tout();
  } catch (e){
    FA_EN_COURS = false;
    throw e;
  }
  if (!items.length){
    FA_EN_COURS = false;
    FA_ETAT = FA_REFUS.length ? 'refus' : 'vide';
    return majFile();
  }
  if (navigator.onLine === false){
    FA_EN_COURS = false;
    FA_ETAT = 'attente';
    return majFile();
  }

  FA_ETAT = 'envoi'; await majFile();

  /* Un jeton Supabase dure une heure. Sans ce rafraîchissement, tout ce qui
     part après ce délai revient en 401 — et le traitement des 4xx juste en
     dessous jetterait les saisies en les présentant comme refusées par la
     base. Une séance saisie en fin d'entraînement serait perdue. */
  if (enLigne()) await rafraichitSession();

  let envoyes = 0;
  try {
    for (const it of items){
      try {
        await envoyerElement(it);
        await FA.oter(it.id); envoyes++;
      } catch (e){
        /* 401/403 : ce n'est pas la ligne qui est refusée, c'est la session
           qui a expiré. La jeter serait détruire une saisie valide. On garde
           tout en file : la reprise périodique repasse par le rafraîchissement
           ci-dessus, et si le jeton est bel et bien mort, la personne se
           reconnecte et sa saisie repart. */
        /* SAUF le refus d'une règle d'accès (code Postgres 42501, rendu en
           403 par PostgREST avec un jeton valide). Là, c'est bien la LIGNE
           qui est refusée, et la session est saine. La traiter comme une
           session expirée gardait la ligne en tête de file pour toujours —
           et bloquait derrière elle tout ce que l'appareil écrivait ensuite :
           messages, systèmes, présences. Vu le 12/10/2026 sur les adaptations
           d'exercices des coachs. Elle sort de la file et elle est signalée. */
        const refusRegle = e.statut === 403 && /42501|row-level security/i.test(e.message || '');
        if ((e.statut === 401 || e.statut === 403) && !refusRegle){
          FA_ETAT = 'attente';
          break;
        }
        if (refusRegle){
          await FA.oter(it.id);
          FA_REFUS.push({table: it.table, quand: it.quand, motif: 'refusé par les règles d\'accès'});
          continue;
        }
        // Les autres 4xx : la base refuse la ligne elle-même. La réessayer
        // indéfiniment bloquerait tout ce qui suit — on la sort et on signale.
        if (e.statut && e.statut >= 400 && e.statut < 500 && e.statut !== 408 && e.statut !== 429){
          await FA.oter(it.id);
          FA_REFUS.push({table: it.table, quand: it.quand, motif: e.message});
          continue;
        }
        FA_ETAT = 'attente';        // coupure : on garde l'ordre d'écriture
        break;
      }
    }
  } finally {
    FA_EN_COURS = false;
    const reste = await FA.compte();
    if (!reste && FA_ETAT !== 'attente') FA_ETAT = FA_REFUS.length ? 'refus' : (envoyes ? 'ok' : 'vide');
    await majFile();
    if (FA_ETAT === 'ok') setTimeout(() => { if (FA_ETAT === 'ok'){ FA_ETAT = 'vide'; majFile(); } }, 4000);
  }
  planifieReprise();
}

/* réessai périodique tant qu'il reste quelque chose à envoyer */

  clearTimeout(FA_MINUTERIE);
  if (FA_NB > 0) FA_MINUTERIE = setTimeout(videFile, 45000);
}
