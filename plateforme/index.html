<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Politique de sécurité. Reprise de Sniper (s1_head.html), adaptée au fait
     que la plateforme charge ses polices chez Google.

     default-src 'none' : par défaut, la page ne peut joindre personne. Chaque
     autorisation est ensuite nommée, et https://ptkefnqrhlsfbnktnvec.supabase.co porte l'adresse EXACTE du
     projet Supabase — jamais un joker. En démonstration le jeton vaut 'none' :
     le fichier ne doit alors pouvoir contacter aucun serveur, et c'est
     vérifiable plutôt que promis.

     'unsafe-inline' sur script et style est la contrepartie assumée du fichier
     unique : tout le code et tout le style sont dans la page. Ce que la
     politique protège quand même, c'est ce que la page a le droit de JOINDRE,
     et c'est là qu'est le risque pour un fichier public. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'unsafe-inline';
  style-src 'unsafe-inline' https://fonts.googleapis.com;
  font-src https://fonts.gstatic.com;
  img-src data: blob:;
  connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://ptkefnqrhlsfbnktnvec.supabase.co;
  worker-src 'self';
  manifest-src 'self';
  base-uri 'none';
  form-action 'none'">
<title>ASA Plateforme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --nuit:#04101F; --fond2:#051630;
  --surface:#0A1F3D; --surface2:#0E2A4C; --surface3:#153A63;
  --ligne:#183A5E; --ligne2:#27578A;
  --or:#FFB246; --or-clair:#FFCB7E; --or-sombre:#B58D1E; --or-texte:#8A5200;
  --texte:#EDF3FA; --gris:#93AAC6; --gris2:#62809E;
  --attaque:#F2564B; --defense:#3993D1; --physique:#4FA83A;
  --analyste:#A47FE0; --medical:#4FC4C0; --hc:#FFB246; --dt:#FFCB7E;
  --ok:#4FA83A; --alerte:#E8A33D; --danger:#E0564B;
  --r:16px; --r2:11px;
  --titre:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
  --corps:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --ombre:0 14px 40px rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--nuit); color:var(--texte); font-family:var(--corps);
  font-size:15px; line-height:1.5; overflow-x:hidden; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
a{color:var(--or)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--ligne2);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ─────────────────────────────── utilitaires */
.titre{font-family:var(--titre);letter-spacing:1.5px;line-height:1;text-transform:uppercase}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.centre{text-align:center}
.g2{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{display:grid;gap:8px;grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{display:grid;gap:8px;grid-template-columns:repeat(4,minmax(0,1fr))}
.rang{display:flex;align-items:center;gap:10px}
.pousse{margin-left:auto}

/* ─────────────────────────────── écran de connexion — « Arène » (13/10/2026)
   Téléphone : la photo en haut (cadrage portrait), le nom du club posé sur
   son bas, le formulaire dessous. Ordinateur (≥ 900 px) : la photo à gauche
   (cadrage paysage) avec le logo au centre, le formulaire dans un panneau à
   droite. Les règles des cartes de démonstration (.cx-carte…) ne changent pas. */
#connexion{
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  background:#070B14;color:var(--texte);
}
.cx-scene{position:relative;height:clamp(380px,62vh,560px);overflow:hidden;flex:0 0 auto}
.cx-scene picture,.cx-photo{position:absolute;inset:0;width:100%;height:100%}
.cx-photo{object-fit:cover;object-position:50% 20%}
.cx-voile{position:absolute;left:0;right:0;bottom:0;height:62%;
  background:linear-gradient(180deg,rgba(7,11,20,0) 0%,rgba(7,11,20,.82) 58%,#070B14 100%)}
.cx-marque{position:absolute;left:0;right:0;bottom:6px;display:flex;flex-direction:column;
  align-items:center;text-align:center;padding:0 22px}
.lockup{width:auto;height:58px;margin:0 0 6px;display:block;filter:drop-shadow(0 8px 22px rgba(0,0,0,.6))}
.cx-titre{font-family:var(--titre);font-size:54px;line-height:.85;letter-spacing:4px;color:#F5F7FB}
.cx-club{font-family:var(--corps,inherit);font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:#C9D2E0;margin-top:6px}
.cx-saison{display:flex;align-items:center;gap:10px;width:100%;max-width:400px;margin-top:12px;
  font-family:var(--mono);font-size:11px;letter-spacing:2.5px;color:var(--or);white-space:nowrap}
.cx-saison::before,.cx-saison::after{content:"";flex:1;height:1.5px;background:var(--or)}
.cx-panneau{flex:1;display:flex;flex-direction:column;align-items:center;padding:18px 20px 34px}
.cx-bienvenue{display:none;font-size:30px;font-weight:700;line-height:1.15;margin:0;max-width:420px}
.cx-sous{display:none;color:#9AA6BC;font-size:14.5px;line-height:1.55;margin:10px 0 0;max-width:420px}
.cx-form{width:100%;max-width:400px;display:block;margin:4px 0 16px}
.cx-form .label{color:#F5F7FB;font-weight:700}
.champ.code{font-family:var(--mono);font-size:21px;letter-spacing:4px;text-align:center;
  text-transform:uppercase;padding:14px 12px;border-radius:16px;background:#111A2C;border:1.5px solid #2A3A5A}
.champ.code:focus{border-color:var(--or)}
.champ.code::placeholder{letter-spacing:4px;color:var(--gris2);text-transform:none}
.cx-entrer{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:99px;
  padding:15px;font-size:16px;font-weight:700;background:var(--or);color:#0A0E17;border:0}
.cx-entrer:hover{filter:brightness(1.06)}
.cx-erreur{min-height:17px;font-size:12px;color:var(--danger);text-align:center;
  margin:7px 0 3px;opacity:0;transition:opacity .15s}
.cx-erreur.on{opacity:1}
.cx-aide{font-size:12px;color:#9AA6BC;text-align:center;margin-top:10px}
.cx-bascule{font-size:12.5px;color:var(--gris);border:1px solid var(--ligne);border-radius:99px;
  padding:7px 15px;transition:.15s;margin-bottom:14px}
.cx-bascule:hover{color:var(--or);border-color:var(--or)}
.cx-liste{width:100%;max-width:400px;display:grid;gap:9px;grid-template-columns:minmax(0,1fr)}
.cx-liste[hidden]{display:none}
.cx-carte{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);
  padding:13px 14px;transition:border-color .15s,transform .12s,background .15s}
.cx-carte:hover,.cx-carte:focus-visible{border-color:var(--or);background:var(--surface2);transform:translateY(-1px);outline:none}
.cx-pastille{width:42px;height:42px;flex:0 0 42px;border-radius:12px;display:grid;place-items:center;
  font-family:var(--titre);font-size:17px;letter-spacing:.5px;color:#04101F}
.cx-nom{font-weight:700;font-size:15px}
.cx-role{font-size:12.5px;color:var(--gris)}
.cx-code{font-family:var(--mono);font-size:10.5px;color:var(--gris2);letter-spacing:1px;margin-left:auto}
.cx-note{max-width:400px;margin-top:22px;font-size:11.5px;color:var(--gris2);text-align:center;
  line-height:1.55;border-top:1px solid var(--ligne);padding-top:14px}

@media (min-width:900px){
  /* Ordinateur : la photo en bandeau sur toute la largeur, comme l'affiche de
     référence — panier à gauche, n°13 à droite, le nom du club au centre, là
     où se trouvait l'ancien logo. Le formulaire vient dessous, centré. Une
     colonne étroite aurait recadré la photo sur son centre vide. */
  .cx-scene{height:auto;aspect-ratio:1956/796;max-height:64vh;width:100%}
  .cx-photo{object-position:50% 35%}
  .cx-voile{height:38%}
  .cx-marque{top:50%;bottom:auto;transform:translateY(-55%)}
  .lockup{height:96px;margin-bottom:10px}
  .cx-titre{font-size:96px;letter-spacing:6px}
  .cx-club{font-size:13px;letter-spacing:5px;margin-top:10px}
  .cx-saison{max-width:320px;margin-top:14px;font-size:12px}
  .cx-panneau{padding:6px 24px 40px}
  .cx-form{margin-top:0}
}


/* ─────────────────────────────── shell */
#app{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
#app.on{display:flex}
.entete{
  position:sticky;top:0;z-index:60;background:rgba(4,16,31,.94);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--ligne);padding:10px 14px;
  display:flex;align-items:center;gap:11px;
}
.ent-logo{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.ent-logo img{height:30px;width:auto;display:block}
.ent-logo b{font-family:var(--titre);font-size:17px;letter-spacing:2px;color:var(--or);line-height:1;font-weight:400}
.ent-bloc{min-width:0;flex:1}
.ent-nom{font-weight:700;font-size:14px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent-role{font-size:11px;color:var(--gris);display:flex;align-items:center;gap:5px}
.ent-point{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.ent-sortie{flex:0 0 auto;font-size:11.5px;color:var(--gris);border:1px solid var(--ligne);
  border-radius:8px;padding:6px 10px;transition:.15s}
.ent-sortie:hover{color:var(--or);border-color:var(--or)}

.vue{flex:1;padding:16px 14px 96px;max-width:1180px;width:100%;margin:0 auto}
.vue-titre{font-family:var(--titre);font-size:26px;letter-spacing:1.6px;margin-bottom:2px}
.vue-sous{font-size:12.5px;color:var(--gris);margin-bottom:16px}

.nav{position:fixed;bottom:0;left:0;right:0;z-index:70;
  background:rgba(6,24,46,.97);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--ligne);display:flex;
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--gris2);font-size:9.5px;letter-spacing:.2px;
  border-radius:10px;transition:color .15s,background .15s;min-width:0}
.nav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bouton svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item.actif{color:var(--or);background:rgba(255,178,70,.12)}

/* ─────────────────────────────── bannière d'accueil */
.banniere{
  position:relative;border-radius:var(--r);overflow:hidden;margin-bottom:14px;
  background:
    radial-gradient(520px 260px at 82% 8%,rgba(255,178,70,.26),transparent 64%),
    radial-gradient(420px 300px at 8% 100%,rgba(57,147,209,.22),transparent 68%),
    linear-gradient(160deg,#0D2A4E 0%,#0A1F3D 42%,#04101F 100%);
  border:1px solid var(--ligne2);padding:18px 16px;box-shadow:var(--ombre);
}
.banniere::after{
  content:'';position:absolute;right:-40px;top:-50px;width:190px;height:190px;border-radius:50%;
  border:26px solid rgba(255,178,70,.07);pointer-events:none;
}
.ban-sur{font-family:var(--mono);font-size:10px;letter-spacing:2.4px;color:var(--or);text-transform:uppercase}
.ban-titre{font-family:var(--titre);font-size:30px;letter-spacing:1.6px;margin:5px 0 3px;line-height:1}
.ban-txt{font-size:12.5px;color:var(--gris);max-width:520px;position:relative}
.ban-rang{display:flex;align-items:center;gap:14px;margin-top:14px;flex-wrap:wrap;position:relative}
.ban-chiffre{font-family:var(--titre);font-size:28px;color:var(--or);line-height:1}
.ban-lib{font-size:10px;color:var(--gris);letter-spacing:.3px}

/* ─────────────────────────────── blocs */
.carte{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);padding:14px}
.carte+.carte{margin-top:10px}
.carte-tete{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.carte-titre{font-family:var(--titre);font-size:16px;letter-spacing:1.2px;color:var(--texte)}
.carte-note{font-size:11.5px;color:var(--gris)}
.section-titre{font-family:var(--titre);font-size:13px;letter-spacing:2px;color:var(--gris);
  margin:22px 0 9px;display:flex;align-items:center;gap:9px}
.section-titre::after{content:'';flex:1;height:1px;background:var(--ligne)}
.section-titre:first-child{margin-top:0}

.tuile{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r2);padding:11px 10px;text-align:center}
.tuile-val{font-family:var(--titre);font-size:25px;letter-spacing:1px;line-height:1;color:var(--or)}
.tuile-lib{font-size:10.5px;color:var(--gris);margin-top:5px;line-height:1.25}
.tuile.bleu .tuile-val{color:var(--defense)}
.tuile.vert .tuile-val{color:var(--physique)}
.tuile.rouge .tuile-val{color:var(--attaque)}
.tuile.blanc .tuile-val{color:var(--texte)}

.etiq{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:500;
  padding:3px 8px;border-radius:99px;border:1px solid currentColor;letter-spacing:.3px}
.etiq.pleine{border-color:transparent;color:#04101F}
.puce{display:inline-block;width:7px;height:7px;border-radius:50%;flex:0 0 7px}

.jauge{height:6px;border-radius:3px;background:rgba(6,22,42,.95);overflow:hidden}
.jauge>i{display:block;height:100%;border-radius:3px;background:var(--or)}
.vide{text-align:center;color:var(--gris2);font-size:12.5px;padding:26px 12px;border:1px dashed var(--ligne);border-radius:var(--r)}

/* liste de joueurs */
.jl{display:grid;gap:7px;grid-template-columns:minmax(0,1fr)}
.jl-item{display:flex;align-items:center;gap:11px;width:100%;min-width:0;text-align:left;
  background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r2);
  padding:9px 11px;transition:border-color .15s,background .15s}
.jl-item:hover{border-color:var(--ligne2);background:var(--surface2)}
.jl-num{font-family:var(--titre);font-size:17px;width:34px;height:34px;flex:0 0 34px;
  display:grid;place-items:center;border-radius:9px;background:var(--surface3);color:var(--or)}
.jl-bloc{min-width:0;flex:1;overflow:hidden}
.jl-nom{display:block;font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jl-meta{display:block;font-size:11px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jl-note{font-family:var(--titre);font-size:20px;letter-spacing:.5px;flex:0 0 auto}
.jl-fleche{color:var(--gris2);flex:0 0 auto;font-size:15px}
.jl-rang{font-family:var(--titre);font-size:13px;color:var(--gris2);width:20px;text-align:right;flex:0 0 20px}

/* onglets internes */
.ong{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;margin-bottom:14px;scrollbar-width:none}
.ong::-webkit-scrollbar{display:none}
.ong-b{flex:0 0 auto;font-size:12.5px;padding:7px 13px;border-radius:99px;
  border:1px solid var(--ligne);color:var(--gris);white-space:nowrap;transition:.15s}
.ong-b.actif{background:var(--or);border-color:var(--or);color:#04101F;font-weight:700}

/* tableaux */
.tab-enrob{overflow-x:auto;border:1px solid var(--ligne);border-radius:var(--r2);background:var(--surface)}
table.tab{width:100%;border-collapse:collapse;font-size:12.5px;min-width:460px}
table.tab th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--gris);font-weight:500;padding:9px 10px;border-bottom:1px solid var(--ligne);white-space:nowrap}
table.tab td{padding:8px 10px;border-bottom:1px solid rgba(24,58,94,.5);white-space:nowrap}
table.tab tr:last-child td{border-bottom:0}
table.tab td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
table.tab th.num{text-align:right}
table.tab tbody tr:hover{background:var(--surface2)}
table.tab tr.nous{background:rgba(255,178,70,.10)}
table.tab tr.nous td{font-weight:700}
.tab-nom{font-weight:700;white-space:nowrap}

/* messages */
.msg{background:var(--surface);border:1px solid var(--ligne);border-left:3px solid var(--or);border-radius:var(--r2);padding:11px 12px}
.msg+.msg{margin-top:8px}
.msg.att{border-left-color:var(--attaque)}
.msg.def{border-left-color:var(--defense)}
.msg.med{border-left-color:var(--medical)}
.msg.ana{border-left-color:var(--analyste)}
.msg-tete{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap}
.msg-de{font-size:11.5px;font-weight:700}
.msg-date{font-family:var(--mono);font-size:10px;color:var(--gris2);margin-left:auto}
.msg-txt{font-size:13px;line-height:1.55;color:#D6E4F2}

/* formulaires */
.champ{width:100%;background:var(--surface2);border:1px solid var(--ligne);border-radius:var(--r2);
  padding:10px 12px;color:var(--texte);font-size:13.5px;transition:border-color .15s}
.champ:focus{outline:none;border-color:var(--or)}
.champ::placeholder{color:var(--gris2)}
textarea.champ{resize:vertical;min-height:78px;line-height:1.5}
.label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gris);margin-bottom:6px}
.bouton{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  background:var(--or);color:#04101F;font-weight:700;font-size:13.5px;
  border-radius:var(--r2);padding:11px 17px;transition:filter .15s}
.bouton:hover{filter:brightness(1.08)}
.bouton.plein{width:100%}
.bouton.fant{background:transparent;border:1px solid var(--ligne);color:var(--texte);font-weight:500}
.bouton.fant:hover{border-color:var(--or);color:var(--or)}

/* graphiques */
.radar-enrob{display:flex;justify-content:center;padding:4px 0 10px}
.legende{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:11.5px;color:var(--gris)}
.legende i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.dom-ligne{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;padding:7px 0}
.dom-ligne+.dom-ligne{border-top:1px solid rgba(24,58,94,.45)}
.dom-nom{font-size:12.5px}
.dom-barre{height:5px;border-radius:3px;background:rgba(6,22,42,.95);overflow:hidden;margin-top:5px}
.dom-barre>i{display:block;height:100%;background:var(--defense)}
.dom-val{font-family:var(--mono);font-size:13px;text-align:right;color:var(--texte)}
.dom-delta{font-family:var(--mono);font-size:10px;text-align:right}
.hausse{color:var(--physique)} .baisse{color:var(--danger)} .plat{color:var(--gris2)}

/* ─────────────────────────────── terrain */
.terrain-enrob{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--ligne2);
  background:#0A2748;touch-action:manipulation}
.terrain{width:100%;display:block}
.spot-b{cursor:pointer}
.spot-b:hover circle{stroke-width:3}

/* ─────────────────────────────── challenge de tir */
.tir-serie{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(24,58,94,.5)}
.tir-serie:last-child{border-bottom:0}
.tir-spot{font-size:13px;font-weight:700}
.tir-sens{font-family:var(--mono);font-size:10px;color:var(--gris2);letter-spacing:1px;text-transform:uppercase}
.tir-saisie{display:flex;align-items:center;gap:6px}
.tir-inp{width:58px;text-align:center;font-family:var(--mono);font-size:16px;padding:8px 4px;
  background:var(--surface2);border:1px solid var(--ligne);border-radius:9px;color:var(--texte)}
.tir-inp:focus{outline:none;border-color:var(--or)}
.tir-inp.pleine{border-color:var(--physique);color:#A8E294}
.tir-sur{font-family:var(--mono);font-size:12px;color:var(--gris2)}
.tir-pastille{font-family:var(--titre);font-size:15px;min-width:46px;text-align:right}

/* ─────────────────────────────── quiz */
.qz-opt{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;
  background:var(--surface2);border:1px solid var(--ligne);border-radius:var(--r2);
  padding:12px;transition:.15s;margin-bottom:8px}
.qz-opt:hover{border-color:var(--ligne2)}
.qz-opt.choisie{border-color:var(--or);background:rgba(255,178,70,.11)}
.qz-opt.juste{border-color:var(--physique);background:rgba(79,168,58,.13)}
.qz-opt.fausse{border-color:var(--danger);background:rgba(224,86,75,.12)}
.qz-case{width:20px;height:20px;flex:0 0 20px;border-radius:6px;border:1.7px solid var(--ligne2);
  display:grid;place-items:center;font-size:12px;margin-top:1px;color:#04101F}
.qz-opt.choisie .qz-case{background:var(--or);border-color:var(--or)}
.qz-opt.juste .qz-case{background:var(--physique);border-color:var(--physique)}
.qz-opt.fausse .qz-case{background:var(--danger);border-color:var(--danger)}
.qz-txt{font-size:13px;line-height:1.5}
.qz-clip{display:flex;align-items:center;gap:11px;background:var(--surface2);border:1px solid var(--ligne);
  border-radius:var(--r2);padding:12px;margin-bottom:12px}
.qz-play{width:40px;height:40px;flex:0 0 40px;border-radius:50%;background:var(--or);
  display:grid;place-items:center;color:#04101F;font-size:15px}

/* ─────────────────────────────── étoiles */
.et-ligne{padding:11px 0;border-bottom:1px solid rgba(24,58,94,.5)}
.et-ligne:last-child{border-bottom:0}
.et-txt{font-size:13px;margin-bottom:7px}
.et-rang{display:flex;gap:5px}
.et{width:32px;height:32px;border-radius:8px;border:1px solid var(--ligne);background:var(--surface2);
  display:grid;place-items:center;font-size:15px;color:var(--gris2);transition:.12s}
.et.on{background:rgba(255,178,70,.16);border-color:var(--or);color:var(--or)}
.et:hover{border-color:var(--ligne2)}

/* ─────────────────────────────── chat */
.chat{display:flex;flex-direction:column;gap:10px}
.chat-b{display:flex;gap:9px;align-items:flex-start}
.chat-b.moi{flex-direction:row-reverse}
.chat-av{width:32px;height:32px;flex:0 0 32px;border-radius:10px;display:grid;place-items:center;
  font-family:var(--titre);font-size:12px;color:#04101F;letter-spacing:.5px}
.chat-bulle{max-width:min(78%,520px);background:var(--surface);border:1px solid var(--ligne);
  border-radius:14px;padding:10px 12px}
.chat-b.moi .chat-bulle{background:rgba(255,178,70,.12);border-color:rgba(255,178,70,.35)}
.chat-nom{font-size:11px;font-weight:700;margin-bottom:3px}
.chat-txt{font-size:13px;line-height:1.5;color:#D6E4F2}
.chat-h{font-family:var(--mono);font-size:9.5px;color:var(--gris2);margin-top:4px;text-align:right}
.chat-saisie{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,var(--nuit) 28%);
  padding-top:14px;margin-top:14px}

/* ─────────────────────────────── médical */
.med{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);padding:13px;
  border-left:3px solid var(--medical)}
.med+.med{margin-top:9px}
.med.indispo{border-left-color:var(--danger)}
.med.adapte{border-left-color:var(--alerte)}
.med.retabli{border-left-color:var(--physique)}
.med-tete{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.med-joueur{font-weight:700;font-size:14px}
.med-zone{font-family:var(--mono);font-size:10.5px;color:var(--gris);letter-spacing:.6px}

/* ─────────────────────────────── sponsors */
.spo{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);
  padding:14px;position:relative;overflow:hidden}
.spo+.spo{margin-top:9px}
.spo::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--or))}
.spo-niv{font-family:var(--mono);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;color:var(--c,var(--or))}
.spo-nom{font-family:var(--titre);font-size:19px;letter-spacing:1.2px;margin:3px 0 5px}

/* ─────────────────────────────── feuille modale */
/* Empilement : la couche d'impression (400) couvre l'application, la feuille
   modale (500) passe par-dessus — sinon la confirmation d'envoi s'ouvrirait
   derrière l'aperçu du rapport — et le toast (600) reste visible par-dessus tout. */
.feuille{position:fixed;inset:0;z-index:500;display:none;align-items:flex-end;justify-content:center;
  background:rgba(2,8,18,.76);backdrop-filter:blur(3px)}
.feuille.on{display:flex}
.feuille-in{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--ligne2);
  border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom));
  animation:monte .2s ease-out;max-height:86vh;overflow-y:auto}
@keyframes monte{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}
.feuille-titre{font-family:var(--titre);font-size:19px;letter-spacing:1.3px;margin-bottom:3px}
.feuille-sous{font-size:12px;color:var(--gris);margin-bottom:15px}
.act{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.act-b{padding:15px 10px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--ligne);
  background:var(--surface2);transition:.14s}
.act-b:hover{filter:brightness(1.12)}
.act-b small{display:block;font-weight:400;font-size:11px;opacity:.75;margin-top:2px}
.act-b.oui{background:rgba(79,168,58,.16);border-color:var(--physique);color:#A8E294}
.act-b.non{background:rgba(224,86,75,.14);border-color:var(--danger);color:#F3A9A2}
.act-b.large{grid-column:1/-1}
.act-b.neutre{background:transparent;color:var(--gris)}

.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%) translateY(10px);z-index:600;
  background:var(--surface3);border:1px solid var(--ligne2);border-radius:99px;
  padding:9px 17px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap;
  max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─────────────────────────────── file d'attente hors ligne */
.hf{position:relative;z-index:55;display:flex;align-items:center;gap:9px;
  padding:7px 14px;font-size:11.5px;border-bottom:1px solid var(--ligne);
  background:rgba(232,163,61,.16);color:#F6D8A4}
.hf[hidden]{display:none}
.hf.envoi{background:rgba(57,147,209,.15);color:#B6DCF5}
.hf.ok{background:rgba(79,168,58,.16);color:#BFE7B0}
.hf-pt{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:currentColor}
.hf-b{margin-left:auto;flex:0 0 auto;font-size:11px;border:1px solid currentColor;
  border-radius:99px;padding:3px 10px;color:inherit}
.fa-l{display:flex;align-items:center;gap:9px;padding:9px 0;
  border-bottom:1px solid rgba(24,58,94,.5);font-size:12.5px}
.fa-l:last-child{border-bottom:0}
.fa-t{font-family:var(--mono);font-size:10.5px;color:var(--or);letter-spacing:.8px}

/* pastille de notification sur la navigation */
.nav-item{position:relative}
.nav-bulle{position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  border-radius:99px;background:var(--danger);color:#fff;font-family:var(--mono);font-size:9.5px;
  font-style:normal;display:grid;place-items:center;line-height:1;border:1.5px solid var(--nuit)}

/* messages système du fil */
.chat-sys{display:flex;align-items:center;gap:8px;align-self:center;max-width:min(86%,560px);
  background:rgba(14,42,76,.7);border:1px dashed var(--ligne2);border-radius:99px;
  padding:6px 13px;font-size:11.5px;color:var(--gris)}
.chat-sys b{color:var(--or-clair);font-weight:700}

/* clips vidéo du joueur */
.clip{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--ligne);border-left:3px solid var(--c,var(--or));
  border-radius:var(--r2);padding:11px 12px;transition:border-color .15s,background .15s}
.clip+.clip{margin-top:8px}
.clip:hover{background:var(--surface2)}
.clip-play{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
  background:var(--c,var(--or));color:#04101F;font-size:13px}
.clip-bloc{min-width:0;flex:1}
.clip-titre{display:block;font-weight:700;font-size:13.5px;line-height:1.3}
.clip-meta{display:block;font-family:var(--mono);font-size:10px;color:var(--gris2);
  letter-spacing:.6px;margin-top:3px}
.clip-note{font-size:12.5px;color:#D6E4F2;margin-top:6px;line-height:1.5}
.clip-pt{width:8px;height:8px;border-radius:50%;flex:0 0 8px;background:var(--or);margin-top:6px}

/* relances */
.rel{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r2);padding:12px 13px}
.rel+.rel{margin-top:9px}
.rel-tete{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.rel-nb{font-family:var(--titre);font-size:19px;color:var(--alerte);letter-spacing:.5px}
.rel-l{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:12.5px;
  border-bottom:1px solid rgba(24,58,94,.5)}
.rel-l:last-child{border-bottom:0}
.rel-nom{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-age{font-family:var(--mono);font-size:10.5px;color:var(--gris2);flex:0 0 auto}

/* ─────────────────────────────── écran Classeur */
.cl{background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r);padding:14px}
.cl+.cl{margin-top:10px}
.cl.prive{border-color:var(--ligne2);border-style:dashed;background:rgba(14,42,76,.5)}
.cl-tete{display:flex;align-items:flex-start;gap:11px;margin-bottom:9px}
.cl-ico{width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  background:var(--surface3);color:var(--or)}
.cl-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.cl-ong{display:grid;gap:5px;grid-template-columns:minmax(0,1fr);margin-top:10px}
.cl-l{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;
  background:var(--surface2);border:1px solid var(--ligne);border-left:3px solid var(--or)}
.cl-l.plat{border-left-color:var(--defense)}
.cl-nom{font-family:var(--mono);font-size:11px;letter-spacing:.8px;color:var(--or);flex:0 0 auto}
.cl-l.plat .cl-nom{color:var(--defense)}
.cl-txt{min-width:0;flex:1;font-size:12px;color:var(--gris)}
.cl-sens{font-family:var(--mono);font-size:9.5px;letter-spacing:1px;color:var(--gris2);
  flex:0 0 auto;text-transform:uppercase}

/* ─────────────────────────────── playbook */
/* Le terrain reste à portée de main : au-delà d'environ 520 px de large il
   dépasse la hauteur de fenêtre d'un portable et il faudrait scroller en
   dessinant. On le plafonne et on le centre. */
.pb-enrob{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--ligne2);
  background:#0A2748;touch-action:none;user-select:none;-webkit-user-select:none;
  margin:0 auto 10px;max-width:520px}
.pb-svg{width:100%;display:block}
.pb-apercu{border-radius:var(--r2);overflow:hidden;border:1px solid var(--ligne);background:#0A2748;
  max-width:420px;margin:0 auto}
.pb-temps{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--ligne);
  border-radius:var(--r2);padding:9px 11px;margin:0 auto 10px;max-width:520px}
.pb-outils{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.pb-o{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;
  background:var(--surface);border:1px solid var(--ligne);border-radius:var(--r2);
  font-size:10.5px;color:var(--gris);transition:.14s;min-width:0}
.pb-o span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pb-o:hover{border-color:var(--ligne2)}
.pb-o.actif{border-color:var(--or);background:rgba(255,178,70,.12);color:var(--texte)}
.pb-sym{display:block;width:34px;height:20px}
.pb-sym svg{width:34px;height:20px;display:block;overflow:visible}

/* planche imprimée */
.pb-planche{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm}
.pb-case{border:1px solid #D6D2CA;border-radius:3px;padding:2mm;min-width:0}
.pb-num{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;text-transform:uppercase;
  color:#94908A;margin-bottom:1.2mm}
.pb-case .pb-svg{border:1px solid #E3DDCB;border-radius:2px}
.pb-note{font-size:10.5px;line-height:1.35;color:#3B372F;margin-top:1.4mm;white-space:normal}
.pb-leg{display:flex;flex-wrap:wrap;gap:2mm 5mm;font-size:10.5px;color:#5C584E}
.pb-leg span{display:inline-flex;align-items:center;gap:1.5mm}
.pb-leg i{width:10px;height:3px;border-radius:2px;flex:none;display:inline-block}
.pb-leg .pb-min{width:30px;height:17px;flex:none;overflow:visible}
.pb-sym .pb-min{width:34px;height:20px}
@media screen and (max-width:560px){ .pb-planche{grid-template-columns:minmax(0,1fr)} }

/* ─────────────────────────────── couche d'impression A4
   Une île claire dans une plateforme sombre : tout est cloisonné sous
   #impression pour qu'aucune règle de la plateforme ne fuite sur la feuille,
   et réciproquement. À l'impression, seule cette couche existe. */
#impression{position:fixed;inset:0;z-index:400;overflow-y:auto;background:#ECEAE6;
  color:#1A1A18;font-family:var(--corps);font-size:14px;line-height:1.4}
#impression[hidden]{display:none}
.a4-barre{position:sticky;top:0;z-index:2;background:#1A1A18;color:#F5F2E9;
  padding:11px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.a4-barre .a4-t{font-family:var(--titre);font-size:16px;letter-spacing:1.4px;color:#FFB246;min-width:0}
.a4-b{background:#FFB246;color:#1A1A18;border-radius:8px;padding:8px 14px;
  font-weight:700;font-size:13px;flex:0 0 auto}
.a4-b.fant{background:transparent;color:#FFB246;border:1px solid #3A3524}
.a4-sel{background:#272519;color:#F5F2E9;border:1px solid #3A3524;border-radius:8px;
  padding:8px 11px;font-size:13px;max-width:100%}
.a4-aide{padding:10px 14px 0;max-width:210mm;margin:0 auto;font-size:11.5px;color:#6B665C}

.a4{width:210mm;min-height:297mm;margin:18px auto;background:#fff;color:#111;
  padding:10mm 12mm;box-shadow:0 6px 26px rgba(0,0,0,.18);
  display:flex;flex-direction:column;gap:2.8mm;line-height:1.35}
.a4 h1,.a4 h2,.a4 h3{font-family:var(--titre);font-weight:400;margin:0;letter-spacing:.6px}
.a4 p{margin:0}
.a4-tete{display:flex;align-items:flex-start;justify-content:space-between;gap:6mm;
  border-bottom:3px solid #1A1A18;padding-bottom:2.4mm}
.a4-g{display:flex;align-items:flex-start;gap:5mm;min-width:0}
.a4-logo{width:17mm;flex:none;margin-top:.4mm}
.a4-logo img{display:block;width:100%;height:auto}
.a4-tete h1{font-size:27px;line-height:1.02}
.a4-sur{font-size:10px;letter-spacing:2.2px;text-transform:uppercase;color:#5F5B55;margin-top:1mm}
.a4-meta{text-align:right;font-size:12px;color:#333;white-space:nowrap;flex:0 0 auto}
.a4-meta b{display:block;font-size:15px;color:#111;font-family:var(--titre);
  font-weight:400;letter-spacing:.8px}
.a4-chip{display:inline-block;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  border:1px solid #D6D2CA;border-radius:99px;padding:2px 8px;color:#5F5B55;margin-right:4px}

.a4-tuiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3.2mm}
.a4-tuile{border:1px solid #D6D2CA;border-radius:3px;padding:2mm 2.6mm;text-align:center}
.a4-tuile .l{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:#94908A}
.a4-tuile .v{font-family:var(--titre);font-weight:400;font-size:25px;line-height:1.05;margin-top:.4mm}
.a4-tuile .s{font-size:10px;color:#5F5B55}

.a4-bloc{border:1px solid #D6D2CA;border-radius:3px;padding:2.2mm 2.8mm;min-width:0}
.a4-bloc>h3{font-size:12px;letter-spacing:1.6px;color:#5F5B55;margin-bottom:1.5mm;text-transform:uppercase}
.a4-bloc p{font-size:12.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.a4-duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm;align-items:stretch}
.a4-duo.radar{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
/* La grille du staff porte huit intitulés longs : sans plus de largeur ils
   passent tous sur deux lignes et la fiche déborde sur une seconde page. */
.a4-duo.staff{grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr)}
.a4-duo.staff table{font-size:10.5px}
.a4-duo.staff th,.a4-duo.staff td{padding:1mm 1.1mm}
.a4 svg{display:block;width:100%;height:auto;max-width:100%}

.a4 table{border-collapse:collapse;width:100%;font-size:11.5px}
.a4 th{text-align:left;font-size:8.5px;letter-spacing:1.2px;text-transform:uppercase;color:#94908A;
  font-weight:500;padding:1.2mm 1.4mm;border-bottom:1px solid #D6D2CA;white-space:nowrap}
.a4 td{padding:1.15mm 1.4mm;border-bottom:1px solid #EFEBDD;vertical-align:top}
.a4 tr:last-child td{border-bottom:0}
.a4 td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
.a4 th.num{text-align:right}
.a4 .up{color:#2E7D52;font-weight:600}
.a4 .down{color:#B5462B;font-weight:600}
.a4 .flat{color:#94908A}

.a4-leg{display:flex;gap:5mm;font-size:10px;color:#5F5B55;margin-bottom:1mm}
.a4-leg span{display:inline-flex;align-items:center;gap:1.5mm}
.a4-leg i{width:9px;height:9px;border-radius:2px;flex:none;display:inline-block}
.a4-mot{border-left:4px solid #FFB246;background:#FFFAEE;border-radius:0 3px 3px 0;padding:2.2mm 3mm}
/* La lecture du DT sous une rubrique calculée. Visuellement distincte des
   chiffres qui la précèdent : le président doit voir d'un coup d'œil ce qui est
   mesuré et ce qui est interprété. */
.a4-lecture{border-left:3px solid #1A6FAF;background:#F2F7FB;border-radius:0 3px 3px 0;
  padding:2mm 3mm;margin-top:2.4mm}
.a4-lecture .l{font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;color:#1A6FAF;
  font-weight:600;margin-bottom:1mm}
.a4-lecture p{font-size:11.5px;font-style:italic;white-space:pre-wrap;color:#24405C}
.a4-mot h3{font-size:12px;letter-spacing:1.6px;color:#5F5B55;text-transform:uppercase}
.a4-mot p{margin-top:.8mm;font-size:12.5px;font-style:italic}
.a4-alerte{border-left:4px solid #B5462B;background:#FDF3F1;border-radius:0 3px 3px 0;padding:2.2mm 3mm}
.a4-alerte h3{font-size:12px;letter-spacing:1.6px;color:#8C3B25;text-transform:uppercase}
.a4-cles{counter-reset:cle}
.a4-cle{display:flex;gap:3mm;align-items:flex-start;padding:1.8mm 0;border-bottom:1px solid #EFEBDD}
.a4-cle:last-child{border-bottom:0}
.a4-cle::before{counter-increment:cle;content:counter(cle);font-family:var(--titre);font-size:19px;
  color:#FFB246;flex:0 0 7mm;text-align:center;line-height:1.1}
.a4-cinq{display:flex;gap:3mm;flex-wrap:wrap}
.a4-maillot{width:14mm;height:16mm;border:1.5px solid #1A1A18;border-radius:2mm 2mm 5mm 5mm;

.a4-sign{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8mm;margin-top:auto;padding-top:1.5mm}

@page{size:A4 portrait;margin:0}
@media print{
  html,body{margin:0;padding:0;background:#fff}
  body>*{display:none !important}
  body>#impression{display:block !important;position:static;overflow:visible;background:#fff}
  .a4-barre,.a4-aide{display:none !important}
  .a4{width:auto;height:297mm;min-height:0;margin:0;box-shadow:none;padding:10mm 12mm;overflow:hidden}
  .a4+.a4{page-break-before:always;break-before:page}
  /* Les trois fiches tiennent sur une page et sont taillées pour ça. Le rapport,
     lui, grandit avec ce que le DT y ajoute : sa feuille coule sur autant de
     pages qu'il faut, sans jamais couper un bloc en deux. */
  .a4.flot{height:auto;min-height:297mm;overflow:visible;display:block}
  .a4.flot>*{break-inside:avoid;page-break-inside:avoid;margin-bottom:2.8mm}
  .a4.flot .a4-sign{margin-top:6mm}
}

/* ══════════════════ L'APPEL ══════════════════
   Une ligne par personne. L'heure porte la couleur : vert présent, orange en
   retard, gris pas encore pointé. Pas de pictogramme — à bout de bras, au
   gymnase, une couleur se lit, un symbole se devine. */
.pt-l{display:flex;align-items:center;gap:10px;padding:9px 0;
  border-bottom:1px solid var(--ligne)}
.pt-l:last-child{border-bottom:0}
.pt-num{width:28px;height:28px;flex:0 0 28px;border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface2);border:1px solid var(--ligne2);
  font-family:var(--titre);font-size:14px;color:var(--or)}
.pt-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt-h{font-family:var(--mono);font-size:11.5px;color:var(--gris2);white-space:nowrap}
.pt-h.ok{color:var(--ok)}
.pt-h.retard{color:var(--alerte)}
.pt-h.absent{color:var(--gris2)}
.pt-bouton{background:var(--surface2);border:1px solid var(--ligne2);color:var(--texte);
  border-radius:9px;padding:6px 11px;font-size:12px;font-weight:600;white-space:nowrap}

/* Stats en direct — le geste de HOOPS TROPHY (23/10/2026) : le terrain à
   gauche, la liste des joueurs à droite, même sur téléphone. La liste prend
   la hauteur du terrain (contain:size) et défile au-delà. */
.dr-consigne{font-size:12px;color:var(--gris2);text-align:center;margin:4px 0 8px}
.dr-zone{display:grid;grid-template-columns:minmax(0,1fr) 132px;gap:8px;align-items:stretch;
  max-width:720px;margin:0 auto}
.dr-zone .terrain-enrob{margin:0;min-width:0}
.dr-terrain{position:relative;cursor:crosshair}
/* Les 12 du match tiennent sans défiler : une rangée par joueur, qui se
   partagent la hauteur du terrain. Sur téléphone, le terrain est trop petit
   pour 12 rangées lisibles : la liste descend plus bas que lui. */
.dr-joueurs{display:grid;grid-template-rows:auto repeat(var(--n,12),minmax(36px,auto));align-content:start;
  overflow:hidden;background:var(--surface);border:1px solid var(--ligne2);
  border-radius:12px;transition:border-color .2s}
.dr-zone{align-items:start}
.dr-joueurs.attend{border-color:var(--or)}
.dr-joueurs-tete{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:4px 6px 4px 8px;
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--or);
  background:var(--surface2);border-bottom:1px solid var(--ligne2);min-width:0}
.dr-joueurs-tete span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr-douze-btn{flex:0 0 auto;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;
  border:1px solid var(--or);color:var(--or);background:transparent;font-family:inherit;letter-spacing:.5px}
.dr-joueur{display:flex;flex-direction:column;justify-content:center;min-height:0;padding:2px 8px;
  border-bottom:1px solid var(--ligne2);cursor:pointer;border-left:3px solid transparent}
.dr-douze-tete{display:flex;justify-content:space-between;align-items:center;margin:12px 0 6px}
.dr-douze-compte{font-family:var(--mono);font-size:12px;color:var(--or)}
.dr-douze{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px;max-height:50vh;overflow-y:auto}
.dr-puce{display:flex;align-items:center;gap:5px;padding:8px 9px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--ligne2);color:var(--texte);font-size:12.5px;font-weight:600;text-align:left;
  font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-puce b{color:var(--gris2);font-family:var(--mono);font-size:11.5px}
.dr-puce.on{background:rgba(201,162,39,.16);border-color:var(--or)}
.dr-puce.on b{color:var(--or)}
.dr-joueur:last-child{border-bottom:none}
.dr-joueur:active,.dr-joueur:hover{background:var(--surface2)}
.dr-joueur.choisi{background:rgba(201,162,39,.15);border-left-color:var(--or)}
.dr-nom{font-size:12px;font-weight:600;color:var(--texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr-nom b{background:var(--surface2);color:var(--or);font-family:'Bebas Neue',sans-serif;font-weight:400;
  font-size:12px;letter-spacing:1px;padding:0 4px;border-radius:3px;margin-right:4px}
.dr-stats{font-size:9.5px;color:var(--gris2);margin-top:1px;white-space:nowrap}
.dr-stats span{color:var(--texte);font-weight:700;margin-right:2px}
@keyframes drFlash{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(-50%,-50%) scale(2.5);opacity:0}}
.dr-flash{position:absolute;width:24px;height:24px;border-radius:50%;pointer-events:none;
  border:3px solid;transform:translate(-50%,-50%);animation:drFlash .5s ease-out forwards}
.dr-indice{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.8);background:var(--surface);
  border:2px solid var(--or);border-radius:14px;padding:18px 26px;text-align:center;z-index:410;
  opacity:0;pointer-events:none;transition:all .2s;max-width:86vw}
.dr-indice.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.dr-indice-titre{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--or);letter-spacing:2px;white-space:nowrap}
.dr-indice-sous{font-size:13px;color:var(--gris2);margin-top:4px}
.dr-titre-petit{font-size:11px;color:var(--gris2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
.dr-act{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;flex:1 1 40%}
.dr-act.reb{background:rgba(255,92,0,.15);color:#FF7A2E;border:1px solid #FF7A2E}
.dr-act.pd{background:rgba(150,100,255,.15);color:#A884FF;border:1px solid #A884FF}
.dr-act.int{background:rgba(0,217,126,.15);color:#00D97E;border:1px solid #00D97E}
.dr-act.bp{background:rgba(255,59,92,.15);color:#FF5C78;border:1px solid #FF5C78}
.dr-undo-tete{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dr-undo{padding:6px 14px;border-radius:8px;font-size:12px;font-weight:700;border:1px solid #FFD60A;
  background:rgba(255,214,10,.1);color:#FFD60A;font-family:inherit}
.dr-undo:disabled{opacity:.3;pointer-events:none}
.dr-undo-liste{display:flex;flex-direction:column;gap:4px}
.dr-undo-ligne{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;background:var(--surface2);
  border-radius:6px;font-size:11px;color:var(--texte)}
.dr-undo-ligne:first-child{border-left:3px solid #FFD60A}
.dr-undo-age{color:var(--gris2);font-size:10px;white-space:nowrap}
.dr-rapides{margin-top:12px}
/* Ordinateur et tablette : c'est là qu'il servira le plus (Fathy, 23/10).
   Le terrain grandit jusqu'à la hauteur de l'écran, la liste s'élargit et
   montre plus de stats ; à partir de 1100 px, les actions rapides et les
   dernières actions passent dans une colonne à droite, toujours visibles. */
@media screen and (min-width:700px){
  .dr-zone{max-width:none;justify-content:center;
    grid-template-columns:minmax(0,calc((100vh - 340px) * 1.0714)) 220px;gap:12px}
  .dr-zone{align-items:stretch}
  .dr-joueurs{contain:size;grid-template-rows:auto repeat(var(--n,12),minmax(0,1fr))}
  .dr-joueur{padding:1px 12px}
  .dr-nom{font-size:13.5px;line-height:1.2}
  .dr-nom b{font-size:13px}
  .dr-stats{font-size:10.5px;margin-top:1px;line-height:1.2}
  .dr-joueurs-tete{font-size:11.5px;padding:5px 8px 5px 12px}
  .dr-consigne{font-size:13px}
  .dr-cote{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  .dr-cote .carte{margin:0}
  .dr-act{font-size:14px;padding:12px 16px}
  .dr-undo-ligne{font-size:12.5px}
}
@media screen and (min-width:1100px){
  .dr-plan{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
  .dr-cote{display:flex;flex-direction:column;margin-top:30px;position:sticky;top:90px}
  .dr-act{flex:1 1 100%}
}

/* ══════════════════ LE SCANNER ══════════════════
   Repris tel quel d'ASA Sniper : c'est le même geste, au même endroit, et
   l'assistant ne doit pas réapprendre un écran entre les deux applications. */
#scanner{display:none;position:fixed;inset:0;z-index:500;background:#000}
#scanner.on{display:block}
#sc-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.sc-visee{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(66vw,300px);aspect-ratio:1;border:3px solid rgba(255,178,70,.95);
  border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.48)}
.sc-haut{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:linear-gradient(180deg,rgba(0,0,0,.75),transparent)}
.sc-compte{font-family:var(--titre);font-size:22px;letter-spacing:1px;color:var(--or)}
.sc-fermer{margin-left:auto;background:rgba(255,255,255,.14);
  border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;
  padding:9px 15px;font-size:13.5px;font-weight:700}
.sc-bas{position:absolute;left:0;right:0;bottom:0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg,rgba(0,0,0,.82),transparent)}
.sc-ban{border-radius:var(--r2);padding:13px 15px;font-size:13.5px;line-height:1.4;
  color:#fff;background:rgba(21,58,99,.94);border:1px solid var(--ligne2)}
.sc-ban b{font-family:var(--titre);font-size:21px;letter-spacing:1px;font-weight:400;
  display:block;margin-bottom:2px}
.sc-ban.ok{background:rgba(30,96,22,.95);border-color:var(--ok)}
.sc-ban.retard{background:rgba(140,88,16,.95);border-color:var(--alerte)}
.sc-ban.ko{background:rgba(120,32,26,.95);border-color:var(--danger)}
.sc-ban.neutre{background:rgba(28,58,94,.95)}

/* ══════════════════ D · ARÈNE (13/10/2026) ══════════════════
   La charte de l'écran de connexion appliquée à toute la plateforme :
   nuit profonde, surfaces bleu ardoise, or des projecteurs, boutons en
   pilule. Tout passe par les jetons ; ce bloc ne fait que les redéfinir et
   arrondir les composants communs. Pour revenir en arrière : supprimer ce
   bloc, rien d'autre ne dépend de lui. */
:root{
  --nuit:#070B14; --fond2:#0A1020;
  --surface:#111A2C; --surface2:#16213A; --surface3:#1E2B49;
  --ligne:#22304C; --ligne2:#2E4166;
  --texte:#F5F7FB; --gris:#9AA6BC; --gris2:#6F7D97;
  --r:20px; --r2:14px;
  --ombre:0 18px 44px rgba(0,0,0,.5);
}
body{background:var(--nuit)}
.entete{background:rgba(7,11,20,.92);border-bottom-color:#1B2740}
.ent-logo b{color:var(--texte);font-size:20px}
.ent-sortie{border-radius:99px;padding:7px 13px}
.nav{background:rgba(10,16,32,.97);border-top-color:#1B2740}
.nav-item{color:#8E9AB2;font-size:10px}
.nav-item.actif{color:var(--or);background:transparent;font-weight:700}
.nav-item.actif svg{stroke-width:2.1}

.vue-titre{font-size:30px;letter-spacing:1.4px}
.banniere{
  border-radius:24px;border:1px solid #22304C;
  background:
    radial-gradient(420px 260px at 88% -10%,rgba(255,178,70,.30),transparent 62%),
    radial-gradient(360px 240px at 10% 120%,rgba(111,183,240,.16),transparent 66%),
    linear-gradient(165deg,#16213A 0%,#0E1626 55%,#070B14 100%);
}
.banniere::after{border-color:rgba(255,178,70,.08)}
.ban-titre{font-size:34px}
.carte{border-radius:var(--r);padding:16px}
.carte-titre{font-size:18px;letter-spacing:1px}
.section-titre{font-size:15px;letter-spacing:1.6px;color:var(--texte)}
.section-titre::after{background:#1B2740}
.tuile{border-radius:16px;padding:14px 10px}
.tuile-val{font-size:30px}
.jl-item{border-radius:16px;padding:10px 12px}
.jl-num{border-radius:12px;background:#0A1020;border:1px solid var(--ligne)}
.ong{background:var(--surface);border:1px solid var(--ligne);border-radius:99px;padding:4px;gap:4px;width:max-content;max-width:100%}
.ong-b{border:0;padding:8px 15px;color:#C3CBDA}
.ong-b.actif{color:#0A0E17}
.jauge,.dom-barre{background:#0A1020}
.champ{background:#0E1626;border-color:#2A3A5A;border-radius:14px}
.bouton{border-radius:99px;padding:12px 20px;color:#0A0E17}
.bouton.fant{border-color:#2A3A5A}
.msg{border-radius:14px}
.tab-enrob{border-radius:16px}
table.tab td{border-bottom-color:#1B2740}
table.tab tr.nous{background:rgba(255,178,70,.12)}
.dom-ligne+.dom-ligne,.tir-serie{border-color:#1B2740}
.vide{border-radius:var(--r);border-color:#2A3A5A}

@media screen and (min-width:780px){
  .vue-titre{font-size:38px}
  .nav{background:transparent;border-bottom-color:#1B2740}
  .nav-item{color:#C3CBDA;font-size:13.5px;padding:9px 15px;border-radius:99px}
  .nav-item:hover{color:var(--texte);background:var(--surface)}
  .nav-item.actif{background:var(--or);color:#0A0E17}

/* Ordinateur (13/10, demande de Fathy) : la barre du haut et le menu restent
   à l'écran pendant le défilement. position:fixed plutôt que sticky : sticky
   dépend de ses parents (grille, débordement) et lâchait au défilement. La
   page défile toujours dans la fenêtre, donc les window.scrollTo(0,0) du code
   continuent de marcher. */
@media screen and (min-width:780px){
  .entete{position:fixed;top:0;left:0;right:0;height:56px;padding-top:0;padding-bottom:0;background:#070B14}
  #app.on{padding-top:56px}
  .hf{position:sticky;top:56px}
  .nav{position:fixed;top:56px;left:0;right:0;bottom:auto;max-width:none;margin:0;z-index:58;
    justify-content:center;background:rgba(7,11,20,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .vue{padding-top:76px}
}
/* Grand écran : le menu passe en colonne à gauche, comme la maquette web. */
@media screen and (min-width:1100px){
  #app.on>.nav{top:56px;bottom:0;right:auto;width:248px;
    flex-direction:column;justify-content:flex-start;gap:4px;padding:22px 14px;overflow-y:auto;
    border:0;border-right:1px solid #1B2740;background:#0A1020;backdrop-filter:none}
  #app.on>.nav .nav-item{flex:0 0 auto;justify-content:flex-start;width:100%;font-size:14px;padding:11px 15px;gap:12px}
  #app.on>.nav .nav-item svg{width:18px;height:18px}
  #app.on>.hf{margin-left:248px}
  #app.on>.vue{margin-left:248px;width:auto;max-width:none;padding:28px 36px 48px}
}

<body>
<!-- ══════════════════════════════════ CONNEXION ══════════════════════════════════ -->
<div id="connexion">
  <!-- Écran de connexion « Arène » (13/10/2026). La photo : un joueur de l'ASA
       vu de dos, n°13, sous le panier — l'image de référence de Fathy, sans
       aucune marque Win For Fun. Deux cadrages : paysage sur ordinateur,
       recomposé en hauteur sur téléphone (<picture>). Les identifiants du
       formulaire (cxForm, cxCode, cxErreur, cxBascule, cxListe) ne changent
       pas : toute la logique de connexion reste celle d'avant. -->

/* ═══════════════ L'HEURE DU CLUB ═══════════════                (23/10/2026)

   Demande de Fathy : « tout ce qui demande une date et une heure doit avoir
   l'information correcte ». Deux causes d'erreur, deux corrections.

   1. LE FUSEAU. La plateforme lisait l'heure LOCALE de l'appareil. À Adjamé
      c'est juste ; ailleurs (Fathy en France, un coach en déplacement), une
      séance ouverte à 18 h 00 s'affichait 20 h 00, et une saisie faite à
      23 h 30 tombait le lendemain. Tout ce qui est daté ou horodaté se lit
      désormais à l'heure d'Abidjan, l'heure du club, sur tous les appareils.

   2. L'HORLOGE. Un téléphone réglé à la main peut avoir des jours d'avance ou
      de retard. Chaque réponse de Supabase porte l'heure du serveur (en-tête
      Date, lisible par la page) : on en tire l'écart avec l'appareil, et
      `maintenant()` le corrige. Un écart de moins d'une minute est ignoré
      (l'en-tête est à la seconde près). L'écart est gardé sur l'appareil pour
      rester juste hors ligne ; sans aucune mesure, c'est l'horloge du
      téléphone, comme avant. */
const FUSEAU = 'Africa/Abidjan';
let DECALAGE_HORLOGE = (() => {
  try { const v = Number(localStorage.getItem('asa-decalage-horloge')); return isFinite(v) ? v : 0; }
  catch (e) { return 0; }
})();
const maintenant = () => new Date(Date.now() + DECALAGE_HORLOGE);
function recaleHorloge(entete, t0, t1){
  const serveur = Date.parse(entete || '');
  if (isNaN(serveur)) return;
  /* L'en-tête tronque à la seconde : +500 ms vise le milieu de cette seconde,
     et le milieu de l'aller-retour estime l'instant de la réponse. */
  const ecart = serveur + 500 - (t0 + t1) / 2;
  const nouveau = Math.abs(ecart) > 60000 ? Math.round(ecart) : 0;
  if (nouveau === DECALAGE_HORLOGE) return;
  DECALAGE_HORLOGE = nouveau;
  try { localStorage.setItem('asa-decalage-horloge', String(nouveau)); } catch (e) {}
}
/* Les morceaux d'un instant, à l'heure du club. Sans Intl à fuseaux (très
   vieux navigateurs), on retombe sur l'heure locale de l'appareil. */
let FMT_CLUB = null;
function partiesClub(d){
  d = d || maintenant();
  try {
    FMT_CLUB = FMT_CLUB || new Intl.DateTimeFormat('fr-FR', {timeZone: FUSEAU, year: 'numeric',
      month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
    const o = {};
    FMT_CLUB.formatToParts(d).forEach(p => { o[p.type] = p.value; });
    if (o.hour === '24') o.hour = '00';
    return o;
  } catch (e) {
    const p = n => String(n).padStart(2, '0');
    return {year: String(d.getFullYear()), month: p(d.getMonth() + 1), day: p(d.getDate()),
            hour: p(d.getHours()), minute: p(d.getMinutes())};
  }
}
/* « 18:05 » — l'heure du club, pour un instant donné ou pour maintenant. */
const heureClub = d => { const p = partiesClub(d); return p.hour + ':' + p.minute; };
/* « 12/10/2026 » — la date du club d'un instant (horodatage de la base,
   « 2026-10-12T23:41:00+00:00 »). Une date seule (« 2026-10-12 ») n'a pas
   d'heure : elle se lit telle quelle, sans passer par un fuseau qui pourrait
   la décaler d'un jour. */
function dateClubFr(v){
  if (!v) return '';
  const s = String(v);
  if (!/T|\s\d{2}:/.test(s)) return s.slice(0, 10).split('-').reverse().join('/');
  const d = new Date(s);
  if (isNaN(d)) return s.slice(0, 10).split('-').reverse().join('/');
  const p = partiesClub(d);
  return p.day + '/' + p.month + '/' + p.year;
}
const NOMS_MOIS = ['Janvier', 'Février', 'Mars', 'Avril', 'Mai', 'Juin', 'Juillet', 'Août',

/* La période en cours : le cycle de la saison qui contient aujourd'hui

function periodeCourante(){
  try {
    if (enLigne()){
      const auj = AUJ(), c = (DB.cycles || []).find(x => x.debut <= auj && auj <= x.fin);

      const [a, m] = auj.split('-');
      return NOMS_MOIS[Number(m) - 1] + ' ' + a;

}

/* Date de référence — une seule source, pour que « aujourd'hui » veuille dire

const dateDuJour = () => {
  const p = partiesClub(maintenant());

const AUJ = () => {
  try { if (enLigne()) return dateDuJour(); } catch (e){}

};
const AUJ_FR = () => {
  try { if (enLigne()) { const [a, m, j] = dateDuJour().split('-'); return `${j}/${m}/${a}`; } } catch (e){}

};

/* ══════════════════════════════════════════ challenge de tir — calculs
   PROTOCOLE DE SNIPER. C'est celui qui tourne au gymnase depuis septembre, et
   il gagne sur celui de la plateforme pour trois raisons mesurables.

   1. TROIS PARCOURS, pas un seul. La plateforme ne savait faire saisir que les
      cinq spots extérieurs. Un pivot qui travaille le poste bas et le cercle
      n'avait rien à saisir, ou saisissait un parcours qui ne lui ressemble pas.
      Sniper définit « ext » (5 spots), « int » (7 postes) et « complet » (les
      12), et chaque joueur porte le sien.

   2. LE TERRAIN ET LES LANCERS FRANCS NE SE MÉLANGENT JAMAIS. La plateforme
      calculait un pourcentage unique sur les 300 tirs. Or un lancer franc se
      réussit autour de 70 % et un tir à 3 points autour de 35 % : les
      additionner produit un chiffre qui ne décrit aucun geste, et qui MONTE
      quand un joueur tire simplement plus de lancers francs. `pct` ne compte
      plus que le terrain ; `pctLf` est à côté, et `pctGlobal` reste disponible
      pour les rares endroits qui veulent vraiment le volume total.

   3. ON NE COMPARE QUE CE QUI SE COMPARE. Un bilan se demande sur un parcours
      donné, et sur les N séances les plus récentes. Cumuler quinze séances
      d'octobre avec trois de décembre dans un même pourcentage efface
      exactement ce qu'on cherche à voir.

   Une séance reste 20 tirs par série, aller-retour, plus 5 séries de 20 lancers
   francs. Ces chiffres sont ceux de l'ENTRAÎNEMENT : ils ne se mélangent pas
   aux statistiques de match, qui viennent de l'analyse Hudl. */

/* ── index des spots et des parcours ──────────────────────────────────────────
   Refait à chaque changement de source. En mode serveur `DB` est REMPLACÉ
   après coup : un index calculé une seule fois au chargement continuerait de
   pointer sur les spots de la démonstration. C'est le défaut qu'avait eu Sniper
   avec son index de joueurs, et il ne se voit pas — l'écran s'affiche, les
   chiffres sont simplement faux. */
let SPOTS = {};
function indexeSpots(){
  SPOTS = {};
  (DB.spotsExt || DB.spots || []).forEach(s => { SPOTS[s.id] = Object.assign({zone:'ext'}, s); });
  (DB.spotsInt || []).forEach(s => { SPOTS[s.id] = Object.assign({zone:'int'}, s); });
  return Object.keys(SPOTS).length;
}
indexeSpots();

const PARCOURS_IDS = ['ext', 'int', 'complet'];
const parcoursDef  = p => (DB.parcours || {})[p] || null;
const spotsDe      = p => { const c = parcoursDef(p); return c ? c.spots.map(id => SPOTS[id]).filter(Boolean) : []; };
/* Le parcours d'un joueur, et 'ext' quand le classeur n'en dit rien : c'était
   le seul que la plateforme savait faire, donc c'est le bon repli. */
const parcoursDe   = j => (j && parcoursDef(j.parcours)) ? j.parcours : 'ext';
const nomParcours  = p => (parcoursDef(p) || {}).nom || p;

/* Les séries d'un parcours, dans l'ordre où le binôme les tire : un
   aller-retour repasse les spots dans l'autre sens. */
function seriesDe(p){
  const c = parcoursDef(p);
  if (!c) return [];
  const l = [];
  c.spots.forEach(id => l.push({spot: id, sens: 'aller'}));
  if (c.allerRetour) c.spots.slice().reverse().forEach(id => l.push({spot: id, sens: 'retour'}));
  return l;
}
function totalTirs(p){
  const c = parcoursDef(p);
  if (!c) return 0;
  return (seriesDe(p).length + (c.seriesLf || 0)) * DB.tirsParSerie;
}

/* ── une séance ───────────────────────────────────────────────────────────────
   `parSpot` n'est plus pré-rempli avec tous les spots : une séance extérieure
   ne doit pas porter sept postes intérieurs à 0 tir, sinon le terrain affiche
   des zéros là où le joueur n'a rien tiré. */
function bilanSession(s){
  const parSpot = {};
  let tirs = 0, reussis = 0;
  (s.series || []).forEach(x => {
    const n = DB.tirsParSerie;
    tirs += n; reussis += (x.reussis || 0);
    const c = parSpot[x.spot] || (parSpot[x.spot] = {tirs:0, reussis:0});
    c.tirs += n; c.reussis += (x.reussis || 0);
  });
  Object.keys(parSpot).forEach(id => { parSpot[id].pct = pct(parSpot[id].reussis, parSpot[id].tirs); });
  let lfTirs = 0, lfReussis = 0;
  (s.lf || []).forEach(r => { lfTirs += DB.tirsParSerie; lfReussis += (r || 0); });
  return {
    date: s.date, parcours: s.parcours || 'ext', saisiPar: s.saisiPar,
    tirs, reussis, pct: pct(reussis, tirs),
    lfTirs, lfReussis, lfPct: pct(lfReussis, lfTirs),
    total: tirs + lfTirs, totalReussis: reussis + lfReussis,
    pctGlobal: pct(reussis + lfReussis, tirs + lfTirs),
    parSpot
  };
}

/* ── toutes les séances d'un joueur ───────────────────────────────────────────
   `parcours` filtre, `limite` ne garde que les N plus récentes (0 = tout).
   La liste revient du plus récent au plus ancien : `sessions[0]` est la
   dernière séance, et c'est ce que lisent les écrans. */
function bilanTir(j, parcours, limite){
  let l = ((j && j.tir && j.tir.sessions) || []).slice()
            .sort((a, b) => String(a.date) < String(b.date) ? 1 : -1);
  if (parcours) l = l.filter(s => (s.parcours || 'ext') === parcours);
  if (limite) l = l.slice(0, limite);
  const bs = l.map(bilanSession);
  const parSpot = {};
  let tirs = 0, reussis = 0, lfTirs = 0, lfReussis = 0;
  bs.forEach(b => {
    tirs += b.tirs; reussis += b.reussis;
    lfTirs += b.lfTirs; lfReussis += b.lfReussis;
    Object.keys(b.parSpot).forEach(id => {
      const c = parSpot[id] || (parSpot[id] = {tirs:0, reussis:0});
      c.tirs += b.parSpot[id].tirs; c.reussis += b.parSpot[id].reussis;
    });
  });
  Object.keys(parSpot).forEach(id => { parSpot[id].pct = pct(parSpot[id].reussis, parSpot[id].tirs); });
  return {
    sessions: bs, nb: bs.length,
    tirs, reussis, pct: pct(reussis, tirs),
    lfTirs, lfReussis, lfPct: pct(lfReussis, lfTirs),
    total: tirs + lfTirs, totalReussis: reussis + lfReussis,
    pctGlobal: pct(reussis + lfReussis, tirs + lfTirs),
    parSpot, parcours: parcours || null,
    derniere: bs[0] || null,
    dateDerniere: bs[0] ? bs[0].date : null,
    /* Pour les courbes : du plus ANCIEN au plus récent, sinon la progression
       se lit à l'envers et une montée ressemble à une chute. */
    serie: bs.map(b => b.pct).reverse(),
    tendance: bs.length >= 2 ? (bs[0].pct - bs[1].pct) : null
  };
}

/* Meilleur et pire spot — sert aux consignes de séance. En dessous de `mini`
   tirs l'échantillon ne dit rien : deux séries ratées sur un spot ne font pas
   une faiblesse, et l'annoncer au joueur comme telle est une faute de coach. */
function extremesSpots(parSpot, mini){
  const l = Object.keys(parSpot || {})
    .filter(id => parSpot[id].tirs >= (mini || 40) && SPOTS[id])
    .map(id => ({id, pct: parSpot[id].pct, nom: SPOTS[id].nom}));
  if (!l.length) return {fort: null, faible: null};
  l.sort((a, b) => b.pct - a.pct);
  return {fort: l[0], faible: l[l.length - 1]};
}

/* Classement d'une équipe. Un joueur qui n'a jamais fait ce parcours n'y
   figure pas : l'afficher à 0 % par absence serait un mensonge, et c'est le
   genre de mensonge qu'un joueur voit écrit à côté de son nom. */
function classementTir(eq, parcours, limite){
  return parEq(eq).map(j => ({j, b: bilanTir(j, parcours, limite)}))
    .filter(o => o.b.nb > 0)
    .sort((a, b) => b.b.pct - a.b.pct);
}

/* Réussite terrain moyenne d'un groupe, sur les trois dernières séances de
   chaque joueur. Les joueurs sans séance sont ÉCARTÉS du calcul au lieu de
   compter pour 0 : c'est le même mensonge que dans le classement, mais en
   pire, parce qu'ici il tire la tuile du staff vers le bas sans que personne
   puisse voir d'où vient le chiffre. Le nombre de joueurs retenus revient avec
   la moyenne, pour que l'écran puisse le dire. */
function moyTirGroupe(js, limite){
  const l = (js || []).map(j => bilanTir(j, null, limite === undefined ? 3 : limite))
    .filter(b => b.nb > 0);
  return {pct: l.length ? Math.round(l.reduce((a, b) => a + b.pct, 0) / l.length) : 0,
          nb: l.length, sur: (js || []).length};
}

/* Radar 8 domaines — mois courant plein, premier mois en pointillés */
function radar(j, taille){
  const n = DB.domaines.length, R = 96;
  const T = taille || 300;
  const pt = (i,v) => {
    const a = -Math.PI/2 + i * 2*Math.PI/n, r = v/10*R;
    return [Math.cos(a)*r, Math.sin(a)*r];
  };
  let g = '';
  for (const niv of [2.5,5,7.5,10]){
    const d = Array.from({length:n}, (_,i) => pt(i,niv).map(v=>v.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${d}" fill="none" stroke="#183A5E" stroke-width="${niv===10?1.3:0.8}"/>`;
  }
  for (let i=0;i<n;i++){
    const [x,y] = pt(i,10);
    g += `<line x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#183A5E" stroke-width="0.8"/>`;
  }
  const serie = (idx, coul, pointille) => {
    const d = DB.domaines.map((dom,i) => pt(i, j.notes[dom][idx]).map(v=>v.toFixed(1)).join(',')).join(' ');
    return `<polygon points="${d}" fill="${coul}" fill-opacity="${pointille?0:0.20}" stroke="${coul}"
             stroke-width="${pointille?1.6:2.2}" ${pointille?'stroke-dasharray="4,3"':''} stroke-linejoin="round"/>`;
  };
  const dern = j.moyennes.length - 1;
  let pts = '';
  if (dern > 0) g += serie(0, '#3993D1', true);
  g += serie(dern, '#FFB246', false);
  DB.domaines.forEach((dom,i) => {
    const [x,y] = pt(i, j.notes[dom][dern]);
    pts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.8" fill="#FFB246" stroke="#04101F" stroke-width="1"/>`;
  });
  let lab = '';
  DB.domaines.forEach((dom,i) => {
    const [x,y] = pt(i, 12.4);
    const anc = Math.abs(x) < 8 ? 'middle' : x > 0 ? 'start' : 'end';
    lab += `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anc}" font-size="9.5"
             fill="#93AAC6" font-family="DM Sans,sans-serif">${esc(ABREGE[dom])}</text>`;
  });
  return `<div class="radar-enrob"><svg viewBox="-172 -128 344 256" width="${T}" style="max-width:100%;height:auto"
    role="img" aria-label="Profil de ${esc(j.nom)} sur les huit domaines">${g}${pts}${lab}</svg></div>
    <div class="legende">
      <span><i style="background:#FFB246"></i>${esc(moisNom(dern, j))}</span>
      ${dern>0?`<span><i style="background:#3993D1"></i>${esc(moisNom(0, j))} (départ)</span>`:''}
    </div>`;
}

/* Courbe — `etiquettes` donne le libellé de chaque point */
function courbe(series, libelles, couleurs, etiquettes, max){
  const L = 300, H = 92, mg = {g:26,d:8,h:10,b:20};
  const n = Math.max(...series.map(s => s.length));
  const haut = max || 10;
  const pas = haut / 5;
  const X = i => mg.g + (n<2?0:i*(L-mg.g-mg.d)/(n-1));
  const Y = v => mg.h + (haut-v)/haut*(H-mg.h-mg.b);
  let g = '';
  for (let k=1;k<=5;k++){
    const v = pas*k;
    g += `<line x1="${mg.g}" y1="${Y(v).toFixed(1)}" x2="${L-mg.d}" y2="${Y(v).toFixed(1)}" stroke="#183A5E" stroke-width="0.7"/>
          <text x="${mg.g-6}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="8.5" fill="#62809E" font-family="IBM Plex Mono,monospace">${Math.round(v)}</text>`;
  }
  series.forEach((s,k) => {
    const c = couleurs[k];
    const d = s.map((v,i) => `${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
    s.forEach((v,i) => { g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="${c}" stroke="#04101F" stroke-width="1.2"/>`; });
  });
  for (let i=0;i<n;i++){
    const lib = (etiquettes && etiquettes[i]) || moisCourt(i);
    g += `<text x="${X(i).toFixed(1)}" y="${H-5}" text-anchor="middle" font-size="8.5" fill="#62809E" font-family="IBM Plex Mono,monospace">${esc(lib)}</text>`;
  }
  const leg = libelles.map((l,k) => `<span><i style="background:${couleurs[k]}"></i>${esc(l)}</span>`).join('');
  return `<svg viewBox="0 0 ${L} ${H}" width="100%" style="display:block;height:auto" role="img"
            aria-label="Progression">${g}</svg>
          ${libelles.length>1?`<div class="legende" style="margin-top:6px">${leg}</div>`:''}`;
}

/* Barres par domaine, écart depuis le premier mois */
function domaines(j){
  const dern = j.moyennes.length - 1;
  return DB.domaines.map(dom => {
    const v = j.notes[dom][dern], v0 = j.notes[dom][0], d = +(v - v0).toFixed(1);
    const cls = d > 0.15 ? 'hausse' : d < -0.15 ? 'baisse' : 'plat';
    return `<div class="dom-ligne">
      <div><div class="dom-nom">${esc(dom)}</div>
        <div class="dom-barre"><i style="width:${(v*10).toFixed(0)}%;background:${couleurNote(v)}"></i></div></div>
      <div><div class="dom-val">${v.toFixed(1)}</div>
        <div class="dom-delta ${cls}">${dern>0?(d>0?'+':'')+d.toFixed(1):'—'}</div></div>
    </div>`;
  }).join('');
}

/* Les spots du parcours posés sur le terrain, colorés par réussite.
   `parcours` décide lesquels : cinq pour l'extérieur, sept pour l'intérieur,
   douze pour le complet. Sans lui, l'extérieur — c'est le parcours par défaut
   et celui que dessinait la version précédente. */
function terrainSpots(parSpot, actif, cliquable, parcours){
  let g = '';
  spotsDe(parcours || 'ext').forEach(s => {
    const b = (parSpot || {})[s.id] || {reussis:0, tirs:0};
    const p = pct(b.reussis, b.tirs);
    const coul = b.tirs ? couleurPct(p) : '#27578A';
    const estActif = actif === s.id;
    g += `<g class="${cliquable ? 'spot-b' : ''}" ${cliquable ? `onclick="choisitSpot('${s.id}')"` : ''}>
      <circle cx="${s.x}" cy="${s.y}" r="${estActif ? 17 : 14}" fill="${coul}" fill-opacity="${b.tirs ? .26 : .14}"
              stroke="${coul}" stroke-width="${estActif ? 3 : 2}"/>
      <text x="${s.x}" y="${s.y + 4}" text-anchor="middle" font-size="11" font-weight="700"
            fill="${b.tirs ? coul : '#93AAC6'}" font-family="IBM Plex Mono,monospace">${b.tirs ? p : '–'}</text>
      <text x="${s.x}" y="${s.y + (s.y > 200 ? -22 : 26)}" text-anchor="middle" font-size="8.5"
            fill="#93AAC6" font-family="DM Sans,sans-serif">${esc(s.court)}</text>
    </g>`;
  });
  // repère des lancers francs
  g += `<g><circle cx="${DB.lfPos.x}" cy="${DB.lfPos.y}" r="11" fill="none" stroke="#27578A"
        stroke-width="1.5" stroke-dasharray="3,2"/>
        <text x="${DB.lfPos.x}" y="${DB.lfPos.y + 3.5}" text-anchor="middle" font-size="8"
        fill="#93AAC6" font-family="DM Sans,sans-serif">LF</text></g>`;
  return g;
}

/* Détection de la valeur d'un tir sur le terrain entier. */
function detecteZone(p){
  const gauche = p.x < 280;
  const panier = gauche ? PANIER_G : PANIER_D;
  const lf = gauche ? LF_G : LF_D;
  if (p.x >= lf.x1 && p.x <= lf.x2 && p.y >= lf.y1 && p.y <= lf.y2)
    return {pts:1, lib:'Lancer franc', cote: gauche ? 'rouges' : 'blancs'};
  const d = Math.hypot(p.x - panier.x, p.y - panier.y);
  const coin = (p.y < COIN_H || p.y > COIN_B) && (gauche ? p.x < 49.5 : p.x > 510.5);
  const cote = gauche ? 'rouges' : 'blancs';
  if (d > ARC_PLEIN || coin) return {pts:3, lib:'3 points', cote};
  return {pts:2, lib:'2 points', cote};
}

/* Le terrain d'un bilan. Le parcours vient du bilan lui-même quand il en porte
   un — un bilan de séance intérieure doit dessiner les sept postes, pas les
   cinq spots extérieurs. */
function carteTirs(b, taille, parcours){
  const p = parcours || (b && b.parcours) || 'ext';
  return `<div class="terrain-enrob" style="max-width:${taille || 380}px;margin:0 auto">
    ${terrainSVG('t' + Math.random().toString(36).slice(2,7), terrainSpots(b.parSpot, null, false, p))}
  </div>`;
}

const ICO = {
