/* ══════════════════════════════════════════════════════════════════════════
   CONNEXION — le protocole d'ASA Sniper, repris tel quel

   Une seule porte pour tout le monde : un champ, un code de six caractères,
   vérifié par le serveur. Le navigateur ne compare rien — il ne détient ni la
   liste des codes, ni les empreintes. Il envoie ce qui a été saisi et reçoit,
   ou non, une session.

   Le rôle ne vient pas du code : il vient de la base. `role_fin` porte l'un
   des neuf rôles de la plateforme (dt, hc, ca, cd, an, ki, as, pp, jr), et
   c'est lui — jamais la classe d'accès de Sniper — qui décide des onglets.

   Ce que l'appareil garde, et pourquoi. La session et l'effectif reçu sont
   écrits sur l'appareil, pour que la plateforme s'ouvre au gymnase quand le
   réseau n'est pas là. La garantie devient alors « cet appareil a été
   authentifié », pas « cette personne l'est maintenant » — celui qui tient le
   téléphone déverrouillé a ce que son propriétaire avait. C'est le prix du
   hors-ligne, il est assumé.
   ══════════════════════════════════════════════════════════════════════════ */

const CLEF_SESSION = 'asa.plateforme.session';
const AGE_MAX_SESSION = 30 * 24 * 3600 * 1000;   // au-delà, on redemande le code

let SESSION = null;

function sessionLue(){
  try {
    const s = JSON.parse(localStorage.getItem(CLEF_SESSION) || 'null');
    if (!s || !s.ts || Date.now() - s.ts > AGE_MAX_SESSION) return null;
    return s;
  } catch (e){ return null; }
}
function sessionEcrite(s){
  try { localStorage.setItem(CLEF_SESSION, JSON.stringify(s)); } catch (e){}
}
function sessionEffacee(){
  try { localStorage.removeItem(CLEF_SESSION); } catch (e){}
}

/* Le jeton de session s'il est là, la clé publique sinon. La clé publique
   seule n'ouvre rien : le schéma n'accorde aucun droit au rôle anonyme. */
function entetesASA(){
  return {
    'apikey': SOURCE.cle,
    'Authorization': 'Bearer ' + (SOURCE.jeton || SOURCE.cle),
    'Content-Type': 'application/json'
  };
}

/* Un fetch sans délai maximum attend presque indéfiniment. Au gymnase, le
   réseau ne tombe pas franchement : il pend. Sans ce garde-temps, appuyer sur
   « Entrer » ne produisait RIEN — ni message, ni refus, ni entrée — et la
   personne recliquait dans le vide. Mieux vaut dire « injoignable » au bout de
   douze secondes que ne jamais rien dire. */
const DELAI_MAX = 12000;

function fetchBorne(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), ms || DELAI_MAX);
  return fetch(url, Object.assign({}, opts, {signal: ctrl.signal}))
    .finally(() => clearTimeout(t));
}

async function serveurConnexion(code){
  try {
    const r = await fetchBorne(SOURCE.url + '/functions/v1/asa-connexion', {
      method: 'POST',
      headers: {'apikey': SOURCE.cle, 'Content-Type': 'application/json'},
      body: JSON.stringify({code: code})
    });
    const d = await r.json().catch(() => null);
    if (!d || !d.ok) return {ok: false, raison: (d && d.raison) || 'code'};
    return d;
  } catch (e){
    /* Abandon sur délai ou coupure : dans les deux cas, le code n'est pas en
       cause et ressaisir ne changera rien. */
    return {ok: false, raison: 'reseau'};
  }
}

async function serveurEffectif(){
  try {
    const r = await fetchBorne(SOURCE.url + '/rest/v1/rpc/asa_effectif', {
      method: 'POST', headers: entetesASA(), body: '{}'
    });
    if (!r.ok) return null;
    const l = await r.json();
    return Array.isArray(l) ? l : null;
  } catch (e){ return null; }
}

/* ─────────────────────────────────────────── l'effectif reçu devient DB

   Le serveur découpe les colonnes selon le rôle : le staff reçoit les codes,
   l'assistant les secrets, un rôle de plateforme ni l'un ni l'autre, un joueur
   sa seule ligne. On range ce qui arrive sans rien inventer de ce qui manque.

   Un joueur dont la base ne connaît que l'identité obtient une fiche à zéro,
   pas une fiche absente : les écrans savent afficher un radar vide, ils ne
   savent pas afficher un joueur qui n'existe pas. Les évaluations, le PDI et
   les statistiques viendront du schéma de la plateforme quand il sera posé ;
   d'ici là ces champs restent vides, et la plateforme le dit plutôt que de
   faire passer des zéros pour des mesures. */
function ficheVide(l){
  const dom = (DB.domaines || []), notes = {};
  dom.forEach(d => { notes[d] = [0]; });
  return {
    id: l.id, nom: l.nom, equipe: l.equipe || 'pro',
    poste: l.poste || 'Ailier', numero: l.numero || 0,
    age: null, taille: l.taille || 0,
    notes: notes, moyennes: [0], sansMesure: true,
    tirs: [], stats: {matchs:0, min:0, pts:0, reb:0, pd:0, int:0, bp:0, fte:0,
                      a2:100, m2:0, a3:100, m3:0, lfa:100, lfm:0},
    presence: 0, forts: [], axes: [],
    directives: [], programme: {intitule:'—', seances:0, consigne:'', exercices:[]},
    motCoach: '', objectifs: [], quizFaits: {},
    /* portés depuis Sniper : le parcours de tir et la graine du QR. Le secret
       n'arrive QUE sur sa propre ligne — personne ne reçoit celui d'un autre. */
    parcours: l.parcours || '', secret: l.secret || ''
  };
}

function poseEffectifASA(lignes){
  const joueurs = [], staff = [];
  (lignes || []).forEach(l => {
    if (l.role === 'jr') joueurs.push(ficheVide(l));
    else staff.push({
      id: l.id, staffId: l.id, roleCode: l.role || '',
      nom: l.nom, fonction: l.fonction || '',
      role: l.fonction || ((ROLES[l.role] || {}).lib || ''),
      /* Les équipes du club, pas un tableau vide. La fonction de connexion
         ne dit pas quelle équipe suit un membre du staff ; par défaut il
         suit les deux, comme dans chargerSupabase(). Le tableau vide
         d'avant mettait E.equipes à [] et vidait tous les écrans qui
         filtrent dessus, sans message. */
      equipes: l.equipe ? [l.equipe] : (DB.equipes || []).map(e => e.id),
      code: ''
    });
  });

  if (joueurs.length) DB.joueurs = joueurs;
  if (staff.length)   DB.staff   = staff;

  /* Les équipes se déduisent de l'effectif reçu, comme elles se déduisaient du
     classeur : un sélecteur à une seule option n'est pas un choix. */
  const NOMS = {pro: 'Équipe Pro', espoirs: 'Équipe Espoirs'};
  const vues = [];
  DB.joueurs.forEach(j => { if (vues.indexOf(j.equipe) < 0) vues.push(j.equipe); });
  DB.equipes = ['pro', 'espoirs'].filter(e => vues.indexOf(e) >= 0)
    .concat(vues.filter(e => e !== 'pro' && e !== 'espoirs').sort())
    .map(e => ({id: e, nom: NOMS[e] || (e.charAt(0).toUpperCase() + e.slice(1))}));

  /* Un membre du staff travaille sur toutes les équipes tant que la base ne
     dit pas le contraire : mieux vaut un onglet de trop qu'un joueur invisible
     pour celui qui doit l'entraîner. */
  const tous = DB.equipes.map(e => e.id);
  DB.staff.forEach(m => { if (!m.equipes.length) m.equipes = tous.slice(); });

  focusEquipes();
  return joueurs.length;
}

/* ─────────────────────────────────────────── la porte

   Rend {ok, role, id, joueurId} prêts pour connexion(), ou {ok:false, raison}.
   Jamais un null muet : l'écran de connexion doit pouvoir distinguer un
   mauvais code d'une coupure réseau, parce que la conduite à tenir n'est pas
   la même — ressaisir, ou attendre. */
async function identifieParCode(code){
  const r = await serveurConnexion(code);
  if (!r.ok) return {ok: false, raison: r.raison};

  const role = r.role_fin;
  /* Une ligne de staff au rôle illisible arrive ici sans rôle. Elle a un code
     valide et n'ouvre rien : c'est voulu, et c'est à corriger dans le
     classeur, pas à rattraper par un rôle par défaut. */
  if (!role || !PLAN[role]) return {ok: false, raison: 'role'};
  /* Équipe fermée pour le moment (voir EQUIPES_ACTIVES) : on le dit, plutôt
     que d'ouvrir un écran sans joueur. Rien n'est fait côté serveur. */
  if (role === 'jr' && r.equipe && !equipeOuverte(r.equipe)) return {ok: false, raison: 'equipe'};

  SOURCE.jeton  = (r.session && r.session.access_token) || null;
  /* club_id reste vide à cet instant : la fonction Edge rend le rôle et le
     nom, pas le club. chargerSupabase() le posera au premier chargement, et
     les écritures le prennent au moment de l'envoi — pas de la saisie. */
  SOURCE.membre = {id: r.id, role: role, nom: r.nom, club_id: SOURCE.clubId || null};

  const lignes = await serveurEffectif();
  /* La fonction de connexion ne dit pas toujours l'équipe ; la ligne du joueur
     dans l'effectif, si. Sans ce second contrôle, un joueur d'une équipe fermée
     filtré hors de l'effectif était recréé plus bas en fiche vide « pro ». */
  const sienne = role === 'jr' && (lignes || []).find(l => l.id === r.id);
  if (sienne && !equipeOuverte(sienne.equipe)){
    SOURCE.jeton = null; SOURCE.membre = null;
    return {ok: false, raison: 'equipe'};
  }
  if (lignes) poseEffectifASA(lignes);

  /* Le joueur ne reçoit que lui : on complète avec ce que la connexion a déjà
     renvoyé, pour que son écran soit complet même si l'appel a échoué. */
  if (role === 'jr' && !DB.joueurs.some(j => j.id === r.id)){
    DB.joueurs = [ficheVide(r)];
    DB.equipes = [{id: r.equipe || 'pro',
                   nom: r.equipe === 'espoirs' ? 'Équipe Espoirs' : 'Équipe Pro'}];
  }
  /* Un membre du staff peut ne pas figurer dans l'effectif qu'il reçoit. On
     l'y ajoute pour que membre(id) le trouve : sans ça la connexion réussit
     et l'en-tête s'affiche vide. */
  if (role !== 'jr' && !DB.staff.some(m => m.id === r.id)){
    DB.staff = (DB.staff || []).concat([{
      id: r.id, staffId: r.id, roleCode: role, nom: r.nom,
      fonction: r.fonction || '', role: r.fonction || (ROLES[role] || {}).lib || '',
      equipes: (DB.equipes || []).map(e => e.id), code: ''
    }]);
  }

  /* Maintenant qu'il y a un jeton, on tente le schéma de la plateforme — mais
     SANS attendre. Tant qu'il n'est pas posé, cet appel est une douzaine de
     requêtes vouées à l'échec : les attendre ferait patienter devant la porte
     pour un refus connu d'avance. On entre tout de suite avec l'effectif de
     l'identité, et l'écran se redessine seul si les données arrivent. */
  enrichitDepuisPlateforme().then(complet => {
    if (complet){ if (typeof rendVue === 'function' && E.role) rendVue(); return; }
    bandeau('Effectif réel, évaluations pas encore reliées : les fiches '
          + 'restent vides tant que le classeur n\'est pas branché.');
  });

  SESSION = {
    jeton: SOURCE.jeton,
    rafraichissement: r.session && r.session.refresh_token,
    expire: r.session && r.session.expires_at,
    role: role, id: r.id, nom: r.nom, fonction: r.fonction || '',
    joueurs: DB.joueurs, staff: DB.staff, equipes: DB.equipes,
    /* chargerSupabase() le renseigne dès qu'il a interrogé la base ; il peut
       donc être nul ici, le temps du premier chargement. */
    clubId: SOURCE.clubId || null,
    ts: Date.now()
  };
  sessionEcrite(SESSION);

  return {ok: true, role: role, id: r.id, joueurId: role === 'jr' ? r.id : ''};
}

/* Réouverture sans réseau : on remet ce que l'appareil avait reçu la dernière
   fois qu'il a pu parler au serveur. */
function reprendSession(){
  const s = sessionLue();
  if (!s) return null;
  SESSION = s;
  SOURCE.jeton  = s.jeton || null;
  SOURCE.membre = {id: s.id, role: s.role, nom: s.nom, club_id: s.clubId || null};
  SOURCE.clubId = s.clubId || null;
  if (s.joueurs && s.joueurs.length) DB.joueurs = s.joueurs;
  if (s.staff   && s.staff.length)   DB.staff   = s.staff;
  if (s.equipes && s.equipes.length) DB.equipes = s.equipes;
  return s;
}

function fermeSession(){
  SESSION = null;
  SOURCE.jeton = null;
  SOURCE.membre = null;
  sessionEffacee();
}

/* Rafraîchissement silencieux. Un jeton Supabase dure une heure ; hors ligne
   il expire sans qu'on puisse rien y faire, et ce n'est pas grave : les
   écritures attendent dans la file. Au retour du réseau, on reprend la main. */
async function rafraichitSession(){
  if (!enLigne() || !SESSION || !SESSION.rafraichissement) return false;
  if (navigator.onLine === false) return false;
  const marge = 120;                                  // secondes
  if (SESSION.expire && SESSION.expire - marge > Math.floor(maintenant().getTime() / 1000)) return true;
  try {
    const r = await fetch(SOURCE.url + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: {'apikey': SOURCE.cle, 'Content-Type': 'application/json'},
      body: JSON.stringify({refresh_token: SESSION.rafraichissement})
    });
    if (!r.ok) return false;
    const d = await r.json();
    if (!d || !d.access_token) return false;
    SESSION.jeton = d.access_token;
    SOURCE.jeton  = d.access_token;
    SESSION.rafraichissement = d.refresh_token || SESSION.rafraichissement;
    SESSION.expire = d.expires_at || SESSION.expire;
    sessionEcrite(SESSION);
    return true;
  } catch (e){ return false; }
}

/* ─────────────────────────────────────────── le championnat

   La FORME d'abord, le contenu ensuite — et cet ordre n'est pas un détail de
   style.

   `carteProchainMatch(p)` lit `p.adversaire`, `p.date`, `p.heure`, `p.lieu`
   sans garde. L'accueil fait `C.classement.find(…)` et `C.resultats.map(…)`.
   Si la base ne connaît pas encore le championnat — et c'est le cas tant
   qu'Oumar n'a rien saisi — remplacer l'objet par ce qu'elle rend, c'est-à-dire
   rien, ferait tomber l'écran d'accueil de tout le monde.

   On part donc du gabarit vide que la construction laisse dans la page (clés
   conservées, valeurs blanches) et on ne pose par-dessus que ce qui existe
   vraiment. Une case vide s'affiche vide ; elle ne casse pas la page.

   `prochain` se fusionne clé par clé pour la même raison : une ligne en base
   qui ne porterait que l'adversaire ne doit pas faire disparaître la date. */
function fusionneChampionnat(gabarit, ligne){
  const base = gabarit || {};
  if (!ligne) return base;

  const sortie = Object.assign({}, base);
  ['nom', 'instance', 'format'].forEach(c => {
    if (ligne[c]) sortie[c] = ligne[c];
  });
  ['journee', 'journees'].forEach(c => {
    if (ligne[c] != null) sortie[c] = ligne[c];
  });
  ['classement', 'resultats'].forEach(c => {
    if (Array.isArray(ligne[c])) sortie[c] = ligne[c];
  });
  if (ligne.prochain && typeof ligne.prochain === 'object' && !Array.isArray(ligne.prochain)){
    sortie.prochain = Object.assign({}, base.prochain || {}, ligne.prochain);
  }
  /* 23/10/2026 — les prochains matchs du calendrier (jusqu'à 12). Le
     « prochain » envoyé par le classeur est calculé le jour de l'envoi : si
     personne ne renvoie le classeur après un match, il désigne un match déjà
     joué. On le recalcule donc ici, chaque jour : le plus proche à partir
     d'aujourd'hui. Sans liste (ancien envoi), rien ne change. */
  if (Array.isArray(ligne.a_venir)){
    sortie.aVenir = ligne.a_venir.slice();
    const futurs = matchsAVenirDe(sortie.aVenir);
    if (futurs.length) sortie.prochain = Object.assign({}, base.prochain || {}, futurs[0]);
  }
  return sortie;
}

/* Les matchs d'une liste du calendrier qui ne sont pas encore passés, du plus
   proche au plus lointain. Les dates arrivent en jj/mm/aaaa. */
function matchsAVenirDe(liste){
  const auj = AUJ();
  return (liste || [])
    .filter(m => m && m.adversaire && /^\d{2}\/\d{2}\/\d{4}$/.test(m.date || '') && jourIso(m.date) >= auj)
    .sort((a, b) => jourIso(a.date) < jourIso(b.date) ? -1 : 1);
}

/* ─────────────────────────────────────────── chargement du club
   Reconstitue exactement la forme du jeu de démonstration : les écrans
   ne font aucune différence entre les deux. */
async function chargerSupabase(){
  const club = (await api('clubs?select=*&sigle=eq.' + encodeURIComponent(SOURCE.club)))[0];
  if (!club) throw new Error('Club « ' + SOURCE.club + ' » introuvable.');

  /* On retient son identifiant : c'est lui que porteront toutes les écritures,
     et il doit survivre à la fermeture de l'application pour que la file
     d'attente puisse repartir hors ligne. */
  SOURCE.clubId = club.id;
  if (SOURCE.membre) SOURCE.membre.club_id = club.id;
  if (SESSION){ SESSION.clubId = club.id; sessionEcrite(SESSION); }

  const [equipes, joueurs, staff, evals, pdis, stats, tirs, seances, presences,
         obs, dirs, progs, objs, mots] = await Promise.all([
    api('equipes?select=code,nom&club_id=eq.' + club.id),
    api('joueurs?select=*&actif=is.true&club_id=eq.' + club.id + '&order=numero'),
    api('staff?select=*&club_id=eq.' + club.id),
    api('evaluations?select=*&club_id=eq.' + club.id + '&order=cycle'),
    api('pdi?select=*&club_id=eq.' + club.id),
    api('v_stats_joueurs?select=*&club_id=eq.' + club.id),
    api('tirs?select=joueur_id,x,y,points,reussi&club_id=eq.' + club.id),
    api('seances?select=*&club_id=eq.' + club.id + '&order=date_seance.desc'),
    /* L'appel. « presences » n'a pas de club_id — une présence tient son club
       de sa séance — donc on ne filtre pas dessus : les politiques de lecture
       font la jointure et ne rendent que les séances du club. */
    api('presences?select=seance_id,joueur_id,present,heure,retard,voie'),
    api('observations?select=*&club_id=eq.' + club.id + '&order=date_obs.desc'),
    api('directives?select=*&club_id=eq.' + club.id + '&order=date_dir.desc'),
    api('programmes?select=*&club_id=eq.' + club.id),
    api('objectifs_staff?select=*&club_id=eq.' + club.id),
    api('mots_coach?select=*&club_id=eq.' + club.id)
  ]);

  // Chargés à part : ils ne servent qu'à certains rôles et n'ont pas à faire
  // échouer l'ouverture de la plateforme si la table est vide ou refusée.
  const sansEchec = p => p.catch(() => []);
  const [clips, prepas, scouts, exos, systemes, variantes, sessionsTir,
         championnatBase, departs] = await Promise.all([
    sansEchec(api('clips?select=*&club_id=eq.' + club.id + '&order=cree_le.desc')),
    sansEchec(api('prepa_match?select=*&club_id=eq.' + club.id + '&order=date_match.desc')),
    sansEchec(api('scouting?select=*&club_id=eq.' + club.id)),
    /* La bibliothèque d'exercices et le playbook. Ils étaient lus par les
       écrans (12, 10 et 9 endroits) et cette fonction ne les rendait pas :
       au premier chargement réussi, `DB.exercices` devenait `undefined` et
       les deux rubriques tombaient. Ce sont aussi deux des trois choses que
       Fathy veut retrouver — il faut donc qu'elles arrivent d'ici. */
    sansEchec(api('exercices?select=*&club_id=eq.' + club.id)),
    sansEchec(api('systemes?select=*&club_id=eq.' + club.id)),
    sansEchec(api('exercices_variantes?select=*&club_id=eq.' + club.id)),
    /* LE CHALLENGE DE TIR. Cette ligne manquait, et c'est le défaut le plus
       coûteux trouvé dans ce fichier : `sessions_tir` était ÉCRITE par l'écran
       de saisie et relue par personne. Un joueur comptait ses 300 tirs, voyait
       « session enregistrée », rechargeait — et retrouvait zéro session. La
       ligne partait bien vers la base ; c'est le chemin du retour qui n'existait
       pas. Même famille que le défaut des droits de table : l'écriture visible,
       la lecture absente, et aucun message d'erreur pour le dire.

       Trié par date croissante : les écrans qui affichent la progression lisent
       la liste dans cet ordre, et bilanTir retrie de son côté quand il a besoin
       du plus récent d'abord. */
    sansEchec(api('sessions_tir?select=joueur_id,date_session,parcours,series,lf,saisi_par'
                  + '&club_id=eq.' + club.id + '&order=date_session')),
    /* LE CHAMPIONNAT. Même histoire que `sessions_tir` : la table existe en
       base depuis le début, avec exactement la forme dont l'accueil a besoin
       — et personne ne la demandait. D'où les cases vides du haut de l'écran,
       « prochain match » et « classement », que Fathy a signalées le 06/10.

       Elle n'est PAS dans la liste blanche de construction, et c'est voulu :
       un classement de démonstration figé dans le fichier publié vaudrait
       moins que rien. Il doit venir d'ici, ou rester vide. */
    sansEchec(api('championnat?select=*&club_id=eq.' + club.id + '&limit=1')),
    /* Les départs anticipés (22/10/2026). La base ne les rend qu'au DT, aux
       coachs, au kiné et à l'assistant : pour les autres rôles la liste revient
       vide, et c'est voulu. */
    sansEchec(api('departs?select=seance_id,joueur_id,heure,motif,autorise_par'))
  ]);

  /* LE CHEMIN DU RETOUR, ACHEVÉ (12/10/2026).

     Neuf tables étaient écrites par les écrans et relues par personne : leur
     clé dans DB reprenait la valeur de la page, que la construction vide. Le
     fil du staff, le secteur médical, les quiz, les oppositions, le rapport au
     président, les partenaires… tout repartait à zéro au rechargement. Un
     joueur déclaré indisponible par le kiné disparaissait du suivi.

     C'est la troisième fois que ce défaut se présente (sessions_tir le 05/10,
     championnat le 06/10). La règle qui en sort, et que le contrôle automatique
     tient désormais : TOUTE table passée à enregistrer() a sa ligne ici. */
  const [msgs, meds, quizBase, quizReps, oppos, prefs, rapports, sponsorsBase] =
    await Promise.all([
      // Les 300 derniers suffisent au fil ; ils sont remis dans l'ordre du temps plus bas.
      sansEchec(api('messages?select=*&club_id=eq.' + club.id + '&order=envoye_le.desc&limit=300')),
      sansEchec(api('medical?select=*&club_id=eq.' + club.id + '&order=date_signalement.desc')),
      sansEchec(api('quiz?select=*&club_id=eq.' + club.id + '&order=date_quiz.desc')),
      // Pas de club_id dans cette table : la politique de lecture fait le tri.
      sansEchec(api('quiz_reponses?select=quiz_id,joueur_id,choix')),
      sansEchec(api('oppositions?select=*&club_id=eq.' + club.id + '&order=date_oppo.desc')),
      sansEchec(api('preferences_joueur?select=joueur_id,reponses&club_id=eq.' + club.id)),
      sansEchec(api('rapports?select=*&club_id=eq.' + club.id + '&order=maj.desc')),
      sansEchec(api('sponsors?select=*&club_id=eq.' + club.id))
    ]);

  /* LES MATCHS OFFICIELS (19/10/2026). Écrits par l'onglet « Match » à partir
     de la photo de la feuille, relus ici : la liste des feuilles déjà
     enregistrées, et le détail joueur par joueur de chacune. Les moyennes de
     la fiche joueur, elles, continuent d'arriver par v_stats_joueurs. */
  const [rencs, statsM, planningBase, semainesSaison] = await Promise.all([
    sansEchec(api('rencontres?select=*&club_id=eq.' + club.id + '&order=date_match.desc')),
    sansEchec(api('stats_match?select=*&club_id=eq.' + club.id)),
    /* LE PLANNING (19/10/2026) : une ligne par équipe et par semaine, écrite
       par le DT seul. La règle d'accès ne rend à un joueur que son équipe. */
    sansEchec(api('planning_semaines?select=equipe_code,lundi,creneaux&club_id=eq.' + club.id + '&order=lundi')),
    /* LE CALENDRIER DE LA SAISON (23/10/2026) : une ligne par semaine, avec
       son cycle (« Cycle 1 (sept-oct) »). Il donne l'ordre des évaluations et
       la période en cours ; sans lui, la plateforme affichait les mois du jeu
       de démonstration. */
    sansEchec(api('saison_semaines?select=date_debut,cycle&club_id=eq.' + club.id + '&order=date_debut'))
  ]);

  const parJoueur = (liste, cle) => {
    const m = {}; (liste || []).forEach(l => { (m[l[cle]] = m[l[cle]] || []).push(l); });
    return m;
  };
  const evalsJ = parJoueur(evals, 'joueur_id'), pdiJ = parJoueur(pdis, 'joueur_id');
  const tirsJ  = parJoueur(tirs, 'joueur_id'),  dirsJ = parJoueur(dirs, 'joueur_id');
  const progJ  = parJoueur(progs, 'joueur_id'), motsJ = parJoueur(mots, 'joueur_id');
  const statsJ = {}; (stats || []).forEach(s => { statsJ[s.id_joueur] = s; });
  const tirJ   = parJoueur(sessionsTir, 'joueur_id');
  const quizJ  = {};
  (quizReps || []).forEach(r => {
    (quizJ[r.joueur_id] = quizJ[r.joueur_id] || {})[r.quiz_id] = Array.isArray(r.choix) ? r.choix : [];
  });
  const prefJ  = {}; (prefs || []).forEach(p => { prefJ[p.joueur_id] = p.reponses || {}; });

  const domaines = DB.domaines;   // le référentiel des 8 domaines reste dans la page

  /* `DB.cycles` n'existe nulle part : ni dans le jeu de données, ni dans le
     schéma. La ligne d'avant faisait `cycles.map(...)` sur `undefined`, et
     cette fonction serait donc tombée dès son premier appel réussi —
     autrement dit le jour même où le schéma serait posé.

     On ne fabrique PAS une liste de cycles au jugé : leurs noms viennent du
     classeur, et s'ils ne correspondent pas, le tri range les évaluations
     dans le désordre sans rien signaler. Tant que ce référentiel n'est pas
     fourni, la liste reste vide : `indexOf` rend -1 pour tout le monde, le
     tri est neutre, et les évaluations gardent l'ordre de la base. */
  /* Le référentiel existe désormais : la table saison_semaines, tenue par le
     DT (23/10/2026). Un cycle va du lundi de sa première semaine au dimanche
     de sa dernière. Sans calendrier, la liste reste vide comme avant. */
  const cycles = [];
  (semainesSaison || []).forEach(w => {
    if (!w.cycle || !w.date_debut) return;
    const fin = new Date(Date.parse(w.date_debut + 'T12:00:00Z') + 6 * 86400000).toISOString().slice(0, 10);
    const c = cycles.find(x => x.nom === w.cycle);
    if (c){ if (w.date_debut < c.debut) c.debut = w.date_debut; if (fin > c.fin) c.fin = fin; }
    else cycles.push({nom: w.cycle, debut: w.date_debut, fin});
  });
  cycles.sort((a, b) => a.debut < b.debut ? -1 : 1);
  const cyclesOrdre = cycles.map(c => c.nom);

  const mapJoueur = j => {
    const ev = (evalsJ[j.id] || []).slice()
      .sort((a, b) => cyclesOrdre.indexOf(a.cycle) - cyclesOrdre.indexOf(b.cycle));
    const notes = {}, moyennes = [];
    domaines.forEach(d => { notes[d] = []; });
    ev.forEach(e => {
      domaines.forEach(d => notes[d].push(Number((e.notes || {})[d]) || 0));
      const vals = domaines.map(d => Number((e.notes || {})[d]) || 0).filter(Boolean);
      moyennes.push(vals.length ? +(vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1) : 0);
    });
    if (!moyennes.length) { domaines.forEach(d => notes[d] = [0]); moyennes.push(0); }
    /* Le cycle de chaque évaluation, dans l'ordre : c'est le libellé des
       radars, courbes et fiches (moisNom / moisCourt, p3a). */
    const cyclesJ = ev.map(e => e.cycle || '');
    const dern = moyennes.length - 1;
    const tri = domaines.slice().sort((a, b) => notes[a][dern] - notes[b][dern]);
    const st = statsJ[j.id] || {};
    const p = (progJ[j.id] || [])[0];
    return {
      id: j.id, nom: j.nom, equipe: j.equipe_code, poste: j.poste,
      numero: j.numero || 0,
      /* L'âge de l'année en cours. Il était calculé sur 2027, en dur : un an de
         trop pour toute la saison 2026 (corrigé le 23/10/2026). */
      age: j.annee_naissance ? (Number(AUJ().slice(0, 4)) - j.annee_naissance) : null,
      cycles: cyclesJ,
      taille: j.taille || 0,
      notes: notes, moyennes: moyennes,
      tirs: (tirsJ[j.id] || []).map(t => [Number(t.x), Number(t.y), t.points, t.reussi ? 1 : 0, dern + 1]),
      /* `tir` est TOUJOURS un objet avec un tableau, même vide, et ce n'est pas
         de la précaution décorative : l'écran de saisie fait
         `j.tir.sessions.push(...)` sans garde. Sans cette clé, enregistrer une
         session levait une TypeError en mode serveur — le joueur appuyait sur
         « Enregistrer », rien ne se passait, et la console était vide puisque
         personne ne la regarde depuis un téléphone au gymnase.

         Le parcours est repris tel quel, avec 'ext' par défaut : les sessions
         écrites avant la migration n'en portent pas, et les classer d'office en
         extérieur est exact — c'était le seul parcours que la plateforme savait
         faire saisir. */
      tir: {sessions: (tirJ[j.id] || []).map(s => ({
        date: s.date_session,
        parcours: s.parcours || 'ext',
        series: Array.isArray(s.series) ? s.series : [],
        lf: Array.isArray(s.lf) ? s.lf : [],
        saisiPar: s.saisi_par || ''
      }))},
      stats: {
        matchs: st.matchs || 0, min: st.min_match || 0,
        pts: Math.round((st.pts_match || 0) * (st.matchs || 0)),
        reb: Math.round((st.reb_match || 0) * (st.matchs || 0)),
        pd:  Math.round((st.pd_match  || 0) * (st.matchs || 0)),
        int: st.interceptions || 0, bp: st.balles_perdues || 0, fte: st.fautes || 0,
        /* Les pourcentages arrivent tout faits. Sans tir tenté connu (feuille
           de match seule), la vue rend null : a2 à 0 fait afficher « — »
           sur la fiche plutôt qu'un 0 % qui passerait pour une mesure. */
        a2: st.pct_2pts == null ? 0 : 100, m2: st.pct_2pts || 0,
        a3: st.pct_3pts == null ? 0 : 100, m3: st.pct_3pts || 0,
        lfa: st.pct_lf == null ? 0 : 100,  lfm: st.pct_lf || 0
      },
      presence: st.presence_entr || 0,
      forts: tri.slice(-2).reverse(), axes: tri.slice(0, 2),
      directives: (dirsJ[j.id] || []).map(d => ({
        de: d.auteur_role, role: (ROLES[d.auteur_role] || {}).lib || d.auteur_role,
        date: d.date_dir, texte: d.texte, lu: d.lue
      })),
      programme: p ? {
        intitule: p.intitule, seances: p.seances_sem, consigne: p.consigne,
        exercices: p.exercices || []
      } : {intitule: '—', seances: 0, consigne: '', exercices: []},
      motCoach: ((motsJ[j.id] || [])[0] || {}).texte || '',
      // L'onglet 3_PDI du classeur porte tout le détail : la plateforme
      // l'affiche et l'imprime, elle ne l'écrit jamais.
      objectifs: (pdiJ[j.id] || []).map(o => ({
        texte: o.objectif, avancement: o.avancement || 0,
        domaine: o.domaine || '', cible: o.cible || '',
        mesure: o.mesure || '', echeance: o.echeance || '', statut: o.statut || ''
      })),
      // Ses réponses aux quiz et à son questionnaire — écrites par lui, relues ici.
      quizFaits: quizJ[j.id] || {},
      preferences: prefJ[j.id] || {}
    };
  };

  /* « 2026-10-12 » ou « 2026-10-12T09:41:00+00:00 » → « 12/10/2026 », la forme
     que tous les écrans affichent et comparent. */
  /* Depuis le 23/10/2026, à l'heure du club (Abidjan) : une date seule se lit
     telle quelle, un horodatage passe par le fuseau du club — voir L'HEURE DU
     CLUB (p3a). Avant, `fr` tronquait l'horodatage UTC et `heure` lisait
     l'heure locale de l'appareil : 2 h d'écart vu de France. */
  const fr = v => dateClubFr(v);
  const heure = v => {
    if (!v) return '—';
    const d = new Date(v);
    return isNaN(d) ? '—' : heureClub(d);
  };
  const dateLocale = v => dateClubFr(v);

  /* Le rapport : le plus récent porte le travail en cours ; ceux qui sont
     envoyés forment l'historique. Le gabarit de la page fournit ce que la base
     ne stocke pas (destinataire, auteur) — on ne les invente pas ici. */
  const rapportCourant = (() => {
    const base = DB.rapport || {};
    const envoyes = (rapports || []).filter(r => r.statut === 'envoyé');
    const historique = envoyes.map(r => ({periode: r.periode, envoyeLe: fr(r.envoye_le)}));
    const r = (rapports || [])[0];
    if (!r) return Object.assign({}, base, {historique});
    return Object.assign({}, base, {
      periode: r.periode || '', synthese: r.synthese || '', points: r.points || [],
      demandes: r.demandes || '', statut: r.statut || 'brouillon', envoyeLe: fr(r.envoye_le),
      sections: Object.assign({}, base.sections || {}, r.sections || {}),
      staffExclus: r.staff_exclus || [],
      commentaires: Object.assign({}, base.commentaires || {}, r.commentaires || {}),
      numero: envoyes.length + (r.statut === 'envoyé' ? 0 : 1),
      historique: historique.filter(h => h.periode !== r.periode || r.statut === 'envoyé')
    });
  })();

  const objsStaff = {};
  (objs || []).forEach(o => {
    const m = (staff || []).find(s => s.id === o.staff_id);
    const cle = m ? m.role : o.staff_id;
    (objsStaff[cle] = objsStaff[cle] || []).push({texte: o.texte, avancement: o.avancement});
  });

  return {
    saison: club.saison,
    club: {nom: club.nom, sigle: club.sigle, ville: club.ville},
    domaines: domaines, cycles: cycles,
    cycleCourant: (cycles.find(c => c.debut <= AUJ() && AUJ() <= c.fin) || {}).nom || '',
    equipes: (equipes || []).map(e => ({id: e.code, nom: e.nom})),
    staff: (staff || []).map(m => ({
      id: m.role, staffId: m.id, nom: m.nom, role: m.fonction,
      equipes: m.equipe_code ? [m.equipe_code] : (equipes || []).map(e => e.code),
      code: ''
    })),
    joueurs: (joueurs || []).map(mapJoueur),
    /* L'appel d'une séance est RANGÉ dans la séance, et le nombre de présents
       n'est plus recopié nulle part : il se compte (voir presentsDe()).

       Cette ligne lisait « s.presents || 0 ». La table « seances » n'a jamais
       eu cette colonne : toute séance revenait donc à 0 présents, et c'est ce
       qui s'affichait au DT. Une séance sans aucune ligne de présence reste
       SANS « appel » — pas avec une liste vide — pour que les écrans puissent
       dire « appel non tenu » au lieu de « 0 présent », qui est un mensonge
       différent. */
    seances: (seances || []).map(s => {
      const lignes = (presences || []).filter(p => p.seance_id === s.id);
      const d = {
        id: s.id, libelle: s.libelle, type: s.type, date: s.date_seance,
        equipe: s.equipe_code, video: s.video_url, duree: s.duree || '—',
        intensite: s.intensite, saisiPar: s.saisi_par || '',
        /* 22/10/2026 : les heures de la séance. Une séance ouverte à l'appel
           (elle a un début) et pas encore close (pas de fin), datée
           d'aujourd'hui, est rouverte : avant, recharger la page pendant
           l'entraînement faisait perdre la séance en cours. */
        heure: s.heure_debut || '', limite: s.heure_limite || '', fin: s.heure_fin || '',
        ouverte: !!(s.heure_debut && !s.heure_fin && s.date_seance === AUJ())
      };
      if (lignes.length) d.appel = lignes.map(p => {
        const dp = (departs || []).find(x => x.seance_id === s.id && x.joueur_id === p.joueur_id);
        const auteur = dp ? (staff || []).find(x => x.id === dp.autorise_par) : null;
        return {
          joueur: p.joueur_id, present: p.present !== false,
          heure: p.heure || null, retard: !!p.retard, voie: p.voie || 'manuel',
          depart: dp ? {heure: dp.heure, motif: dp.motif || '', par: dp.autorise_par || '',
                        parNom: auteur ? auteur.nom : ''} : null
        };
      });
      return d;
    }),
    observations: (obs || []).map(o => ({
      date: o.date_obs, equipe: o.equipe_code, auteur: 'an',
      sujet: o.sujet, texte: o.texte, vue: o.vue
    })),
    objectifsStaff: objsStaff,
    rapport: rapportCourant,

    clips: (clips || []).map(c => ({

/* ─────────────────────────────────────────── démarrage */
function bandeau(txt){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:500;background:#E8A33D;' +
    'color:#051630;font:500 12.5px/1.4 DM Sans,sans-serif;padding:8px 14px;text-align:center';
  d.textContent = txt;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 7000);
}

/* ─────────────────────────────────────────── les données riches, après coup

   Évaluations, PDI, statistiques, séances : tout cela vit dans le schéma de la
   plateforme, qui est un autre schéma que celui de l'identité. Il demande un
   jeton — le charger avant la connexion ne pouvait que se faire refuser.

   Tant qu'il n'est pas posé sur la base, cet appel échoue, et c'est prévu :
   on garde l'effectif venu de l'identité, on le dit, et on n'invente pas de
   chiffres. Ce qui ne doit SURTOUT pas arriver, c'est ce que faisait la
   version précédente — rebasculer toute la page en démonstration, ce qui
   remettait les codes fictifs en service et empêchait la vraie connexion de
   s'exécuter une seule fois. */
async function enrichitDepuisPlateforme(){
  if (!enLigne()) return false;
  const effectif = DB.joueurs, encadrement = DB.staff, equipes = DB.equipes;
  try {
    const complet = await chargerSupabase();
    DB = complet;
    /* DB vient d'être remplacé : l'index des spots pointe encore sur l'ancien
       objet. Il se refait ici, et pas ailleurs, parce que c'est le seul endroit
       où la source change. */
    indexeSpots();
    /* Le schéma répond mais ne connaît encore personne : on ne remplace pas un
       effectif réel par une liste vide. */
    if (!DB.joueurs || !DB.joueurs.length){
      DB.joueurs = effectif; DB.staff = encadrement; DB.equipes = equipes;
      SOURCE.donnees = 'identite';
      /* Même dans ce repli, les raccourcis de session doivent pointer sur les
         objets qu'on vient de remettre en place. */
      if (typeof relieSession === 'function') relieSession();
      return false;
    }
    SOURCE.donnees = 'complete';

    /* CE QUI N'EST PAS DANS LE SCHÉMA DE LA PLATEFORME DOIT SURVIVRE.

       `DB = complet` vient de remplacer l'effectif par celui construit sur la
       table `joueurs`. Or deux champs ne viennent pas de là : ils viennent de
       l'identité, et `joueurs` ne les porte pas.

         secret   — la graine du QR. Perdue, l'écran « Mon badge » du joueur
                    annonce « badge pas encore activé » à quelqu'un dont la
                    base a pourtant la graine. Mesuré le 06/10/2026.
         parcours — ext / int / complet. Perdu, parcoursDe() se rabat sur
                    'ext' pour tout le monde, en silence : le joueur voit un
                    challenge qui n'est pas le sien, et la saisie d'Oumar
                    propose le mauvais parcours par défaut.

       Les deux disparaissaient au moment précis où la plateforme répond, donc
       jamais pendant une vérification hors ligne. C'est la même forme que les
       quatre défauts précédents : l'aller fonctionne, le retour manque, et
       rien ne le dit. */
    const identite = {};
    (effectif || []).forEach(j => { identite[j.id] = j; });
    (DB.joueurs || []).forEach(j => {
      const o = identite[j.id];
      if (!o) return;
      if (!j.secret   && o.secret)   j.secret   = o.secret;
      if (!j.parcours && o.parcours) j.parcours = o.parcours;
    });

    /* LE POINT IMPORTANT. E.moi, E.joueur et E.equipes pointaient sur l'ancien
       DB ; sans ce rattachement, l'écran du joueur lit un joueur sans séances
       et tout le staff se retrouve avec zéro équipe. Voir le commentaire de
       relieSession() dans le noyau. */
    if (typeof relieSession === 'function') relieSession();
    return true;
  } catch (e){
    SOURCE.donnees = 'identite';
    return false;
  }
}

/* ─────────────────────────────────────────── la copie locale de la page

   Sans service worker, ouvrir l'adresse sans réseau donne une page blanche —
   et toute la file d'attente durable qui se trouve derrière ne sert à rien,
   puisque la page qui la porte ne se charge pas.

   Il n'existe que sur un vrai serveur : en file:// l'API est absente ou lève,
   et c'est ainsi que la page s'ouvre pendant les vérifications. Un échec
   d'enregistrement ne doit jamais empêcher l'application de démarrer. */
function poseServiceWorker(){
  try {
    if (!('serviceWorker' in navigator)) return;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    navigator.serviceWorker.register('sw.js').catch(() => {});
  } catch (e){}
}

/* ─────────────────────────────────────────── reprise d'une session connue

   Sans ceci, le service worker ouvre la page sans réseau et la personne tombe
   sur un champ de code qu'elle ne peut pas franchir : la vérification part au
   serveur, qui est injoignable. Le transport sans la serrure.

   L'appareil s'est connecté avant, il a gardé la session et l'effectif : on le
   remet dans son application, puis on rafraîchit le jeton en arrière-plan et
   on recharge l'effectif si le réseau a répondu. C'est le comportement de
   Sniper (s3d_source.js:315), qui est ce qui lui permet de servir au gymnase. */
function repriseAuDemarrage(){
  if (!enLigne()) return false;
  const s = reprendSession();
  if (!s || !s.role || !PLAN[s.role]) return false;

  connexion(s.role, s.id, s.role === 'jr' ? s.id : '');

  rafraichitSession().then(async ok => {
    if (!ok) return;
    const lignes = await serveurEffectif();
    if (lignes && lignes.length){
      poseEffectifASA(lignes);
      if (E.role) { rendVue(); rendNav(); }
    }
    /* LES DONNÉES DU CLUB, AUSSI À LA RÉOUVERTURE (12/10/2026).

       Ce chargement n'était lancé qu'après la saisie d'un code. Rouvrir la
       plateforme avec une session gardée — c'est-à-dire RAFRAÎCHIR LA PAGE,
       ou la rouvrir le lendemain — ne rechargeait que l'effectif : le fil, le
       playbook, les séances, le championnat, tout restait vide jusqu'à la
       prochaine déconnexion. C'est la première cause de « ça disparaît après
       rafraîchissement ». Mesuré par verif_relecture.js. */
    const complet = await enrichitDepuisPlateforme();
    if (complet && E.role) { rendVue(); rendNav(); }
  }).catch(() => {});
  return true;
}

async function demarrer(){
  poseServiceWorker();
  /* L'identité d'abord, les données ensuite : voir enrichitDepuisPlateforme. */
  rendConnexion();
  repriseAuDemarrage();

  // la file reprend là où elle s'était arrêtée, même après extinction du téléphone
  await majFile();
  videFile();
  window.addEventListener('online',  () => { majFile(); videFile(); });
  window.addEventListener('offline', () => { FA_ETAT = 'attente'; majFile(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) videFile(); });
}
document.addEventListener('DOMContentLoaded', demarrer);

/* ══════════════════════════════════════════════════════════════════════════
   MATCH — la feuille de match photographiée                    (19/10/2026)

   Décision de Fathy : les statistiques des matchs officiels ne se recopient
   plus. Un coach assistant ou l'assistant administratif photographie la
   feuille du marqueur depuis la plateforme ; une IA de vision la lit ; la
   personne VÉRIFIE, complète si elle veut, et enregistre.

   Ce que la feuille FIBA porte vraiment, et donc ce que la photo remplit :
   les paniers de chaque joueur (lancers francs, 2 pts, 3 pts — lus dans la
   marque cumulée), ses fautes, le score par quart-temps et le score final.
   Elle ne porte NI rebonds, NI passes, NI interceptions, NI balles perdues,
   NI tirs tentés : ces cases restent à la main, facultatives.
   Le temps de jeu (19/10, demande de Fathy) est sur la ligne principale de
   chaque joueur : lu sur la feuille quand le marqueur l'y a porté, à saisir
   sinon. Vide, il part à null — jamais à 0.
   On ne les invente pas.

   Rien ne s'enregistre sans relecture humaine : une écriture manuscrite se
   lit mal par endroits, et la case douteuse est signalée en orange.

   La lecture passe par la fonction Edge `asa-feuille-match`, qui tient la
   clé de l'IA côté serveur. La page n'en voit jamais la couleur. En
   démonstration, la lecture est simulée — et l'écran le dit.
   ══════════════════════════════════════════════════════════════════════════ */

  if (M.etape === 'lecture') return vueMatchLecture();
  if (M.etape === 'verif' && M.lecture){ setTimeout(totauxMatch, 0); return vueMatchVerif(); }
  return vueMatchAccueil(eqs);
}

/* La photo est réduite AVANT l'envoi : un téléphone produit 4 à 12 Mo,
   l'IA n'en lit pas mieux au-delà de 2 000 px, et le réseau du gymnase ne
   pardonne pas. 2 000 px de grand côté en JPEG 85 % : 300 à 700 Ko. */
function reduitPhoto(fichier){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(fichier);
    const img = new Image();
    img.onload = () => {
      const max = 2000, r = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      ok(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('image illisible')); };
    img.src = url;
  });
}

async function photoChoisie(inp){
  const f = inp.files && inp.files[0];
  inp.value = '';
  if (!f) return;
  M.erreur = '';
  try { M.photo = await reduitPhoto(f); }
  catch (e){ M.erreur = 'Cette image ne s\'ouvre pas. Reprends la photo.'; rendVue(); return; }
  M.etape = 'lecture'; rendVue(); window.scrollTo(0, 0);
  try {
    M.lecture = await lisFeuille(M.photo, M.eq);
    M.etape = 'verif';
  } catch (e){
    M.etape = 'accueil';
    M.erreur = e.message || 'La lecture a échoué.';
  }
  rendVue(); window.scrollTo(0, 0);
  if (M.etape === 'verif') totauxMatch();
}

    <div class="carte-note" style="margin-top:12px">Ne quitte pas l'écran.</div>
  </div>`;
}

async function lisFeuille(photo, eq){
  const joueurs = parEq(eq).map(j => ({numero: j.numero, nom: j.nom}));
  if (!enLigne()) return lectureDemo(eq);
  if (!navigator.onLine) throw new Error('Pas de réseau : la lecture de la feuille en demande. Garde la photo et recommence dès que le réseau revient.');
  /* Le jeton d'une page restée ouverte expire au bout d'une heure ; la file
     d'attente le renouvelle d'elle-même, cet appel direct doit le faire aussi.
     Mesuré le 19/10 : un onglet ouvert depuis la veille recevait « session ». */
  await rafraichitSession();
  let d;
  try {
    const r = await fetchBorne(SOURCE.url + '/functions/v1/asa-feuille-match', {
      method: 'POST', headers: entetesASA(),
      body: JSON.stringify({
        image: photo.split(',')[1], media_type: 'image/jpeg',
        club: (DB.club || {}).nom || '', sigle: (DB.club || {}).sigle || 'ASA',
        equipe: nomEq(eq), joueurs: joueurs
      })
    }, 90000);
    d = await r.json().catch(() => null);
  } catch (e){
    throw new Error('Le serveur de lecture ne répond pas. Réessaie dans un instant.');
  }
  if (!d || !d.ok){
    const raisons = {
      role: 'Ton rôle ne permet pas d\'enregistrer une feuille de match.',
      cle: 'La lecture automatique n\'est pas encore activée sur le serveur (clé de l\'IA absente).',
      illisible: 'La feuille n\'a pas pu être lue. Reprends la photo bien à plat, avec plus de lumière.',
      session: 'Ta session a expiré. Reconnecte-toi puis recommence.'
    };
    throw new Error(raisons[(d || {}).raison] || ('La lecture a échoué' + (d && d.detail ? ' : ' + d.detail : '.')));
  }
  return d.lecture;
}

/* La démonstration n'appelle aucune IA. Elle fabrique une lecture plausible
   sur l'effectif affiché — et le bandeau de vérification le dit en clair. */
function lectureDemo(eq){
  return new Promise(ok => setTimeout(() => {
    const js = parEq(eq).slice(0, 10);
    const base = [[2,6,2,3],[4,3,1,2],[1,4,0,4],[0,5,1,1],[3,2,2,2],[2,3,0,3],[0,2,1,5],[1,1,0,1],[0,1,0,2],[0,0,0,0]];
    const mins = [32, 30, 28, 27, 25, 20, 16, 12, 7, 3];   // 200 min : 5 × 40
    const joueurs = js.map((j, i) => ({numero: j.numero, nom_lu: j.nom.split(' ').slice(-1)[0].toUpperCase(),
      lf: base[i][0], p2: base[i][1], p3: base[i][2], fautes: base[i][3], min: mins[i],
      douteux: i === 3 ? ['p2'] : []}));
    const pour = joueurs.reduce((a, l) => a + l.lf + 2 * l.p2 + 3 * l.p3, 0);
    const pm = (DB.prepaMatch || [])[0] || {};
    ok({demo: true, adversaire: pm.adversaire || 'Cocody Panthères', date: AUJ(),
        score_pour: pour, score_contre: 71,

        joueurs: joueurs,
        remarques: 'Lecture simulée : la version de démonstration n\'appelle pas l\'IA.'});
  }, 1800));
}

const valN = id => { const e = document.getElementById(id); const v = e ? parseInt(e.value, 10) : NaN; return isNaN(v) || v < 0 ? null : v; };

/* Le contrôle qui compte : la somme des points des joueurs doit retomber sur
   le score lu. Un écart dit qu'un panier a été attribué au mauvais numéro, ou
   pas lu du tout. On le montre, on ne bloque pas : c'est l'humain qui tranche. */
function totauxMatch(){
  let total = 0;
  $$('.mt-j').forEach(c => {
    const id = c.dataset.j, joue = $('.mt-joue', c).checked;
    const p = (valN('mt-lf-' + id) || 0) + 2 * (valN('mt-p2-' + id) || 0) + 3 * (valN('mt-p3-' + id) || 0);
    const z = document.getElementById('mt-pts-' + id); if (z) z.textContent = p;
    if (joue) total += p;
  });
  /* Le temps de jeu de l'équipe : 5 joueurs × 40 min = 200 sans
     prolongation, 225 avec une. On l'affiche, on ne bloque pas. */
  let minutes = 0, avecMin = 0;
  $$('.mt-j').forEach(c => {
    if (!$('.mt-joue', c).checked) return;
    const m = valN('mt-min-' + c.dataset.j);
    if (m != null){ minutes += m; avecMin++; }
  });
  const score = valN('mt-pour') || 0, ctl = $('#mt-controle');
  if (!ctl) return;
  const minOk = [200, 225, 250].includes(minutes);
  const lignesMin = !avecMin ? '' : `<br><span style="color:${minOk ? 'var(--physique)' : 'var(--alerte)'}">
    ${minOk ? '✓' : '⚠'} Temps de jeu : ${minutes} min sur ${avecMin} joueur${avecMin > 1 ? 's' : ''}${minOk ? '.'
    : ' — 200 attendues pour un match sans prolongation (225 avec une).'}</span>`;
  const ecart = Math.abs(total - score);
  ctl.innerHTML = total === score
    ? `<span style="color:var(--physique)">✓ Les points des joueurs font bien ${score}.</span>`
    : `<span style="color:var(--alerte)">⚠ Les joueurs totalisent ${total} pts pour un score de ${score} :
       ${ecart} pt${ecart > 1 ? 's' : ''} ${total < score ? 'manquent' : 'en trop'}. Vérifie la feuille.</span>`;
  ctl.innerHTML += lignesMin;
}

function abandonneMatch(){
  M = {etape: 'accueil', eq: M.eq, photo: null, lecture: null, erreur: ''};
  rendVue(); window.scrollTo(0, 0);
}

async function enregistreMatch(){
  const date = ($('#mt-date') || {}).value, adv = (($('#mt-adv') || {}).value || '').trim();
  if (!date){ toast('Indique la date du match'); return; }
  if (!adv){ toast('Indique l\'adversaire'); return; }
  const pour = valN('mt-pour'), contre = valN('mt-contre');
  if (pour == null || contre == null){ toast('Le score est incomplet'); return; }

  const lignes = $$('.mt-j').filter(c => $('.mt-joue', c).checked).map(c => {
    const id = c.dataset.j, n = k => valN('mt-' + k + '-' + id);
    const lf = n('lf') || 0, p2 = n('p2') || 0, p3 = n('p3') || 0;
    /* Les cases facultatives laissées vides partent à null, pas à 0 : zéro
       rebond est une mesure, « pas relevé » n'en est pas une. Les moyennes et
       les pourcentages du serveur ne comptent que ce qui a été relevé. */
    return {joueur: id, min: n('min'), pts: lf + 2 * p2 + 3 * p3, reb: n('reb'), pd: n('pd'),
            int: n('int'), bp: n('bp'), fte: n('fautes') || 0,
            m2: p2, a2: n('a2'), m3: p3, a3: n('a3'), lfm: lf, lfa: n('lfa')};
  });
  if (!lignes.length){ toast('Coche au moins un joueur'); return; }
  const incoherent = lignes.find(l => (l.a2 != null && l.a2 < l.m2) || (l.a3 != null && l.a3 < l.m3) || (l.lfa != null && l.lfa < l.lfm));
  if (incoherent){ toast('Plus de tirs réussis que tentés : ' + ((parId(incoherent.joueur) || {}).nom || '')); return; }

  const rid = nouvelId(), par = (E.moi && (E.moi.staffId || E.moi.id)) || E.role;
  /* La rencontre d'abord : chaque ligne de stats la désigne, et la file
     d'attente part dans l'ordre. */
  await enregistrer('rencontres', {id: rid, equipe_code: M.eq, date_match: date, adversaire: adv,
                                   score_pour: pour, score_contre: contre, saisi_par: par, cloturee: true});
  for (const l of lignes){
    await enregistrer('stats_match', {id: nouvelId(), rencontre_id: rid, joueur_id: l.joueur,
      minutes: l.min, pts: l.pts, reb: l.reb, pd: l.pd, intc: l.int, bp: l.bp, fte: l.fte,
      a2: l.a2, m2: l.m2, a3: l.a3, m3: l.m3, lfa: l.lfa, lfm: l.lfm}, 'rencontre_id,joueur_id');
  }

  /* Les tirs relevés en direct, rattachés au match : ils alimentent la carte
     de tirs des joueurs. Puis la saisie en direct est effacée de l'appareil. */
  if (litDirect() && DIRECT.eq === M.eq){
    for (const t of DIRECT.tirs){
      if (!lignes.some(l => l.joueur === t.id)) continue;   // joueur décoché : on n'invente rien
      await enregistrer('tirs', {rencontre_id: rid, joueur_id: t.id, x: t.x, y: t.y,
                                 points: t.pts, reussi: !!t.reussi, periode: t.q});
    }
    DIRECT = null; gardeDirect();
  }

  // L'écran se met à jour tout de suite, sans attendre le réseau.
  (DB.rencontres = DB.rencontres || []).unshift({id: rid, date: date, equipe: M.eq, adversaire: adv,
    pour: pour, contre: contre, saisiPar: par, lignes: lignes});
  lignes.forEach(l => cumuleStats(parId(l.joueur), l));

  M = {etape: 'accueil', eq: M.eq, photo: null, lecture: null, erreur: ''};
  toast('Match enregistré — ' + lignes.length + ' joueur' + (lignes.length > 1 ? 's' : ''));
  rendVue(); window.scrollTo(0, 0);
}

/* La fiche joueur garde des TOTAUX (pts, reb…) et un nombre de matchs ; on
   ajoute la feuille du jour pour qu'elle se voie avant le prochain chargement. */
function cumuleStats(j, l){
  if (!j || !j.stats) return;
  const s = j.stats, n = s.matchs || 0;
  s.matchs = n + 1;
  if (l.min != null) s.min = Math.round(((s.min || 0) * n + l.min) / (n + 1) * 10) / 10;
  ['pts', 'reb', 'pd', 'int', 'bp', 'fte'].forEach(k => { if (l[k] != null) s[k] = (s[k] || 0) + l[k]; });
  [['m2', 'a2'], ['m3', 'a3'], ['lfm', 'lfa']].forEach(([m, a]) => {
    if (l[a] != null){ s[m] = (s[m] || 0) + l[m]; s[a] = (s[a] || 0) + l[a]; }
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   LES STATS EN DIRECT — le demi-terrain, un + à la feuille      (22/10/2026)

   Demande de Fathy : pendant le match, sur le banc, Oumar relève NOS joueurs
   seulement, sur un demi-terrain (un seul panier : l'adversaire ne nous
   intéresse pas). Il touche l'endroit du tir, puis le joueur, puis réussi
   ou manqué (comme dans Hoops Trophy, depuis le 23/10), et note rebonds, passes décisives, interceptions, balles perdues.

   La feuille photographiée reste la référence pour ce qui est officiel :
   points, fautes, temps de jeu, score. Le terrain apporte ce qu'elle n'a pas.
   Rien ne part en base pendant le match : la saisie est gardée sur
   l'appareil, et c'est l'écran « Vérifier la feuille » qui la récupère —
   les cases facultatives (rebonds, passes, interceptions, balles perdues, tirs
   tentés) arrivent pré-remplies, Oumar contrôle, et « Enregistrer le match »
   envoie le tout, plus l'emplacement de chaque tir rattaché au match (table
   « tirs », qui alimente la carte de tirs des joueurs).
   ══════════════════════════════════════════════════════════════════════════ */

const CLE_DIRECT = 'asa-stats-direct';
let DIRECT = null;

function litDirect(){
  if (DIRECT) return DIRECT;
  try {
    const d = JSON.parse(localStorage.getItem(CLE_DIRECT) || 'null');
    if (d && d.eq && Array.isArray(d.tirs)) DIRECT = d;
  } catch (e) {}
  return DIRECT;
}
function gardeDirect(){
  try {
    if (DIRECT) localStorage.setItem(CLE_DIRECT, JSON.stringify(DIRECT));
    else localStorage.removeItem(CLE_DIRECT);
  } catch (e) {}
}
const statsDirect = id => (DIRECT.stats[id] ||
  (DIRECT.stats[id] = {reb:0, pd:0, int:0, bp:0, a2:0, m2:0, a3:0, m3:0, lfa:0, lfm:0}));
const nomCourt = j => j ? ('n°' + j.numero + ' ' + (String(j.nom).split(' ').slice(-1)[0] || j.nom)) : '?';

/* Les matchs proposés au démarrage : ceux du classeur Championnat, du plus
   proche au plus lointain (23/10/2026). Sans liste — ancien envoi du
   classeur — on retombe sur son « prochain » s'il n'est pas passé. */
function matchsProposes(){
  const C = DB.championnat || {};
  let l = matchsAVenirDe(C.aVenir || []);
  if (!l.length && C.prochain && C.prochain.adversaire) l = matchsAVenirDe([C.prochain]);
  return l.slice(0, 6);
}
const LIB_COMPET = {championnat: 'Championnat', coupe: 'Coupe', playoff: 'Play-off', amical: 'Amical'};
const libMatch = m => [String(m.date || '').slice(0, 5), m.adversaire,
  (LIB_COMPET[m.competition] || '') + (m.tour ? ' · ' + m.tour : ''),
  (m.domicile === false ? 'Extérieur' : 'Domicile') + (m.heure ? ' ' + m.heure : '')].filter(Boolean).join(' · ');

function demarreDirect(){
  const choix = ($('#dr-match') || {}).value;
  const props = matchsProposes();
  const m = (choix != null && choix !== '' && choix !== 'autre') ? props[Number(choix)] : null;
  const adv = m ? m.adversaire : ((($('#dr-adv') || {}).value) || '').trim();
  if (!adv){ toast('Indique l\'adversaire'); return; }
  const eq = M.eq || E.equipe;
  const douze = douzeCoches();
  if (!douze.length){ toast('Choisis les joueurs du match (12 au plus)'); return; }
  gardeDouzeEq(eq, douze);
  DIRECT = {eq, adversaire: adv, date: AUJ(), periode: 1,
            competition: m ? (m.competition || '') : '', dateMatch: m ? m.date : '',
            douze, tirs: [], stats: {}, histo: []};
  ZONE = CHOISI = null;
  gardeDirect();
  ouvreSous('direct');
}

function abandonneDirect(){
  ouvreFeuille(`<div class="feuille-titre">Effacer les stats en direct ?</div>
    <div class="feuille-sous">${DIRECT.tirs.length} tirs et ${DIRECT.histo.length} actions seront perdus.</div>
    <div class="act">
      <button class="act-b large non" onclick="DIRECT=null;ZONE=CHOISI=null;gardeDirect();fermeFeuille();fermeSous()">Effacer</button>
      <button class="act-b large neutre" onclick="fermeFeuille()">Garder</button>
    </div>`);
}

/* La carte de l'onglet Match. */
function carteDirect(){

    return `<div class="carte">

        ${n} action${n > 1 ? 's' : ''} relevée${n > 1 ? 's' : ''}. À la fin du match, photographie la
        feuille : ces stats s'y ajouteront.</p>

     Championnat. Les suivants restent au choix, et « Autre adversaire »

  const props = matchsProposes();

  return `<div class="carte">
    <div class="carte-titre">Stats en direct</div>
    <p class="carte-note" style="margin-top:5px">Pendant le match, sur le demi-terrain : tirs avec leur
      emplacement, rebonds, passes, interceptions, balles perdues. La feuille photographiée à la fin
      apporte les points, les fautes et le temps de jeu.</p>
    ${props.length ? `<div style="margin-top:10px"><label class="label" for="dr-match">Match</label>
      <select id="dr-match" class="champ" onchange="$('#dr-autre').style.display=this.value==='autre'?'block':'none'">
        ${props.map((m, i) => `<option value="${i}"${i === 0 ? ' selected' : ''}>${esc(libMatch(m))}</option>`).join('')}
        <option value="autre">Autre adversaire…</option>
      </select></div>` : ''}
    <div id="dr-autre" style="margin-top:10px;display:${props.length ? 'none' : 'block'}">
      <label class="label" for="dr-adv">Adversaire</label>
      <input id="dr-adv" class="champ" type="text" maxlength="60" value="${esc((pm && pm.adversaire) || '')}"></div>
    ${choixDouze(M.eq || E.equipe, douzeEq(M.eq || E.equipe))}
    <button class="bouton plein" style="margin-top:10px" onclick="demarreDirect()">Démarrer les stats en direct</button>
  </div>`;
}

/* LES 12 DU MATCH (23/10/2026, demande de Fathy) : comme sur la feuille de
   match, douze joueurs au plus. On les coche au démarrage, on peut les
   changer pendant le match (« Les 12 »), et le dernier choix de l'équipe est
   repris au match suivant — sur cet appareil seulement. Les stats d'un joueur
   retiré en cours de match restent comptées. */
const MAX_DOUZE = 12;
const triNumero = l => l.slice().sort((a, b) => (parseInt(a.numero) || 999) - (parseInt(b.numero) || 999));
function douzeEq(eq){
  try { const l = JSON.parse(localStorage.getItem('asa-douze-' + eq) || '[]'); return Array.isArray(l) ? l : []; }
  catch (e) { return []; }
}
function gardeDouzeEq(eq, l){ try { localStorage.setItem('asa-douze-' + eq, JSON.stringify(l)); } catch (e) {} }
function choixDouze(eq, coches){
  const js = triNumero(parEq(eq));
  const pris = new Set((coches || []).filter(id => js.some(j => j.id === id)).slice(0, MAX_DOUZE));
  return `<div class="dr-douze-tete"><span class="label" style="margin:0">Les 12 du match</span>
      <span class="dr-douze-compte" id="dr-douze-compte">${pris.size}/${MAX_DOUZE}</span></div>
    <div class="dr-douze" id="dr-douze">${js.map(j => `<button type="button" class="dr-puce${pris.has(j.id) ? ' on' : ''}"
      data-id="${esc(j.id)}" onclick="basculeDouze(this)"><b>#${esc(String(j.numero))}</b>${esc((String(j.nom).split(' ').slice(-1)[0]) || j.nom)}</button>`).join('')}</div>`;
}
function basculeDouze(b){
  const n = document.querySelectorAll('#dr-douze .dr-puce.on').length;
  if (!b.classList.contains('on') && n >= MAX_DOUZE){ toast('12 joueurs au plus : retire-en un d\'abord'); return; }
  b.classList.toggle('on');
  const c = $('#dr-douze-compte');
  if (c) c.textContent = document.querySelectorAll('#dr-douze .dr-puce.on').length + '/' + MAX_DOUZE;
}
const douzeCoches = () => [...document.querySelectorAll('#dr-douze .dr-puce.on')].map(b => b.dataset.id);
function changeDouze(){
  ouvreFeuille(`<div class="feuille-titre">Les 12 du match</div>
    ${choixDouze(DIRECT.eq, DIRECT.douze || parEq(DIRECT.eq).map(j => j.id))}
    <button class="bouton plein" style="margin-top:12px" onclick="valideDouze()">Valider</button>
    <button class="bouton fant plein" style="margin-top:6px" onclick="fermeFeuille()">Annuler</button>`);
}
function valideDouze(){
  const l = douzeCoches();
  if (!l.length){ toast('Garde au moins un joueur'); return; }
  DIRECT.douze = l; gardeDouzeEq(DIRECT.eq, l);
  if (CHOISI && !l.includes(CHOISI)) CHOISI = null;
  gardeDirect(); fermeFeuille(); rendVue();
}

/* L'écran du demi-terrain — aligné sur HOOPS TROPHY le 23/10/2026.

   Demande de Fathy : « l'utilisation doit être identique à Hoops Trophy ».
   Le geste est donc repris tel quel :
     — un tir : toucher le terrain (un rond clignote, coloré selon la zone, et
       un encart annonce « TENTER À 3 PTS — sélectionnez le tireur »), puis
       toucher le joueur, puis Réussi ou Manqué. La ligne des lancers francs
       se touche comme le reste : c'est un lancer franc, à 1 point ;
     — une autre action : toucher le joueur (il reste en surbrillance), puis
       l'action dans la feuille qui s'ouvre, ou dans « Actions rapides » ;
     — « Dernières actions » : les 5 dernières, avec leur âge, et Annuler.
   Deux écarts, voulus : la liste des joueurs reste À CÔTÉ du terrain sur
   téléphone (demande de Fathy, Hoops Trophy l'empilait dessous), et il n'y
   a qu'une équipe et un panier. Pas de faute : la feuille fait foi.

   ZONE (tir en attente) et CHOISI (joueur en surbrillance) ne sont pas gardés
   sur l'appareil : un geste à moitié fait ne survit pas à un rechargement. */
let ZONE = null, CHOISI = null;
const LIB_ACTION = {reb: 'Rebond', pd: 'Passe décisive', int: 'Interception', bp: 'Balle perdue',
                    lf1: 'LF réussi', lf0: 'LF manqué'};
const COUL_ZONE = {1: '#00D97E', 2: '#4A90FF', 3: '#FFD60A'};
const LIB_ZONE = {1: 'TENTER UN LANCER FRANC', 2: 'TENTER À 2 PTS', 3: 'TENTER À 3 PTS'};

function depuisDirect(t){
  const ago = Math.round((Date.now() - (t || Date.now())) / 1000);
  return ago < 60 ? ago + ' s' : '~' + Math.round(ago / 60) + ' min';
}

function vueDirect(){
  const d = litDirect();
  if (!d) { E.sous = null; ZONE = CHOISI = null; return vueMatchAccueil(equipesMatch()); }
  const tous = triNumero(parEq(d.eq));
  const js = d.douze ? tous.filter(j => d.douze.includes(j.id)) : tous.slice(0, MAX_DOUZE);
  const marques = d.tirs.map(t => `<circle cx="${t.x}" cy="${t.y}" r="5" fill="${t.reussi ? '#4FA83A' : '#E0564B'}"
      fill-opacity="${t.reussi ? .9 : .55}" stroke="${t.reussi ? '#4FA83A' : '#E0564B'}" stroke-width="1.2"/>`).join('');
  const act = (cle, lib, cls) => `<button class="dr-act ${cls}" onclick="actionRapide('${cle}')">${lib}</button>`;
  const lignes = tous.filter(j => d.stats[j.id]).map(j => {
    const s = d.stats[j.id], pts = 2 * s.m2 + 3 * s.m3 + s.lfm;
    return `<tr><td>${esc(nomCourt(j))}</td><td>${pts}</td><td>${s.m2}/${s.a2}</td><td>${s.m3}/${s.a3}</td>
      <td>${s.lfm}/${s.lfa}</td><td>${s.reb}</td><td>${s.pd}</td><td>${s.int}</td><td>${s.bp}</td></tr>`;
  }).join('');

  return `${retour('Match', 'fermeSous()')}
  <h1 class="vue-titre">ASA — ${esc(d.adversaire)}</h1>
  <p class="vue-sous">Stats en direct · ${esc(nomEq(d.eq))} · période ${d.periode}
    <button class="pt-bouton" onclick="DIRECT.periode=Math.max(1,DIRECT.periode-1);gardeDirect();rendVue()">−</button>
    <button class="pt-bouton" onclick="DIRECT.periode++;gardeDirect();rendVue()">+</button></p>

  <div class="dr-plan"><div class="dr-gauche">
  <p class="dr-consigne">Clique sur le terrain → sélectionne le joueur</p>
  <div class="dr-zone">
    <div class="terrain-enrob dr-terrain" id="terrainDirect">${terrainVertical('svgDirect', marques)}</div>
    <div class="dr-joueurs${ZONE ? ' attend' : ''}" id="dr-joueurs" style="--n:${Math.max(js.length, 1)}">
      <div class="dr-joueurs-tete"><span>${esc(nomEq(d.eq))}</span>
        <button class="dr-douze-btn" onclick="changeDouze()">Les 12</button></div>
      ${js.map(j => {
        const s = d.stats[j.id] || {}, pts = 2 * (s.m2 || 0) + 3 * (s.m3 || 0) + (s.lfm || 0);
        return `<div class="dr-joueur${CHOISI === j.id ? ' choisi' : ''}" data-id="${esc(j.id)}" onclick="joueurDirect('${esc(j.id)}')">
          <div class="dr-nom"><b>#${esc(String(j.numero))}</b>${esc((String(j.nom).split(' ').slice(-1)[0]) || j.nom)}</div>
          <div class="dr-stats">PTS <span>${pts}</span> REB <span>${s.reb || 0}</span> PD <span>${s.pd || 0}</span></div></div>`;
      }).join('')}
    </div>
  </div>
  </div><div class="dr-cote">

  <div class="carte dr-rapides">
    <div class="dr-titre-petit">Actions rapides — sélectionne d'abord un joueur</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${act('reb', 'Rebond', 'reb')}${act('pd', 'Passe décisive', 'pd')}
      ${act('int', 'Interception', 'int')}${act('bp', 'Balle perdue', 'bp')}
    </div>
  </div>

  <div class="carte">
    <div class="dr-undo-tete"><div class="dr-titre-petit" style="margin:0">↩ Dernières actions</div>
      <button class="dr-undo" onclick="annuleDirect()"${d.histo.length ? '' : ' disabled'}>↩ Annuler</button></div>
    <div class="dr-undo-liste">${d.histo.slice(0, 5).map(h => `<div class="dr-undo-ligne">
        <span>P${h.q} · ${esc(h.txt)}</span><span class="dr-undo-age">il y a ${depuisDirect(h.t)}</span></div>`).join('')
      || '<div class="carte-note" style="text-align:center">Aucune action</div>'}</div>
  </div>
  </div></div>

  ${lignes ? `<div class="section-titre">Récapitulatif</div>
  <div class="carte" style="overflow-x:auto"><table class="tab" style="width:100%;font-size:12px">
    <tr><th>Joueur</th><th>Pts</th><th>2 pts</th><th>3 pts</th><th>LF</th><th>Reb</th><th>PD</th><th>Int</th><th>BP</th></tr>
    ${lignes}</table>
    <p class="carte-note" style="margin-top:6px">Points du terrain, pour contrôle : la feuille fait foi.</p></div>` : ''}

  <p class="carte-note" style="margin:14px 0">À la fin du match, reviens dans Match et photographie la
    feuille : ces stats arrivent pré-remplies dans la vérification.</p>
  <button class="bouton fant plein" onclick="abandonneDirect()">Effacer ces stats</button>
  <div class="dr-indice" id="dr-indice"><div class="dr-indice-titre" id="dr-indice-titre"></div>
    <div class="dr-indice-sous" id="dr-indice-sous"></div></div>`;
}

/* LE TERRAIN VERTICAL (23/10/2026, demande de Fathy) : le panier en haut,
   la ligne médiane en bas. Le dessin est celui de terrainSVG, retourné par
   une symétrie sur la diagonale (x ↔ y) : le terrain étant symétrique, il se
   lit comme une rotation, et le corner « gauche » (y petit) reste à gauche.
   Les tirs gardent le repère d'origine — 280 de profondeur, 300 de large —,
   donc detecteZone, la table « tirs » et les cartes de tirs ne changent pas.
   Seul le toucher est converti (x = Y à l'écran, y = X à l'écran). */
function terrainVertical(id, contenu){
  const svg = terrainSVG(id, contenu).replace('viewBox="0 0 280 300"', 'viewBox="0 0 300 280"');
  const i = svg.indexOf('>') + 1, f = svg.lastIndexOf('</svg>');
  return svg.slice(0, i) + '<g transform="matrix(0 1 1 0 0 0)">' + svg.slice(i, f) + '</g>' + svg.slice(f);
}

/* Le toucher sur le terrain : le rond qui clignote, l'encart, et le tir en
   attente de son tireur. */
function brancheDirect(){
  const enrob = $('#terrainDirect');
  if (!enrob || enrob._branche) return;
  enrob._branche = true;
  enrob.addEventListener('click', ev => {
    const svg = $('#svgDirect');
    if (!svg) return;
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const X = (ev.clientX - r.left) * vb.width / r.width, Y = (ev.clientY - r.top) * vb.height / r.height;
    if (X < 0 || X > vb.width || Y < 0 || Y > vb.height) return;
    /* Terrain vertical : on revient au repère d'origine (voir terrainVertical). */
    const p = {x: Y, y: X};
    const z = detecteZone(p);
    const pts = z.pts === 3 ? 3 : z.pts === 1 ? 1 : 2;
    const e = enrob.getBoundingClientRect(), c = COUL_ZONE[pts];
    const rond = document.createElement('div');
    rond.className = 'dr-flash';
    rond.style.cssText = `left:${ev.clientX - e.left}px;top:${ev.clientY - e.top}px;border-color:${c};background:${c}4D`;
    enrob.appendChild(rond);
    setTimeout(() => rond.remove(), 500);
    ZONE = {x: +p.x.toFixed(1), y: +p.y.toFixed(1), pts, lib: z.lib};
    CHOISI = null;
    document.querySelectorAll('.dr-joueur.choisi').forEach(x => x.classList.remove('choisi'));
    const l = $('#dr-joueurs'); if (l) l.classList.add('attend');
    $('#dr-indice-titre').textContent = LIB_ZONE[pts];
    $('#dr-indice-sous').textContent = z.lib + ' — sélectionne le tireur';
    const ind = $('#dr-indice');
    ind.classList.add('on'); clearTimeout(ind._t); ind._t = setTimeout(() => ind.classList.remove('on'), 2500);
  });
}

/* Le joueur touché : s'il y a un tir en attente, c'est le tireur ; sinon il
   devient le joueur choisi et ses actions s'ouvrent. */
function joueurDirect(id){
  const j = parId(id);
  CHOISI = id;
  if (ZONE){
    const tl = ZONE.pts === 1 ? 'Lancer franc' : 'Tir à ' + ZONE.pts + ' pts';
    ouvreFeuille(`<div class="feuille-titre" style="text-align:center">Action pour <span style="color:var(--or)">${esc(nomCourt(j))}</span></div>
      <div class="feuille-sous" style="text-align:center">${tl} — ${esc(ZONE.lib)}</div>
      <div class="act">
        <button class="act-b large oui" onclick="tirDirect(true)">Réussi<br><small>+${ZONE.pts} PT${ZONE.pts > 1 ? 'S' : ''}</small></button>
        <button class="act-b large non" onclick="tirDirect(false)">Manqué</button>
      </div>
      <button class="bouton fant plein" style="margin-top:8px" onclick="fermeFeuille();ZONE=null;CHOISI=null;rendVue()">Annuler</button>`);
    return;
  }
  rendVue();
  ouvreFeuille(`<div class="feuille-titre" style="text-align:center">Action pour <span style="color:var(--or)">${esc(nomCourt(j))}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px">
      <button class="dr-act reb" onclick="actionDirect('reb','${esc(id)}')">Rebond</button>
      <button class="dr-act pd" onclick="actionDirect('pd','${esc(id)}')">Passe</button>
      <button class="dr-act int" onclick="actionDirect('int','${esc(id)}')">Interception</button>
      <button class="dr-act bp" onclick="actionDirect('bp','${esc(id)}')">Balle perdue</button>
    </div>
    <button class="bouton fant plein" style="margin-top:10px" onclick="fermeFeuille();CHOISI=null;rendVue()">Annuler</button>`);
}

/* Le résultat du tir. Un lancer franc compte dans les LF, sans emplacement :
   la carte de tirs ne garde que les tirs du jeu. */
function tirDirect(reussi){
  if (!ZONE || !CHOISI) return;
  const id = CHOISI, {x, y, pts} = ZONE, s = statsDirect(id), j = parId(id);
  const lib = (reussi ? '+' + pts + ' pt' + (pts > 1 ? 's' : '') : 'Manqué ' + pts + ' pt' + (pts > 1 ? 's' : '')) + ' ' + nomCourt(j);
  if (pts === 1){
    s.lfa++; if (reussi) s.lfm++;
    DIRECT.histo.unshift({type: reussi ? 'lf1' : 'lf0', id, q: DIRECT.periode, t: Date.now(), txt: lib});
  } else {
    if (pts === 3){ s.a3++; if (reussi) s.m3++; } else { s.a2++; if (reussi) s.m2++; }
    DIRECT.tirs.push({id, x, y, pts, reussi: !!reussi, q: DIRECT.periode});
    DIRECT.histo.unshift({type: 'tir', id, pts, reussi: !!reussi, q: DIRECT.periode, t: Date.now(), txt: lib});
  }
  ZONE = null; CHOISI = null;
  gardeDirect(); fermeFeuille(); rendVue();
  toast((reussi ? '✓ ' : '✕ ') + lib);
}

/* « Actions rapides » : sur le joueur choisi, qui le reste. */
function actionRapide(cle){
  if (!CHOISI){ toast('Sélectionne un joueur !'); return; }
  actionDirect(cle, CHOISI);
}

function actionDirect(cle, id){
  const s = statsDirect(id), j = parId(id), lib = LIB_ACTION[cle];
  s[cle]++;
  DIRECT.histo.unshift({type: cle, id, q: DIRECT.periode, t: Date.now(), txt: lib + ' → ' + nomCourt(j)});
  ZONE = null; CHOISI = id;
  gardeDirect(); fermeFeuille(); rendVue();
  toast(lib + ' → ' + nomCourt(j));
}

function annuleDirect(){
  const h = DIRECT.histo.shift();
  if (!h) return;
  const s = statsDirect(h.id);
  if (h.type === 'tir'){
    DIRECT.tirs.pop();
    if (h.pts === 3){ s.a3--; if (h.reussi) s.m3--; } else { s.a2--; if (h.reussi) s.m2--; }
  } else if (h.type === 'lf1'){ s.lfa--; s.lfm--; }
  else if (h.type === 'lf0'){ s.lfa--; }
  else s[h.type]--;
  gardeDirect(); rendVue(); toast('Dernière action annulée');
}

/* Le branchement du terrain après chaque rendu. */
const _rendVueDirect = rendVue;
rendVue = function(){
  _rendVueDirect();
  if (E.sous === 'direct' && PEUT_MATCH(E.role)) brancheDirect();
};

/* ══════════════════════════════════════════════════════════════════════════
   PLANNING — l'emploi du temps de la semaine                    (19/10/2026)

   Demande de Fathy : le DT tient l'emploi du temps depuis la plateforme ; les
   joueurs le voient, sans pouvoir y toucher. Le reste du staff le lit aussi.

   La forme : UNE ligne par équipe et par semaine (table planning_semaines,
   clé club + équipe + lundi), qui porte la liste de ses créneaux. Chaque
   modification du DT réécrit la semaine entière. C'est ce qui rend
   l'écriture sûre hors ligne : pas de suppression à faire suivre, pas de
   créneau orphelin — la dernière version de la semaine gagne, entière.

   Pourquoi pas dans un onglet : le DT et les joueurs ont déjà six onglets,
   le plafond lisible sur un téléphone. Le planning s'ouvre depuis l'accueil,
   comme l'appel et les badges.
   ══════════════════════════════════════════════════════════════════════════ */

const PEUT_PLANNING = r => r === 'dt';

const TYPES_CRENEAU = {
  'Entraînement': 'var(--or)',
  'Musculation':  'var(--physique)',
  'Vidéo':        'var(--analyste)',
  'Récupération': 'var(--medical)',
  'Match':        'var(--attaque)',
  'Réunion':      'var(--defense)',
  'Autre':        'var(--gris)'
};
const JOURS_LONGS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const MOIS_COURTS = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];

/* Les dates voyagent en « AAAA-MM-JJ ». On calcule à midi UTC : un calcul à
   minuit heure locale glisse d'un jour selon le fuseau du téléphone. */
const dIso = iso => new Date(iso + 'T12:00:00Z');
const isoD = d => d.toISOString().slice(0, 10);
const plusJours = (iso, n) => isoD(new Date(dIso(iso).getTime() + n * 86400000));
function lundiDe(iso){
  const j = (dIso(iso).getUTCDay() + 6) % 7;      // 0 = lundi
  return plusJours(iso, -j);
}
const jourLong = iso => { const d = dIso(iso), j = (d.getUTCDay() + 6) % 7;
  return `${JOURS_LONGS[j]} ${d.getUTCDate()} ${MOIS_COURTS[d.getUTCMonth()]}`; };
const libSemaine = lundi => { const a = dIso(lundi), b = dIso(plusJours(lundi, 6));
  return `${a.getUTCDate()}${a.getUTCMonth() !== b.getUTCMonth() ? ' ' + MOIS_COURTS[a.getUTCMonth()] : ''}`
       + ` au ${b.getUTCDate()} ${MOIS_COURTS[b.getUTCMonth()]} ${b.getUTCFullYear()}`; };

/* L'état de l'écran : la semaine affichée et l'équipe. */
let PL = {lundi: null, eq: null};

function equipePlanning(){
  if (E.role === 'jr') return (E.joueur || {}).equipe || E.equipe;
  return PL.eq && E.equipes.includes(PL.eq) ? PL.eq : E.equipe;
}
function semaineDe(eq, lundi){
  return (DB.planning || []).find(s => s.equipe === eq && s.lundi === lundi) || null;
}
const creneauxDe = (eq, lundi) => ((semaineDe(eq, lundi) || {}).creneaux || []).slice()
  .sort((a, b) => (a.jour + (a.debut || '')).localeCompare(b.jour + (b.debut || '')));

/* ─────────────────────────────────────────── le bloc de l'accueil */
function blocPlanningAccueil(){
  const eq = E.role === 'jr' ? (E.joueur || {}).equipe : E.equipe;
  const auj = AUJ(), lundi = lundiDe(auj);
  /* Les prochains créneaux : ceux d'aujourd'hui et après, sur cette semaine
     et la suivante — le dimanche soir, c'est lundi qu'on veut voir. */
  const a = creneauxDe(eq, lundi).concat(creneauxDe(eq, plusJours(lundi, 7)))
    .filter(c => c.jour >= auj).slice(0, 3);
  return `<div class="section-titre">Cette semaine</div>
  <div class="carte">
    ${a.length ? a.map(c => ligneCreneau(c, false, true)).join('')
      : `<p class="carte-note">${PEUT_PLANNING(E.role) ? 'Aucun créneau à venir. Le planning se remplit ici.'
                                                      : 'Le planning de la semaine n\'est pas encore publié.'}</p>`}
    <button class="bouton fant plein" style="margin-top:10px" onclick="PL.lundi=null;ouvreSous('planning')">
      ${PEUT_PLANNING(E.role) ? 'Modifier le planning' : 'Voir le planning'}</button>
  </div>`;
}

function ligneCreneau(c, edition, avecJour){
  const coul = TYPES_CRENEAU[c.type] || 'var(--gris)';
  return `<div class="dom-ligne" style="grid-template-columns:52px minmax(0,1fr) auto;align-items:start">
