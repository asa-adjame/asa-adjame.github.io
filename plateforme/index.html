/* ─────────────────────────────────────────── connexion */
/* Les deux comptes joueur de démonstration désignaient un joueur par son RANG
   dans l'effectif fictif — le 3e des Pro, le 5e des Espoirs. Avec un effectif
   réel ce rang n'existe pas forcément : dix joueurs tous en Pro, et le 5e des
   Espoirs est `undefined`. L'écran de connexion entier tombait alors. */
/* Les codes de démonstration vivent dans le JEU de démonstration, pas dans le
   code. C'est ce qui permet au fichier serveur de n'en porter aucun : il est
   construit en vidant les données, et ceux-ci partent avec. Les laisser en
   dur ici les aurait publiés, inertes mais lisibles. */
function comptes(){
  focusEquipes();
  const demo = c => {
    const j = parEq(c.equipe)[c.rang];
    return j ? [{code: c.code, role: 'jr', id: 'j-' + c.equipe, joueur: j.id,
                 nom: j.nom, sous: c.sous}] : [];
  };
  return [
    ...DB.staff.map(m => ({code:m.code, role:m.role, id:m.id, nom:m.nom, sous:m.fonction})),
    ...(DB.comptesDemo || []).reduce((t, c) => t.concat(demo(c)), []),
  ].filter(e => e.code);
}

function rendConnexion(){
  /* En mode serveur, il n'y a pas d'accès de démonstration : les afficher
     mettrait des codes fictifs sous les yeux de l'utilisateur et laisserait
     croire qu'ils ouvrent quelque chose. Le bouton disparaît avec la liste. */
  /* Le bouton ET la liste peuvent être absents : la construction en mode
     serveur les retire du HTML, parce qu'un bouton d'accès de démonstration
     dont la liste a été vidée n'ouvre rien. Le bouton était déjà protégé ;
     la liste ne l'était pas, et « $('#cxListe').innerHTML = '' » sur un
     élément absent arrête le script au démarrage — écran de connexion mort,
     avant même qu'on ait pu taper un code. */
  const bascule = $('#cxBascule');
  const liste   = $('#cxListe');
  if (typeof enLigne === 'function' && enLigne()){
    if (bascule) bascule.hidden = true;
    if (liste){ liste.innerHTML = ''; liste.setAttribute('hidden', ''); }
    return;
  }
  if (bascule) bascule.hidden = false;
  if (!liste) return;
  liste.innerHTML = comptes().map(e => {
    const r = ROLES[e.role] || ROLES.as;
    return `<button class="cx-carte" onclick="connexion('${e.role}','${e.id}','${e.joueur||''}')">
      <span class="cx-pastille" style="background:${r.couleur}">${r.court}</span>
      <span style="min-width:0">
        <span class="cx-nom" style="display:block">${esc(e.nom)}</span>
        <span class="cx-role">${esc(e.sous)}</span>
      </span>
      <span class="cx-code">${esc(e.code)}</span>
    </button>`;
  }).join('');
}

function basculeDemo(){
  const l = $('#cxListe'), b = $('#cxBascule');
  const ouvert = !l.hasAttribute('hidden');
  if (ouvert) { l.setAttribute('hidden', ''); b.textContent = 'Accès de démonstration ▾'; }
  else        { l.removeAttribute('hidden');  b.textContent = 'Masquer les accès ▴'; }
  b.setAttribute('aria-expanded', String(!ouvert));
}

async function tenteCode(ev){
  ev.preventDefault();
  const saisi = ($('#cxCode').value || '').trim().toUpperCase().replace(/\s+/g, '');
  const err = $('#cxErreur');

  /* Le bouton doit DIRE qu'il travaille. Sans ça, une vérification qui prend
     quelques secondes — un serveur qui se réveille, un réseau qui traîne — est
     indiscernable d'un bouton cassé : rien ne bouge, et la personne reclique. */
  const bouton = $('#cxForm button[type=submit]');
  const occupe = oui => {
    if (!bouton) return;
    bouton.disabled = oui;
    bouton.textContent = oui ? 'Vérification…' : 'Entrer';
  };

  const refuse = m => {
    occupe(false);
    err.textContent = m; err.classList.add('on'); $('#cxCode').focus();
  };
  /* On efface le message précédent avant de repartir : sinon l'ancien refus
     reste affiché pendant la nouvelle tentative et se fait prendre pour sa
     réponse. */
  err.classList.remove('on'); err.textContent = '';
  if (!saisi) return refuse('Saisis ton code d\'accès.');

  /* En ligne, le navigateur ne compare rien : il envoie le code et le serveur
     tranche. Les motifs de refus sont distingués, parce que la conduite à
     tenir diffère — ressaisir, attendre le réseau, ou corriger le classeur. */
  if (typeof enLigne === 'function' && enLigne()){
    const MOTIF = {
      code:    'Ce code ne correspond à aucun compte.',
      bloque:  'Trop d\'essais depuis cet appareil. Patiente quelques minutes.',
      reseau:  'Plateforme injoignable. Réessaie dans un instant.',
      equipe:  'La plateforme est réservée à l\'équipe pro pour le moment.',
      role:    'Ton compte existe mais aucun rôle ne lui est attribué. ' +
               'Le directeur technique doit corriger la ligne dans le classeur.',
      serveur: 'Le serveur a rencontré un problème. Ton code n\'est pas en cause — '
             + 'réessaie, et signale-le si ça se répète.'
    };
    occupe(true);
    let r;
    try { r = await identifieParCode(saisi); }
    catch (e){ return refuse(MOTIF.reseau); }
    /* Le repli ne dit PAS « code inconnu » : accuser le code de l'utilisateur
       quand c'est le serveur qui a un problème l'envoie chercher une faute
       qu'il n'a pas commise, et ressaisir ne changera rien. */
    if (!r || !r.ok) return refuse(MOTIF[(r && r.raison)]
      || 'Connexion impossible pour le moment. Réessaie dans un instant.');
    occupe(false);
    err.classList.remove('on'); $('#cxCode').value = '';
    return connexion(r.role, r.id, r.joueurId || '');
  }

  const c = comptes().find(x => x.code.toUpperCase() === saisi);
  if (!c) return refuse('Ce code ne correspond à aucun compte.');
  err.classList.remove('on');
  $('#cxCode').value = '';
  connexion(c.role, c.id, c.joueur || '');
}

/* ── relier la session à l'effectif courant ────────────────────────────────
   `E.moi`, `E.joueur` et `E.equipes` sont des RACCOURCIS vers des objets de
   `DB`. Or en mode serveur, `DB` est remplacé en entier une seconde après la
   connexion, quand les données du club arrivent. Les raccourcis continuent
   alors de pointer sur les objets de l'étape précédente.

   Ce que ça donnait, et qui ne se voit pas : l'écran du joueur lit
   `E.joueur.tir.sessions` — donc l'ancien joueur, celui construit avant le
   chargement, qui n'a aucune séance. Le joueur voyait « aucune séance »
   pendant que ses séances étaient dans `DB`, à côté.

   Et `E.equipes` valait `[]` pour tout le staff, parce que l'effectif renvoyé
   par la fonction de connexion ne porte pas les équipes. En JavaScript un
   tableau vide est vrai, donc le repli `|| ['pro','espoirs']` ne jouait
   jamais : tous les écrans qui filtrent sur `E.equipes` — les relances, les
   séances, les quiz, les systèmes, le classement au tir — se vidaient sans
   message. C'est le même défaut que les droits de table : la donnée est là,
   le chemin pour y arriver n'existe pas. */
function relieSession(){
  if (!E.role) return false;
  focusEquipes();
  if (E.role === 'jr'){
    const j = parId((E.joueur || E.moi || {}).id);
    if (!j) return false;
    E.moi = j; E.joueur = j;
    E.equipes = [j.equipe];
  } else {
    /* QUI SUIS-JE, UNE FOIS LES DONNÉES DU CLUB CHARGÉES (12/10/2026).

       La connexion connaît la personne par son identifiant d'effectif
       (« st01 »). Les données du club rangent le staff sous son RÔLE (« dt »),
       l'identifiant d'effectif étant gardé dans `staffId`. On cherchait
       `membre('st01')` : introuvable, et `membre()` rend alors {} — un objet
       vide, mais « vrai », qui remplaçait E.moi. Résultat, en production,
       pour tout le staff : chaque écriture partait avec auteur_id = null
       (fil, médical, playbook, quiz), ses propres messages ne s'affichaient
       pas comme les siens et comptaient comme non lus.

       On cherche donc la personne exacte par staffId d'abord — deux assistants
       partagent le même rôle —, puis par identifiant, puis par rôle. */
    const id = (E.moi || {}).id || (typeof SESSION !== 'undefined' && SESSION ? SESSION.id : null);
    const staff = DB.staff || [];
    const m = staff.find(s => s.staffId && s.staffId === id)
           || staff.find(s => s.id === id)
           || staff.find(s => s.id === E.role);
    if (m) E.moi = m;
    /* `.length ? … : …` et pas `|| …` : c'est le vide qu'on veut rattraper,
       et un tableau vide ne déclenche pas un `||`. */
    const sien = (E.moi || {}).equipes || [];
    E.equipes = sien.length ? sien.slice()
                            : (DB.equipes || []).map(e => e.id);
  }
  if (!E.equipes.length) E.equipes = (DB.equipes || []).map(e => e.id);
  if (!E.equipes.includes(E.equipe)) E.equipe = E.equipes[0];
  return true;
}

function connexion(role, id, joueurId){
  focusEquipes();
  E.role = role;
  E.moi = role === 'jr' ? parId(joueurId) : membre(id);
  E.joueur = role === 'jr' ? parId(joueurId) : null;
  E.equipes = role === 'jr' ? [E.joueur.equipe]
            : (((E.moi || {}).equipes || []).length ? E.moi.equipes
                                                   : (DB.equipes || []).map(e => e.id));
  E.equipe = E.equipes[0];
  // On repart d'un écran propre : sans ça, ouvrir une session avec un autre rôle
  // atterrit sur le sous-écran du précédent, et rien ne garantit qu'il y ait droit.
  E.fiche = null; E.quiz = null; E.onglet = 0; E.sous = null;
  if (typeof PB !== 'undefined') PB = null;
  if (typeof BIB !== 'undefined') BIB = {cat:'Toutes', q:'', ouvert:null, adapte:null};
  if (typeof SAISIE_TIR !== 'undefined') { SAISIE_TIR = null; SAISIE_REPRISE = false; }
  const r = ROLES[role] || ROLES.as;
  $('#entNom').textContent = E.moi.nom;
  $('#entRole').textContent = role === 'jr'
    ? `${E.joueur.poste} · ${nomEq(E.joueur.equipe)}` : (E.moi.fonction || r.lib);
  $('#entPoint').style.background = r.couleur;
  $('#connexion').style.display = 'none';
  $('#app').classList.add('on');
  rendNav(); rendVue();
  window.scrollTo(0,0);
}
function deconnexion(){
  /* « Changer de rôle » doit vraiment fermer la porte. Sans ça, la session et
     l'effectif restent sur l'appareil et le suivant hérite de ce que le
     précédent avait le droit de voir — sur un téléphone partagé au gymnase,
     c'est exactement le cas qui se produit. */
  if (typeof fermeSession === 'function') fermeSession();
  E.role = null; E.moi = null; E.joueur = null;
  $('#app').classList.remove('on');
  $('#connexion').style.display = 'flex';
  fermeFeuille(); window.scrollTo(0,0);
}
/* ─────────────────────────────────────────── notifications
   Sans pastille, un fil de discussion interne perd toujours face à WhatsApp :
   personne ne pense à l'ouvrir. La pastille dit ce qui attend, et seulement ça. */
const cleLu = () => 'asa.lu.' + (E.role || '?') + '.' + ((E.moi || {}).id || '');
/* LE REPÈRE EST LE DERNIER MESSAGE VU, PAS UN NOMBRE (12/10/2026).

   On retenait « j'ai vu N messages ». Depuis que le fil est relu en base, il
   est plafonné aux 300 derniers : passé ce cap, N ne bouge plus et plus aucun
   message ne s'affichait comme non lu. On retient donc l'identifiant du
   dernier message vu — le même dans la page et en base, puisque l'uuid est
   fabriqué à l'envoi (voir envoieChat).

   Un repère d'avant (un nombre) est encore lu à l'ancienne, une fois : le
   prochain passage dans le fil le remplace. */
function chatLu(){ try { return localStorage.getItem(cleLu()) || ''; } catch(e){ return ''; } }
function marqueChatLu(){
  const c = DB.chat || [];
  try { localStorage.setItem(cleLu(), c.length ? 'id:' + c[c.length - 1].id : ''); } catch(e){}
}
/* Ses propres écritures ne comptent jamais comme non lues : elles sont filtrées
   par auteur, ce qui évite d'avoir à déplacer le repère à chaque envoi. */
function nonLusChat(){
  const moi = (E.moi || {}).id, fil = DB.chat || [], lu = chatLu();
  let apres;
  if (lu.startsWith('id:')){
    const i = fil.findIndex(c => c.id === lu.slice(3));
    // Repère introuvable : il est sorti des 300 derniers — tout ce qu'on a est plus récent.
    apres = i >= 0 ? fil.slice(i + 1) : fil;
  } else {
    apres = fil.slice(+lu || 0);           // ancien repère (un nombre)
  }
  return apres.filter(c => c.auteur !== moi).length;
}

/* PASTILLES DE NAVIGATION RETIRÉES (12/10/2026, demande de Fathy).
   Les bulles « 9+ » sur Accueil et Chat restaient allumées en permanence et
   n'apportaient plus d'information. Le repère de lecture du chat (chatLu,
   marqueChatLu, nonLusChat) est conservé : il ne coûte rien et permettra de
   remettre une pastille plus tard si on en veut une. Ce qui attend reste
   visible dans les écrans eux-mêmes (carte « À relancer » de l'accueil). */
function rendNav(){
  $('#nav').innerHTML = PLAN[E.role].map((o,i) =>
    `<button class="nav-item ${i===E.onglet?'actif':''}" onclick="vaVers(${i})">${ico(o[0])}<span>${esc(o[1])}</span></button>`
  ).join('');
}
function vaVers(i){
  E.onglet = i; E.fiche = null; E.quiz = null; E.sous = null;
  const lib = (PLAN[E.role][i] || [])[1];
  if (lib === 'Chat') marqueChatLu();
  if (lib === 'Ma fiche') marqueConsignesLues();
  rendVue(); rendNav(); window.scrollTo(0,0);
}

/* Ouvrir sa fiche, c'est avoir lu ses consignes : sans ça la relance du coach
   resterait allumée indéfiniment et ne voudrait plus rien dire. */
function marqueConsignesLues(){
  const j = E.joueur;
  if (!j) return;
  const nouvelles = j.directives.filter(d => !d.lu);
  if (!nouvelles.length) return;
  nouvelles.forEach(d => { d.lu = true; });
  /* Un PATCH sur SES consignes non lues : l'ancienne écriture visait une clé
     (joueur_id) qui n'est unique nulle part et revenait en 400. */
  modifier('directives', 'joueur_id=eq.' + encodeURIComponent(j.id) + '&lue=is.false', {lue: true});
}
function rendVue(){ $('#vue').innerHTML = PLAN[E.role][E.onglet][2](); }

/* sélecteur d'équipe — masqué si la personne n'a qu'un groupe */
function selEquipe(){
  if (E.equipes.length < 2) return '';
  return `<div class="ong">${DB.equipes.filter(e => E.equipes.includes(e.id)).map(e =>
    `<button class="ong-b ${E.equipe===e.id?'actif':''}" onclick="E.equipe='${e.id}';E.fiche=null;rendVue()">${esc(e.nom)}</button>`
  ).join('')}</div>`;
}

/* Le prochain match du groupe de la personne, pas celui du club : un espoir n'a
   pas à voir la rencontre des pros sur son accueil. On retombe sur le calendrier
   du championnat quand rien n'est encore préparé au classeur. */
/* Les compétitions du calendrier (19/10/2026) : le classeur Championnat porte
   désormais tous les matchs de la saison. Le championnat est la règle et ne
   s'étiquette pas ; coupe, play-off et amical s'affichent, avec leur tour. */
const COMPETITION = {
  coupe:   {lib: 'Coupe',    c: 'var(--defense)'},
  playoff: {lib: 'Play-off', c: 'var(--attaque)'},
  amical:  {lib: 'Amical',   c: 'var(--gris)'}
};
function etiqCompetition(r){
  const k = COMPETITION[(r || {}).competition];
  if (!k) return '';
  return `<span class="etiq" style="color:${k.c}">${k.lib}${r.tour ? ' · ' + esc(r.tour) : ''}</span>`;
}
const libCompetition = r => {
  const k = COMPETITION[(r || {}).competition];
  return k ? ' (' + k.lib.toLowerCase() + (r.tour ? ', ' + r.tour : '') + ')' : '';
};

function carteProchainMatch(p){
  const eq = E.role === 'jr' ? E.joueur.equipe : E.equipe;
  const m = prochainMatch(eq);
  const adversaire = m ? m.adversaire : p.adversaire;
  const dom = m ? (m.lieu === 'domicile') : p.domicile;
  const quand = m ? `${m.date}${m.heure ? ' · ' + m.heure : ''}${m.salle ? ' · ' + m.salle : ''}`
                  : `${p.date} · ${p.heure} · ${p.lieu}`;
  const j = m ? joursAvant(m.date) : null;
  const c = m && PEUT_CLASSEUR(E.role) ? completudePrepa(m) : null;
  /* La compétition vient du calendrier : on ne la prête à la fiche de
     préparation que si elle parle du même adversaire. */
  const compet = (!m || m.adversaire === p.adversaire) ? etiqCompetition(p) : '';

  return `<div class="carte">
    <div class="carte-tete">
      <span class="etiq pleine" style="background:var(--or)">Prochain match</span>
      ${j !== null && j >= 0 ? `<span class="etiq" style="color:var(--or)">${j === 0 ? 'aujourd\'hui' : 'J−' + j}</span>` : ''}
      ${compet}
      <span class="carte-note pousse mono">${dom ? 'à domicile' : 'à l\'extérieur'}</span>
    </div>
    <div class="titre" style="font-size:24px;margin-bottom:5px">ASA — ${esc(adversaire)}</div>
    <div class="carte-note">${esc(quand)}</div>
    ${c && c.manquants.length ? `<div class="rang" style="margin-top:10px;gap:8px">
      <div class="jauge" style="flex:1"><i style="width:${c.pct}%;background:var(--alerte)"></i></div>
      <span class="mono" style="font-size:11px;color:var(--alerte)">préparé ${c.faits}/${c.total}</span>
    </div>` : ''}
    ${m ? `<button class="bouton fant plein" style="margin-top:11px" onclick="ouvreSous('prochain')">
      ${PEUT_CLASSEUR(E.role) ? 'Ouvrir la préparation' : 'Voir la préparation'}</button>` : ''}
  </div>`;
}

/* ═══════════════════════════════════ RELANCES ═══════════════════════════════════
   Qui n'a pas fait quoi. Une plateforme que personne ne remplit ne vaut rien :
   c'est l'écran qui dit au DT et aux coachs où appuyer, sans avoir à fouiller.
   Rien ici n'est une note : c'est une liste de choses en retard, elle se vide. */

const SEUIL_TIR = 3;   // jours sans session de tir avant de figurer dans la liste

function relances(){
  const tous = DB.joueurs.filter(j => E.equipes.includes(j.equipe));
  // Un joueur relancé aujourd'hui sort de la liste jusqu'à demain : sans ça
  // l'écran ne se vide jamais et plus personne ne le regarde.
  const dejaFait = tous.filter(j => j.relance === AUJ()).length;
  const mesJ = tous.filter(j => j.relance !== AUJ());

  const tir = mesJ.map(j => {
    const ss = (j.tir && j.tir.sessions) || [];
    /* La PLUS RÉCENTE, pas la dernière du tableau : l'ordre d'arrivée des
       lignes de la base n'est pas garanti, et une relance calculée sur une
       séance de septembre relancerait un joueur qui a tiré hier. */
    const d = ss.length ? ss.map(x => x.date).sort().slice(-1)[0] : null;
    return {j, date: d, jours: d ? ecartJours(d) : null};
  }).filter(x => x.jours === null || x.jours >= SEUIL_TIR)
    .sort((a,b) => (b.jours === null ? 999 : b.jours) - (a.jours === null ? 999 : a.jours));

  // Les relances elles-mêmes ne comptent pas comme consignes non lues :
  // sinon relancer ferait monter le compteur qu'on cherche à faire baisser.
  const consignes = mesJ.map(j => ({j, nb: j.directives.filter(d => !d.lu && !d.relance).length}))
                        .filter(x => x.nb);

  const quiz = [];
  (DB.quiz || []).filter(q => E.equipes.includes(q.equipe)).forEach(q => {
    const manquants = q.joueurs.map(parId).filter(j => j && !(j.quizFaits || {})[q.id]);
    if (manquants.length) quiz.push({q, manquants});
  });

  const questionnaire = mesJ.filter(j => !Object.keys(j.preferences || {}).length);

  // une rencontre dans la semaine dont la préparation n'est pas finie au classeur
  const matchs = (DB.prepaMatch || [])
    .filter(m => m.statut === 'à venir' && E.equipes.includes(m.equipe))
    .map(m => ({m, jours: joursAvant(m.date), c: completudePrepa(m)}))
    .filter(x => x.jours !== null && x.jours >= 0 && x.jours <= 7 && x.c.manquants.length);

  const total = tir.length + consignes.length + questionnaire.length + matchs.length +
                quiz.reduce((a,x) => a + x.manquants.length, 0);
  return {tir, consignes, quiz, questionnaire, matchs, total, dejaFait};
}

/* Une relance = une consigne datée chez le joueur + une ligne dans le fil du
   staff. Pas de notification silencieuse : tout le monde voit qui a relancé quoi. */
function poseRelance(j, texte){

function vueEquipe(){

  const js = parEq(E.equipe);
  const s = js.reduce((a,j) => {
    ['pts','reb','pd','int','bp','a2','m2','a3','m3','lfa','lfm'].forEach(k => a[k] = (a[k]||0) + j.stats[k]);
    a.matchs = Math.max(a.matchs||0, j.stats.matchs); return a;
  }, {});
  const dom = nom => moy(js.map(j => j.notes[nom][j.moyennes.length - 1]));
  const focus = DB.domaines;
  const titre = 'Vue d\'ensemble';

  /* Cumul du challenge de tir sur tout le groupe, les douze postes confondus.
     On n'initialise plus les spots à zéro : un poste où personne n'a tiré doit
     rester vide sur le terrain, pas afficher 0 %. Le terrain est dessiné sur le
     parcours complet dès qu'un poste intérieur a été travaillé — sinon sur
     l'extérieur, qui est ce que le groupe fait par défaut. */
  const cumul = {};
  js.forEach(j => {
    const b = bilanTir(j);
    Object.keys(b.parSpot).forEach(id => {
      const c = cumul[id] || (cumul[id] = {tirs:0, reussis:0});
      c.tirs += b.parSpot[id].tirs; c.reussis += b.parSpot[id].reussis;
    });
  });
  Object.keys(cumul).forEach(id => { cumul[id].pct = pct(cumul[id].reussis, cumul[id].tirs); });
  const parcoursCumul = Object.keys(cumul).some(id => (SPOTS[id] || {}).zone === 'int')
    ? 'complet' : 'ext';

  return `<h1 class="vue-titre">${esc(titre)}</h1>

  </div>
  <div class="carte" style="margin-bottom:14px;border-color:var(--ligne2)">
    <div class="carte-tete"><div class="carte-titre">Playbook</div>
      <span class="carte-note pousse mono">${(DB.systemes || []).filter(x => E.equipes.includes(x.equipe)).length} systèmes</span></div>
    <p class="msg-txt">Construis tes systèmes avec les signes du tableau : déplacements, dribbles,
    passes, écrans, tirs. Chaque système se lit en plusieurs temps et s'imprime pour le vestiaire.</p>
    <button class="bouton fant plein" style="margin-top:11px" onclick="ouvreSous('playbook')">
      Ouvrir le playbook</button>
  </div>` : ''}

  <div class="section-titre">Statistiques de match</div>
  <div class="g4">
    <div class="tuile"><div class="tuile-val">${pct(s.m2,s.a2)}<small style="font-size:13px">%</small></div><div class="tuile-lib">Tirs<br>à 2 pts</div></div>
    <div class="tuile bleu"><div class="tuile-val">${pct(s.m3,s.a3)}<small style="font-size:13px">%</small></div><div class="tuile-lib">Tirs<br>à 3 pts</div></div>
    <div class="tuile blanc"><div class="tuile-val">${pct(s.lfm,s.lfa)}<small style="font-size:13px">%</small></div><div class="tuile-lib">Lancers<br>francs</div></div>
    <div class="tuile vert"><div class="tuile-val">${(s.pd/Math.max(1,s.matchs)).toFixed(0)}</div><div class="tuile-lib">Passes<br>par match</div></div>
  </div>

  <div class="section-titre">Challenge de tir — entraînement</div>
  <div class="carte">
    <div class="carte-tete"><div class="carte-titre">Réussite par spot</div>
      <div class="carte-note pousse">${js.reduce((a,j) => a + bilanTir(j).nb, 0)} séances relevées</div></div>
    ${carteTirs({parSpot: cumul}, 400, parcoursCumul)}
    <p class="carte-note" style="margin-top:9px;text-align:center">
      Protocole : 20 tirs par spot en aller-retour, soit 200 tirs, plus 100 lancers francs.
      Ces chiffres ne se mélangent jamais aux statistiques de match.</p>
  </div>

  <div class="section-titre">Niveau du groupe${E.role!=='hc'&&E.role!=='as'?' — domaines suivis':''}</div>
  <div class="carte">
    ${focus.map(d => {
      const v = dom(d);
      return `<div class="dom-ligne"><div><div class="dom-nom">${esc(d)}</div>
        <div class="dom-barre"><i style="width:${(v*10).toFixed(0)}%;background:${couleurNote(v)}"></i></div></div>
        <div class="dom-val">${v.toFixed(1)}</div></div>`;
    }).join('')}

  <div class="section-titre">Classement au tir</div>
  <div class="tab-enrob"><table class="tab">

function vueJoueurs(){
  if (E.fiche) return ficheJoueur(parId(E.fiche), {
    retour:'E.fiche=null;rendVue()', editable: EST_COACH(E.role), medical: E.role === 'ki'});

  if (E.role === 'ki'){
    const js = parEq(E.equipe);
    return `<h1 class="vue-titre">Effectif</h1>
    <p class="vue-sous">État de santé de chaque joueur. Les dossiers détaillés sont dans le secteur médical.</p>
    ${selEquipe()}
    ${listeJoueurs(js, 'ouvreFiche', j => {
      const m = DB.medical.find(x => x.joueur === j.id && x.statut !== 'Rétabli');
      /* La ligne du joueur porte aussi son dernier entraînement : temps réel
         passé à la séance, et l'heure de départ s'il est parti avant la fin. */
      const entr = dernierEntrainement(j);
      return {txt: m ? '!' : '✓', coul: m ? 'var(--danger)' : 'var(--physique)',
              meta: m ? m.type : 'Aucun signalement', meta2: entr};
    })}`;
  }

  const js = parEq(E.equipe).slice().sort((a,b) => note1(b) - note1(a));
  return `<h1 class="vue-titre">Joueurs</h1>
  <p class="vue-sous">Classés par niveau général du mois. Le classement au tir est dans l'écran Équipe.</p>
  ${selEquipe()}${listeJoueurs(js, 'ouvreFiche')}`;
}
function ouvreFiche(id){ E.fiche = id; rendVue(); window.scrollTo(0,0); }

function ficheJoueur(j, opt){
  opt = opt || {};
  const s = j.stats, dern = j.moyennes.length - 1;
  const m = n => (n / Math.max(1, s.matchs)).toFixed(1);
  const evol = dern > 0 ? +(j.moyennes[dern] - j.moyennes[0]).toFixed(1) : 0;

function enregistreMotCoach(id){

function envoieDirective(id){
  const j = parId(id), txt = ($('#dirTexte').value || '').trim();

                             auteur_role:E.role, texte:txt, lue:false});

/* ═══════════════════════════════════ CLIPS VIDÉO DU JOUEUR ═══════════════════════════════════
   Les actions du joueur, découpées sur Hudl par le coach et rattachées à lui.
   C'est ce qui manquait : un joueur ne se revoit jamais, il revoit l'équipe.
   Trois intentions seulement — réussi, à corriger, modèle du groupe — pour que
   le clip reste une image à revoir et ne devienne pas une note déguisée. */

const TAG_CLIP = {
  reussite: {lib:'Réussi',       coul:'var(--physique)'},
  corriger: {lib:'À corriger',   coul:'var(--alerte)'},
  modele:   {lib:'Modèle',       coul:'var(--analyste)'},
};
const clipsJoueur = id => (DB.clips || []).filter(c => c.joueur === id);

function blocClips(j, peutAjouter){
  const cs = clipsJoueur(j.id);
  const neufs = cs.filter(c => !c.vu).length;
  const mien = E.role === 'jr';

  return `<div class="section-titre">${mien ? 'Mes actions' : 'Ses actions en vidéo'}</div>
  <div class="carte" style="margin-bottom:10px;padding:11px 13px">
    <p class="carte-note">${cs.length} clip${cs.length>1?'s':''} découpé${cs.length>1?'s':''} sur Hudl${neufs ? ` · <b style="color:var(--or)">${neufs} pas encore vu${neufs>1?'s':''}</b>` : ''}.
    ${mien ? 'Ce sont tes actions à toi, pas celles de l\'équipe.' : 'Rattachés à ce joueur seul.'}</p>
  </div>
  ${cs.length ? cs.map(c => {
    const t = TAG_CLIP[c.tag] || TAG_CLIP.reussite;
    return `<button class="clip" style="--c:${t.coul}" onclick="ouvreClip('${c.id}')">
      <span class="clip-play">▶</span>
      <span class="clip-bloc">
        <span class="clip-titre">${esc(c.titre)}</span>
        <span class="clip-meta">${esc(t.lib)} · ${esc(c.contexte)} · ${esc(c.date)} · ${esc((membre(c.auteur).nom || '').split(' ')[0] || '')}</span>
        <span class="clip-note">${esc(c.note)}</span>
      </span>
      ${c.vu ? '' : '<i class="clip-pt" aria-label="pas encore vu"></i>'}
    </button>`;
  }).join('') : `<div class="vide">Aucun clip pour l'instant.${mien ? ' Ton coach t\'en enverra après le prochain match.' : ''}</div>`}

  ${peutAjouter ? `<div class="carte" style="margin-top:10px">
    <div class="carte-tete"><div class="carte-titre">Ajouter un clip</div></div>
    <label class="label" for="clTitre">Ce qu'on regarde</label>
    <input class="champ" id="clTitre" placeholder="Ex. : sortie d'écran et tir en un temps">
    <label class="label" for="clUrl" style="margin-top:12px">Lien du clip Hudl</label>
    <input class="champ" id="clUrl" placeholder="https://www.hudl.com/video/…">
    <div class="g2" style="margin-top:12px">
      <div><label class="label" for="clTag">Intention</label>
        <select class="champ" id="clTag">
          <option value="reussite">Réussi</option>
          <option value="corriger">À corriger</option>
          <option value="modele">Modèle du groupe</option></select></div>
      <div><label class="label" for="clCtx">Contexte</label>
        <input class="champ" id="clCtx" placeholder="ASA — Abidjan BC"></div>
    </div>
    <label class="label" for="clNote" style="margin-top:12px">Ce qu'il doit voir</label>
    <textarea class="champ" id="clNote" placeholder="Une phrase. Le clip dit le reste."></textarea>
    <button class="bouton plein" style="margin-top:11px" onclick="ajouteClip('${j.id}')">
      Envoyer à ${esc(j.nom.split(' ')[0])}</button>
  </div>` : ''}`;
}

function ouvreClip(id){
  const c = (DB.clips || []).find(x => x.id === id);
  if (!c) return;
  if (!c.vu && E.role === 'jr'){
    c.vu = true;
    modifier('clips', 'id=eq.' + c.id, {vu: true});
    rendNav();
  }
  ouvreFeuille(`
    <div class="feuille-titre">${esc(c.titre)}</div>
    <div class="feuille-sous">${esc((TAG_CLIP[c.tag]||{}).lib || '')} · ${esc(c.contexte)} · ${esc(c.date)}</div>
    <div class="qz-clip">
      <span class="qz-play">▶</span>
      <div style="min-width:0">
        <div style="font-weight:700;font-size:13px">Clip de l'action</div>
        <div class="carte-note mono" style="font-size:10px;word-break:break-all">${esc(c.url || 'lien à renseigner')}</div>
      </div>
    </div>
    <div class="carte"><p class="msg-txt">${esc(c.note)}</p>
      <div class="carte-note mono" style="margin-top:8px;font-size:10px">posé par ${esc(membre(c.auteur).nom || '—')}</div></div>
    <div class="g2" style="margin-top:14px">
      <button class="bouton fant" onclick="fermeFeuille()">Fermer</button>
      <button class="bouton" onclick="lanceClip('${c.id}')">Ouvrir sur Hudl ↗</button>
    </div>`);
}
function lanceClip(id){
  const c = (DB.clips || []).find(x => x.id === id);
  if (c && c.url && c.url.length > 8) window.open(c.url, '_blank', 'noopener');
  else toast('Lien du clip à renseigner');
}

function ajouteClip(joueurId){
  const titre = ($('#clTitre').value || '').trim();
  if (!titre) { toast('Dis ce qu\'on regarde sur ce clip'); return; }
  const j = parId(joueurId);
  const c = {id:'v'+Date.now(), joueur:joueurId, tag:$('#clTag').value,
             titre, note:($('#clNote').value || '').trim() || '—',
             contexte:($('#clCtx').value || '').trim() || 'Entraînement',
             date:AUJ_FR(), auteur:(E.moi||{}).id || E.role,
             url:($('#clUrl').value || '').trim(), vu:false};
  DB.clips = DB.clips || [];
  DB.clips.unshift(c);
  enregistrer('clips', {joueur_id:joueurId, tag:c.tag, titre:c.titre, note:c.note,
                        contexte:c.contexte, url:c.url, auteur_id:(E.moi||{}).id || null});
  journalChat(`a envoyé un clip à ${j.nom} — « ${titre} »`);
  toast('Clip envoyé à ' + j.nom.split(' ')[0]);
  rendVue(); rendNav();
}

/* ══════════════════════════════════════════════════════════════════════════
   CHALLENGE DE TIR — le protocole quotidien
   Les joueurs travaillent par deux : un shooteur, un rebondeur. Le rebondeur
   compte et reporte le score sur 20 à la fin de chaque série.
   5 spots (0° · 45° · axe · 45° · 0°) en aller-retour = 10 séries de 20 = 200
   tirs, plus 5 séries de 20 lancers francs = 100. Total 300 tirs par jour.

   Ces chiffres sont ceux de l'ENTRAÎNEMENT. Ils ne se mélangent jamais aux
   statistiques de match, qui viennent de l'analyse Hudl.
   ══════════════════════════════════════════════════════════════════════════ */

let SAISIE_TIR = null;   // {joueurId, parcours, series:{cle:valeur}, lf:[…]}
let SAISIE_REPRISE = false;
/* Le parcours affiché à l'écran. Nul = celui du joueur, lu dans le classeur. */
let SAISIE_PARCOURS = null;

/* Le brouillon de saisie vit sur l'appareil, pas en mémoire de page. Entre la
   série 3 et la série 12 il se passe une heure : téléphone qui se verrouille,
   navigateur qui recharge, batterie. Sans ça, le binôme recompte tout.

   La clé porte le parcours, et c'est volontaire : un joueur qui commence un
   parcours extérieur, bascule sur l'intérieur pour deux séries et revient doit
   retrouver ses deux comptages. Une clé unique par joueur écraserait le premier
   brouillon au moment de la bascule — sans rien dire. */
const cleSaisie = (id, p) => 'asa.saisieTir.' + id + '.' + p;
function sauveSaisie(){
  if (!SAISIE_TIR) return;
  try { localStorage.setItem(cleSaisie(SAISIE_TIR.joueurId, SAISIE_TIR.parcours),
                             JSON.stringify(SAISIE_TIR)); } catch (e){}
}
function purgeSaisie(id, p){
  try { localStorage.removeItem(cleSaisie(id, p)); } catch (e){}
}
function brouillonSaisie(joueurId, p){
  try {
    const b = JSON.parse(localStorage.getItem(cleSaisie(joueurId, p)) || 'null');
    if (b && b.joueurId === joueurId && b.parcours === p && b.series && Array.isArray(b.lf)) return b;
  } catch (e){}
  return null;
}

/* Les séries viennent du parcours, pas d'une liste écrite en dur : cinq spots
   en extérieur, sept en intérieur, douze en complet. */
function nouvelleSaisie(joueurId, p){
  const series = {};
  seriesDe(p).forEach(x => { series[x.sens + ':' + x.spot] = null; });
  const c = parcoursDef(p) || {};
  return {joueurId, parcours: p, series,
          lf: Array(c.seriesLf == null ? DB.seriesLf : c.seriesLf).fill(null)};
}
function saisieEnCours(joueurId, p){
  if (!SAISIE_TIR || SAISIE_TIR.joueurId !== joueurId || SAISIE_TIR.parcours !== p){
    const b = brouillonSaisie(joueurId, p);
    SAISIE_REPRISE = !!b;
    SAISIE_TIR = b || nouvelleSaisie(joueurId, p);
  }
  return SAISIE_TIR;
}
/* Le parcours en cours de saisie pour ce joueur : celui qu'il a choisi à
   l'écran, sinon le sien. */
function parcoursSaisie(j){
  return SAISIE_PARCOURS && parcoursDef(SAISIE_PARCOURS) ? SAISIE_PARCOURS : parcoursDe(j);
}
function choisitParcoursSaisie(p){
  if (!parcoursDef(p)) return;
  SAISIE_PARCOURS = p;
  SAISIE_TIR = null;            // le brouillon de l'autre parcours reste sur l'appareil
  SAISIE_REPRISE = false;
  rendVue();
}
function majSerie(cle, valeur){
  const v = valeur === '' ? null : Math.max(0, Math.min(DB.tirsParSerie, parseInt(valeur, 10) || 0));
  if (cle.startsWith('lf:')) SAISIE_TIR.lf[+cle.slice(3)] = v;
  else SAISIE_TIR.series[cle] = v;
  sauveSaisie();
  majTotalSaisie();
}
function totalSaisie(){
  const s = SAISIE_TIR;
  if (!s) return {faits:0, attendus:0, reussis:0, tirs:0, complet:false};
  const vals = Object.values(s.series).concat(s.lf);
  const faits = vals.filter(v => v !== null).length;
  const reussis = vals.reduce((a,v) => a + (v || 0), 0);
  return {faits, attendus: vals.length, reussis, tirs: faits * DB.tirsParSerie,
          pct: pct(reussis, faits * DB.tirsParSerie), complet: faits === vals.length};
}
function majTotalSaisie(){
  const t = totalSaisie(), z = $('#tirTotal');
  if (!z) return;
  z.innerHTML = `<div class="ban-chiffre" style="color:${t.faits?couleurPct(t.pct):'var(--gris2)'}">${t.faits?t.pct+'%':'—'}</div>
    <div class="ban-lib">${t.reussis} réussis sur ${t.tirs} tirs · ${t.faits}/${t.attendus} séries</div>`;
  const b = $('#tirValider');
  if (b){ b.disabled = !t.faits; b.style.opacity = t.faits ? 1 : .45; }
}

/* ─────────────────────────────────── une ligne de saisie */
function ligneSerie(cle, libelle, sousLibelle, valeur){
  return `<div class="tir-serie">
    <div><div class="tir-spot">${esc(libelle)}</div><div class="tir-sens">${esc(sousLibelle)}</div></div>
    <div class="tir-saisie">
      <input class="tir-inp ${valeur !== null ? 'pleine' : ''}" inputmode="numeric" pattern="[0-9]*"
             maxlength="2" value="${valeur === null ? '' : valeur}" placeholder="–"
             aria-label="Réussis sur ${DB.tirsParSerie} — ${esc(libelle)} ${esc(sousLibelle)}"
             oninput="majSerie('${cle}', this.value); this.classList.toggle('pleine', this.value !== '')">
      <span class="tir-sur">/ ${DB.tirsParSerie}</span>
    </div>
  </div>`;
}

/* ─────────────────────────────────── bloc de saisie complet */
function blocSaisieTir(joueur){
  const p = parcoursSaisie(joueur);
  const s = saisieEnCours(joueur.id, p);
  const t = totalSaisie();
  const c = parcoursDef(p) || {};
  const aller  = seriesDe(p).filter(x => x.sens === 'aller');
  const retour = seriesDe(p).filter(x => x.sens === 'retour');
  const nomDe  = id => (SPOTS[id] || {}).nom  || id;
  const courtDe = id => (SPOTS[id] || {}).court || id;
  /* Les trois parcours, avec une marque sur celui du joueur : le binôme doit
     voir d'un coup d'œil s'il est en train de saisir autre chose que le
     parcours habituel du shooteur. */
  const sien = parcoursDe(joueur);
  const choix = `<div class="ong">${PARCOURS_IDS.filter(parcoursDef).map(id =>
    `<button class="ong-b ${id === p ? 'actif' : ''}" onclick="choisitParcoursSaisie('${id}')">
      ${esc(nomParcours(id))}${id === sien ? ' ★' : ''}</button>`).join('')}</div>`;

  return `
  <div class="carte">
    <div class="carte-tete"><div class="carte-titre">Séance du jour</div>
      <span class="etiq pousse" style="color:var(--gris)">${totalTirs(p)} tirs</span></div>
    ${choix}
    <p class="carte-note" style="margin:-2px 0 10px">${esc(c.resume || '')}${
      p === sien ? '' : ` · le parcours de ${esc(joueur.nom.split(' ')[0])} est « ${esc(nomParcours(sien))} »`}</p>
    ${SAISIE_REPRISE && t.faits ? `<div class="hf ok" style="border-radius:9px;margin-bottom:10px;padding:8px 11px">
      <i class="hf-pt"></i><span>Saisie reprise là où elle s'était arrêtée — ${t.faits} série${t.faits>1?'s':''} déjà comptée${t.faits>1?'s':''}</span>
      </div>` : ''}
    <div id="tirTotal" style="text-align:center;padding:4px 0 12px">
      <div class="ban-chiffre" style="color:${t.faits?couleurPct(t.pct):'var(--gris2)'}">${t.faits?t.pct+'%':'—'}</div>
      <div class="ban-lib">${t.reussis} réussis sur ${t.tirs} tirs · ${t.faits}/${t.attendus} séries</div>
    </div>

    <div class="section-titre" style="margin-top:4px">Aller — ${esc(aller.map(x => courtDe(x.spot)).join(' · '))}</div>
    ${aller.map(x => ligneSerie('aller:' + x.spot, nomDe(x.spot), courtDe(x.spot) + ' · aller',
                                s.series['aller:' + x.spot])).join('')}

    ${retour.length ? `<div class="section-titre">Retour — ${esc(retour.map(x => courtDe(x.spot)).join(' · '))}</div>
    ${retour.map(x => ligneSerie('retour:' + x.spot, nomDe(x.spot), courtDe(x.spot) + ' · retour',
                                 s.series['retour:' + x.spot])).join('')}` : ''}

    <div class="section-titre">Lancers francs — ${s.lf.length} × ${DB.tirsParSerie}</div>
    ${s.lf.map((v,i) => ligneSerie('lf:' + i, 'Série ' + (i+1), 'lancers francs', v)).join('')}

    <button class="bouton plein" id="tirValider" style="margin-top:14px"
            onclick="validerSaisieTir()" ${t.faits ? '' : 'disabled style="opacity:.45;margin-top:14px"'}>
      Enregistrer la séance</button>
    <p class="carte-note" style="margin-top:9px;text-align:center">
      Le rebondeur compte et reporte le score à la fin de chaque série.</p>
  </div>`;
}

function validerSaisieTir(){
  const s = SAISIE_TIR;
  if (!s) return;
  const t = totalSaisie();
  if (!t.faits) { toast('Aucune série saisie'); return; }
  const j = parId(s.joueurId);
  const series = [];
  Object.entries(s.series).forEach(([cle, v]) => {
    if (v === null) return;
    const [sens, spot] = cle.split(':');
    series.push({spot, sens, reussis: v});
  });
  const session = {date: AUJ(), parcours: s.parcours, series,
                   lf: s.lf.filter(v => v !== null),
                   saisiPar: E.role === 'jr' ? 'binome' : E.role};
  /* `j.tir` existe toujours — en démonstration il vient du jeu de données, en
     mode serveur de la lecture de sessions_tir. La garde reste quand même : ce
     push était la ligne qui levait une TypeError quand la lecture manquait, et
     un écran de saisie ne doit pas tomber parce qu'une table est vide. */
  if (!j.tir) j.tir = {sessions: []};
  if (!Array.isArray(j.tir.sessions)) j.tir.sessions = [];
  j.tir.sessions.push(session);
  enregistrer('sessions_tir', {joueur_id: j.id, date_session: session.date,
                               parcours: session.parcours,
                               series: session.series, lf: session.lf,
                               saisi_par: (E.moi || {}).id || null},
              'joueur_id,date_session,parcours');
  purgeSaisie(j.id, s.parcours); SAISIE_TIR = null; SAISIE_REPRISE = false;
  toast(t.complet ? `Séance complète enregistrée — ${t.pct}%`
                  : `${t.faits} séries enregistrées — ${t.pct}%`);
  rendVue(); rendNav(); window.scrollTo(0,0);
}

      return `<button class="cx-carte" style="flex-direction:column;gap:3px;padding:9px 6px;text-align:center;
        ${present ? 'border-color:var(--physique);background:rgba(79,168,58,.10)' : 'opacity:.5'}"
        onclick="ENTR.presents['${j.id}']=${present?false:true};rendVue()">
        <span class="titre" style="font-size:17px;color:${present?'var(--physique)':'var(--danger)'}">${j.numero}</span>
        <span style="font-size:10px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">
          ${esc(j.nom.split(' ')[1] || j.nom)}</span>
      </button>`;
    }).join('')}
  </div>

  <div class="carte" style="margin-top:12px">
    <label class="label" for="entTheme">Contenu de la séance</label>
    <input class="champ" id="entTheme" placeholder="Ex. : jeu placé, défense sur écran, transition"
      value="${esc(ENTR.theme)}" oninput="ENTR.theme=this.value">
    <label class="label" for="entInt" style="margin-top:12px">Intensité ressentie · ${ENTR.intensite}/5</label>
    <input type="range" id="entInt" min="1" max="5" value="${ENTR.intensite}" style="width:100%;accent-color:var(--or)"
      oninput="ENTR.intensite=+this.value;rendVue()">
    <label class="label" for="entDuree" style="margin-top:12px">Durée</label>
    <select class="champ" id="entDuree" onchange="ENTR.duree=this.value">
      ${['1 h 00','1 h 15','1 h 30','1 h 45','2 h 00'].map(d =>
        `<option ${ENTR.duree===d?'selected':''}>${d}</option>`).join('')}
    </select>
    <label class="label" for="entVideo" style="margin-top:12px">Lien de la vidéo</label>
    <input class="champ" id="entVideo" placeholder="https://drive.google.com/…">
    <button class="bouton plein" style="margin-top:12px" onclick="enregistreSeance()">
      Enregistrer la séance</button>
  </div>`;
}

function enregistreSeance(){
  const js = parEq(ENTR.equipe);
  const lib = ENTR.theme.trim() || 'Séance';

  /* L'identifiant est fabriqué ici, comme dans l'écran d'appel, et pour la
     même raison : sans lui, les présences n'auraient aucune séance à viser.
     C'est aussi ce qui fait que les deux écrans écrivent dans le MÊME registre
     au lieu d'entretenir deux comptes qui finissent par diverger. */
  const id = (crypto.randomUUID ? crypto.randomUUID() : 's' + Date.now());

  /* La liste tapée marque les absents, et c'est une information que l'appel
     scanné ne produit pas : lui ne connaît que ceux qui se sont présentés. On
     la garde — « absent constaté » ne veut pas dire la même chose que « pas
     encore pointé », et c'est le genre de nuance qui compte quand le DT relit
     la saison. */
  const appel = js.map(j => ({
    joueur: j.id, present: ENTR.presents[j.id] !== false,
    heure: null, retard: false, voie: 'manuel'
  }));
  const nb = appel.filter(p => p.present).length;

  DB.seances.unshift({id: id, libelle:`Séance du ${AUJ_FR().slice(0,5)} — ${lib}`,
                      type:'entrainement', date:AUJ_FR(), equipe:ENTR.equipe,
                      duree:ENTR.duree, intensite:ENTR.intensite, appel: appel});

  enregistrer('seances', {id: id,
                          equipe_code:ENTR.equipe, date_seance:AUJ(), type:'entrainement',
                          libelle:lib, duree:ENTR.duree, intensite:ENTR.intensite,
                          video_url:($('#entVideo')||{}).value || null,
                          saisi_par:(E.moi||{}).id || null}, 'id');

  /* Une ligne par personne, derrière la séance dans la file : la présence
     référence la séance par clé étrangère, et la file garde l'ordre. */
  appel.forEach(p => enregistrer('presences', {
    seance_id: id, joueur_id: p.joueur, present: p.present,
    heure: null, retard: false, voie: 'manuel'
  }, 'seance_id,joueur_id'));
  journalChat(`a déposé la séance du jour — ${nomEq(ENTR.equipe)} · ${nb} présents · ${lib}`);
  toast(`Séance enregistrée — ${nb} présents`);
  ENTR.theme = ''; rendVue(); rendNav();
}

/* ══════════════════════════════════════════════════════════════════════════
   HISTORIQUE DU CHALLENGE DE TIR
   Toutes les sessions passées, du plus récent au plus ancien, avec le détail
   par spot au clic. C'est la trace que le joueur regarde pour voir s'il monte.
   ══════════════════════════════════════════════════════════════════════════ */

/* L'historique, toutes zones confondues : le joueur veut voir ses séances, et
   l'étiquette du parcours suffit à les distinguer. L'écart affiché à droite ne
   compare que des séances du MÊME parcours — sinon il mesure le changement de
   parcours, pas la progression. */
function blocHistoriqueTir(j, cliquable){
  const ss = (j.tir && j.tir.sessions || []).slice()
               .sort((a, b) => String(a.date) < String(b.date) ? 1 : -1);
  if (!ss.length) return '<div class="vide">Aucune séance enregistrée pour l\'instant.</div>';
  return `<div class="jl">${ss.map((s, i) => {
    const b = bilanSession(s);
    const prec = ss.slice(i + 1).find(x => (x.parcours || 'ext') === b.parcours);
    const delta = prec ? b.pct - bilanSession(prec).pct : null;
    const court = (parcoursDef(b.parcours) || {}).court || b.parcours;
    return `<button class="jl-item" onclick="${cliquable ? `ouvreSession('${j.id}','${s.date}','${b.parcours}')` : ''}">
      <span class="jl-num" style="font-size:11px">${esc(court)}</span>
      <span class="jl-bloc">
        <span class="jl-nom">${esc(jourFr(s.date))}</span>
        <span class="jl-meta">${b.reussis}/${b.tirs} terrain · LF ${b.lfTirs ? b.lfPct + '%' : '—'}</span>
      </span>
      ${delta === null ? '' : `<span class="mono ${delta > 0 ? 'hausse' : delta < 0 ? 'baisse' : 'plat'}"
        style="font-size:11px">${delta > 0 ? '+' : ''}${delta}</span>`}
      <span class="jl-note" style="color:${couleurPct(b.pct)}">${b.pct}%</span>
      ${cliquable ? '<span class="jl-fleche">›</span>' : ''}
    </button>`;
  }).join('')}</div>`;
}

/* Une séance se retrouve par sa date ET son parcours, pas par son rang dans le
   tableau : l'historique est trié à l'affichage, et un index aurait désigné une
   autre séance dès qu'une saisie du jour s'ajoute en tête. */
function ouvreSession(joueurId, date, parcours){
  const j = parId(joueurId);
  const s = ((j.tir || {}).sessions || []).find(
    x => String(x.date) === String(date) && (x.parcours || 'ext') === (parcours || 'ext'));
  if (!s) return;
  const b = bilanSession(s);
  const parSens = {};
  (s.series || []).forEach(x => { (parSens[x.sens] = parSens[x.sens] || []).push(x); });
  const nomSpot = id => (SPOTS[id] || {}).nom || id;

  ouvreFeuille(`
    <div class="feuille-titre">Séance du ${esc(String(s.date).split('-').reverse().join('/'))}</div>
    <div class="feuille-sous">Parcours ${esc(nomParcours(b.parcours).toLowerCase())} ·
      ${b.totalReussis} réussis sur ${b.total} tirs ·
      saisie par ${esc(s.saisiPar === 'binome' ? 'le binôme' : (s.saisiPar || '—'))}</div>

    <div class="g3" style="margin-bottom:14px">
      <div class="tuile bleu"><div class="tuile-val" style="color:${couleurPct(b.pct)}">${b.pct}<small style="font-size:12px">%</small></div><div class="tuile-lib">Terrain</div></div>
      <div class="tuile vert"><div class="tuile-val">${b.lfTirs ? b.lfPct : '—'}<small style="font-size:12px">${b.lfTirs ? '%' : ''}</small></div><div class="tuile-lib">Lancers francs</div></div>
      <div class="tuile"><div class="tuile-val">${b.total}</div><div class="tuile-lib">Tirs<br>comptés</div></div>
    </div>

    ${carteTirs({parSpot: b.parSpot}, 340, b.parcours)}

    ${['aller','retour'].filter(sens => parSens[sens]).map(sens => `
      <div class="section-titre">${sens === 'aller' ? 'Aller' : 'Retour'}</div>
      ${parSens[sens].map(x => `<div class="tir-serie">
        <div><div class="tir-spot">${esc(nomSpot(x.spot))}</div></div>
        <div class="tir-pastille" style="color:${couleurPct(pct(x.reussis, DB.tirsParSerie))}">
          ${x.reussis}<span class="tir-sur"> / ${DB.tirsParSerie}</span></div>
      </div>`).join('')}`).join('')}

    ${(s.lf || []).length ? `<div class="section-titre">Lancers francs</div>
      ${s.lf.map((v, i) => `<div class="tir-serie">
        <div><div class="tir-spot">Série ${i + 1}</div></div>
        <div class="tir-pastille" style="color:${couleurPct(pct(v, DB.tirsParSerie))}">
          ${v}<span class="tir-sur"> / ${DB.tirsParSerie}</span></div>
      </div>`).join('')}` : ''}

    <button class="bouton fant plein" style="margin-top:16px" onclick="fermeFeuille()">Fermer</button>`);
}

/* ══════════════════════════════════════════════════════════════════════════
   OPPOSITION D'ENTRAÎNEMENT — terrain FIBA complet
   Réservé aux matchs joués À L'ENTRAÎNEMENT : opposition interne, deux camps.
   Les rencontres officielles du championnat ne se saisissent pas ici : elles
   sont analysées sur Hudl.
   ══════════════════════════════════════════════════════════════════════════ */

let OPPO = null;

function nouvelleOppo(equipe){
  const js = parEq(equipe);
  const milieu = Math.ceil(js.length / 2);
  return {equipe, periode: 1, score: {rouges: 0, blancs: 0},
          camps: {rouges: js.slice(0, milieu).map(j => j.id),
                  blancs: js.slice(milieu).map(j => j.id)},
          tirs: [], stats: {}, histo: [], zone: null, joueur: null};
}
function oppoEnCours(){
  if (!OPPO || !E.equipes.includes(OPPO.equipe)) OPPO = nouvelleOppo(E.equipes[0]);
  return OPPO;
}
function statsOppo(id){
  return OPPO.stats[id] || (OPPO.stats[id] =
    {pts:0, a2:0, m2:0, a3:0, m3:0, lfa:0, lfm:0, reb:0, pd:0, int:0, bp:0, fte:0});
}

function vueOpposition(){
  const o = oppoEnCours();
  const marques = o.tirs.map(t =>
    `<circle cx="${t.x}" cy="${t.y}" r="4.5" fill="${t.reussi ? '#4FA83A' : '#E0564B'}"
      fill-opacity="${t.reussi ? .9 : .55}" stroke="${t.reussi ? '#4FA83A' : '#E0564B'}" stroke-width="1.2"/>`
  ).join('');

  const camp = (cle, libelle, couleur) => `
    <div class="carte" style="padding:11px 12px">
      <div class="carte-tete" style="margin-bottom:8px">
        <i class="puce" style="background:${couleur};width:9px;height:9px"></i>
        <div class="carte-titre" style="font-size:14px">${esc(libelle)}</div>
        <div class="titre pousse" style="font-size:22px;color:${couleur}">${o.score[cle]}</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:5px">
        ${o.camps[cle].map(id => { const j = parId(id); if (!j) return '';
          const s = o.stats[id];
          return `<button class="cx-carte" style="flex-direction:column;gap:2px;padding:8px 5px;text-align:center;
            ${o.joueur === id ? 'border-color:var(--or);background:rgba(255,178,70,.13)' : ''}"
            onclick="choisitTireur('${id}','${cle}')">
            <span class="titre" style="font-size:16px;color:${couleur}">${j.numero}</span>
            <span style="font-size:9.5px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">
              ${esc(j.nom.split(' ')[1] || j.nom)}</span>
            ${s && s.pts ? `<span class="mono" style="font-size:9.5px;color:var(--or)">${s.pts} pts</span>` : ''}
          </button>`;
        }).join('')}
      </div>
    </div>`;

  return `<h1 class="vue-titre">Opposition</h1>
  <p class="vue-sous">Match joué à l'entraînement. Les rencontres officielles ne se saisissent pas ici.</p>

  ${E.equipes.length < 2 ? '' : `<div class="ong">${DB.equipes.filter(e => E.equipes.includes(e.id)).map(e =>
    `<button class="ong-b ${o.equipe===e.id?'actif':''}"
      onclick="OPPO=nouvelleOppo('${e.id}');rendVue()">${esc(e.nom)}</button>`).join('')}</div>`}

  <div class="carte" style="padding:11px 12px">
    <div class="rang" style="gap:8px">
      <div style="min-width:0;flex:1">
        <div class="mono" style="font-size:9.5px;letter-spacing:1.2px;color:var(--attaque)">ROUGES</div>
        <div class="titre" style="font-size:31px;color:var(--attaque)">${o.score.rouges}</div>
      </div>
      <div class="centre" style="flex:0 0 auto">
        <div class="mono" style="font-size:9.5px;color:var(--gris2)">PÉRIODE</div>
        <div class="titre" style="font-size:20px">Q${o.periode}</div>
        <button class="bouton fant" style="padding:4px 9px;font-size:11px;margin-top:3px"
          onclick="OPPO.periode=OPPO.periode%4+1;rendVue()">suivante ›</button>
      </div>
      <div style="min-width:0;flex:1;text-align:right">
        <div class="mono" style="font-size:9.5px;letter-spacing:1.2px;color:var(--defense)">BLANCS</div>
        <div class="titre" style="font-size:31px;color:var(--defense)">${o.score.blancs}</div>
      </div>
    </div>
  </div>

  <div class="terrain-enrob" id="terrainOppo" style="margin-top:12px">
    ${terrainCompletSVG('svgOppo', marques)}
  </div>
  <div class="zone-info" id="zoneOppo">${o.zone
    ? `⟡ ${esc(o.zone.lib)} — ${o.zone.cote === 'rouges' ? 'rouges' : 'blancs'} — choisis le tireur`
    : 'touche le terrain à l\'endroit du tir'}</div>

  ${camp('rouges', 'Maillots rouges', 'var(--attaque)')}
  ${camp('blancs', 'Maillots blancs', 'var(--defense)')}

  <div class="section-titre">Actions hors tir</div>
  <div class="carte">
    <p class="carte-note" style="margin-bottom:9px">Sélectionne d'abord un joueur, puis l'action.</p>
    <div class="g3">
      <button class="act-b" onclick="actionOppo('reb')">Rebond</button>
      <button class="act-b" onclick="actionOppo('pd')">Passe déc.</button>
      <button class="act-b" onclick="actionOppo('int')">Intercep.</button>
      <button class="act-b" onclick="actionOppo('bp')">Balle perdue</button>
      <button class="act-b" onclick="actionOppo('fte')">Faute</button>
      <button class="act-b" onclick="lancerFrancOppo()">Lancer franc</button>
    </div>
  </div>

  <div class="section-titre">Dernières actions</div>
  <div class="carte">
    ${o.histo.length ? `<div class="hist">${o.histo.slice(0,10).map(h =>
      `<div class="hist-l"><i class="puce" style="background:${h.coul}"></i>
        <span style="min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(h.txt)}</span>
        <span class="mono pousse">Q${h.q}</span></div>`).join('')}</div>
      <button class="bouton fant plein" style="margin-top:10px" onclick="annuleOppo()">↩ Annuler la dernière</button>`
      : '<div class="vide" style="padding:16px">Aucune action enregistrée.</div>'}
  </div>

  <div class="g2" style="margin-top:12px">
    <button class="bouton fant" onclick="toast('Feuille enregistrée')">Enregistrer</button>
    <button class="bouton" onclick="clotureOppo()">Clôturer l'opposition</button>
  </div>

  <div class="section-titre">Oppositions précédentes</div>
  ${(DB.oppositions || []).filter(x => E.equipes.includes(x.equipe)).map(x => `<div class="carte">
    <div class="carte-tete">
      <span class="etiq pleine" style="background:var(--analyste)">Entraînement</span>
      <span class="carte-note pousse mono">${esc(x.date)}</span></div>
    <div class="rang">
      <div class="titre" style="font-size:20px">${esc(x.cotes[0])}</div>
      <div class="titre pousse" style="font-size:22px">${x.score[0]} – ${x.score[1]}</div>
    </div>
    <div class="carte-note" style="margin-top:4px">${esc(x.cotes[1])} · ${esc(nomEq(x.equipe))} · ${esc(x.duree)}</div>
  </div>`).join('')}`;
}

/* clic sur le terrain complet */
function brancheOppo(){
  const enrob = $('#terrainOppo');
  if (!enrob || enrob._branche) return;
  enrob._branche = true;
  enrob.addEventListener('click', ev => {
    const svg = $('#svgOppo');
    if (!svg) return;
    const r = svg.getBoundingClientRect(), vb = svg.viewBox.baseVal;
    const p = {x:(ev.clientX - r.left) * vb.width / r.width,
               y:(ev.clientY - r.top) * vb.height / r.height};
    if (p.x < 0 || p.x > vb.width || p.y < 0 || p.y > vb.height) return;
    const z = detecteZone(p);
    const coul = z.pts === 3 ? '#FFCB7E' : z.pts === 1 ? '#4FA83A' : '#3993D1';
    const boite = enrob.getBoundingClientRect();
    const m = document.createElement('div');
    m.className = 'marque';
    m.style.left = (ev.clientX - boite.left) + 'px';
    m.style.top  = (ev.clientY - boite.top) + 'px';
    m.style.border = '3px solid ' + coul;
    m.style.background = coul + '44';
    enrob.appendChild(m);
    setTimeout(() => m.remove(), 560);

    OPPO.zone = {pts:z.pts, lib:z.lib, cote:z.cote, x:+p.x.toFixed(1), y:+p.y.toFixed(1)};
    OPPO.joueur = null;
    const info = $('#zoneOppo');
    if (info) info.innerHTML = `⟡ ${esc(z.lib)} — ${z.cote} — choisis le tireur`;
  }, {passive:true});
}

function choisitTireur(id, cote){
  const j = parId(id);
  if (OPPO.zone){
    const z = OPPO.zone;
    ouvreFeuille(`
      <div class="feuille-titre">${esc(j.nom)} · n°${j.numero}</div>
      <div class="feuille-sous">${esc(z.lib)} — le tir est-il rentré ?</div>
      <div class="act">
        <button class="act-b oui" onclick="tirOppo('${id}','${cote}',1)">Réussi<small>+${z.pts} pt${z.pts>1?'s':''}</small></button>
        <button class="act-b non" onclick="tirOppo('${id}','${cote}',0)">Manqué<small>tir tenté</small></button>
        <button class="act-b large neutre" onclick="fermeFeuille();OPPO.zone=null;rendVue()">Annuler</button>
      </div>`);
  } else {
    OPPO.joueur = id; rendVue();
    toast(`${j.nom} sélectionné — choisis une action`);
  }
}

function tirOppo(id, cote, reussi){
  const j = parId(id), z = OPPO.zone, s = statsOppo(id);
  if (z.pts === 3){ s.a3++; if (reussi) s.m3++; }
  else if (z.pts === 2){ s.a2++; if (reussi) s.m2++; }
  else { s.lfa++; if (reussi) s.lfm++; }
  if (reussi){ s.pts += z.pts; OPPO.score[cote] += z.pts; }
  OPPO.tirs.push({id, cote, x:z.x, y:z.y, pts:z.pts, reussi:!!reussi, q:OPPO.periode});
  OPPO.histo.unshift({txt:`${j.numero} ${j.nom.split(' ')[1]||j.nom} — ${z.lib} ${reussi?'réussi':'manqué'}`,
                      coul:reussi?'#4FA83A':'#E0564B', q:OPPO.periode, type:'tir', cote});
  enregistrer('tirs_opposition', {joueur_id:id, camp:cote, x:z.x, y:z.y,
                                  points:z.pts, reussi:!!reussi, periode:OPPO.periode});
  OPPO.zone = null; OPPO.joueur = null;
  fermeFeuille(); rendVue();
  toast(reussi ? `+${z.pts} pt${z.pts>1?'s':''} — ${j.nom.split(' ')[0]}` : `Manqué — ${j.nom.split(' ')[0]}`);
}

function actionOppo(cle){
  if (!OPPO.joueur){ toast('Sélectionne d\'abord un joueur'); return; }
  const j = parId(OPPO.joueur), s = statsOppo(OPPO.joueur);
  const lib = {reb:'Rebond', pd:'Passe décisive', int:'Interception', bp:'Balle perdue', fte:'Faute'}[cle];
  const coul = {reb:'#3993D1', pd:'#4FA83A', int:'#A47FE0', bp:'#E8A33D', fte:'#E0564B'}[cle];
  s[cle]++;
  OPPO.histo.unshift({txt:`${j.numero} ${j.nom.split(' ')[1]||j.nom} — ${lib}`, coul, q:OPPO.periode, type:cle});
  OPPO.joueur = null; rendVue();
  toast(`${lib} — ${j.nom.split(' ')[0]}`);
}

function lancerFrancOppo(){
  if (!OPPO.joueur){ toast('Sélectionne d\'abord un joueur'); return; }
  const id = OPPO.joueur;
  const cote = OPPO.camps.rouges.includes(id) ? 'rouges' : 'blancs';
  OPPO.zone = {pts:1, lib:'Lancer franc', cote, x:cote === 'rouges' ? 116 : 444, y:150};
  choisitTireur(id, cote);
}

function annuleOppo(){
  const h = OPPO.histo.shift();
  if (!h) return;
  if (h.type === 'tir'){
    const t = OPPO.tirs.pop();
    if (t){
      const s = statsOppo(t.id);
      if (t.pts === 3){ s.a3--; if (t.reussi) s.m3--; }
      else if (t.pts === 2){ s.a2--; if (t.reussi) s.m2--; }
      else { s.lfa--; if (t.reussi) s.lfm--; }
      if (t.reussi){ s.pts -= t.pts; OPPO.score[t.cote] -= t.pts; }
    }
  } else if (h.type) {
    // action hors tir : on retrouve le joueur par son numéro affiché
    const num = parseInt(h.txt, 10);
    const j = parEq(OPPO.equipe).find(x => x.numero === num);
    if (j && OPPO.stats[j.id] && OPPO.stats[j.id][h.type] > 0) OPPO.stats[j.id][h.type]--;
  }

let NOUV_QUIZ = {options: ['', '', '', ''], bonnes: []};

function vueQuizCreer(){

  return `${retour('Quiz', 'E.sous=null;rendVue()')}
  <h1 class="vue-titre">Nouveau quiz</h1>

    <p class="carte-note" style="margin-bottom:9px">Coche celles qui sont jouables. Plusieurs peuvent l'être.</p>
    ${NOUV_QUIZ.options.map((v,i) => `
      <div class="rang" style="margin-bottom:8px;align-items:flex-start">
        <button class="qz-case" style="margin-top:9px;${NOUV_QUIZ.bonnes.includes(i)
          ? 'background:var(--physique);border-color:var(--physique)' : ''}"
          onclick="basculeBonne(${i})" aria-label="Solution ${i+1} jouable">${NOUV_QUIZ.bonnes.includes(i) ? '✓' : ''}</button>
        <input class="champ" placeholder="Solution ${i+1}" value="${esc(v)}"
          oninput="NOUV_QUIZ.options[${i}]=this.value">
      </div>`).join('')}

    <label class="label" for="qzJoueurs" style="margin-top:12px">Destinataires</label>
    <select class="champ" id="qzJoueurs" multiple size="6">
      ${js.map(j => `<option value="${j.id}">${j.numero} · ${esc(j.nom)} (${esc(j.poste)})</option>`).join('')}
    </select>
    <p class="carte-note" style="margin-top:6px">Sélection multiple : maintiens Ctrl (ou ⌘) pour en choisir plusieurs.</p>

    <button class="bouton plein" style="margin-top:14px" onclick="creerQuiz()">Envoyer aux joueurs</button>
  </div>`;
}
function basculeBonne(i){
  const k = NOUV_QUIZ.bonnes.indexOf(i);
  if (k >= 0) NOUV_QUIZ.bonnes.splice(k, 1); else NOUV_QUIZ.bonnes.push(i);
  rendVue();
}
function creerQuiz(){
  const titre = ($('#qzTitre').value || '').trim();
  const situation = ($('#qzSituation').value || '').trim();
  const options = NOUV_QUIZ.options.map(o => o.trim()).filter(Boolean);
  const dest = Array.from($('#qzJoueurs').selectedOptions || []).map(o => o.value);
  if (!titre) return toast('Donne un titre au quiz');
  if (options.length < 2) return toast('Il faut au moins deux solutions');
  if (!NOUV_QUIZ.bonnes.length) return toast('Coche au moins une solution jouable');
  if (!dest.length) return toast('Choisis au moins un destinataire');

  const q = {id:nouvelId(), titre, clip:($('#qzClip').value || '').trim(),
             equipe:E.equipe, auteur:(E.moi||{}).id || E.role, date:AUJ_FR(),
             joueurs:dest, situation,
             options: NOUV_QUIZ.options.map((t,i) => ({texte:t.trim(), bonne:NOUV_QUIZ.bonnes.includes(i)}))
                                       .filter(o => o.texte)};
  DB.quiz.unshift(q);
  enregistrer('quiz', {id:q.id, titre:q.titre, clip_url:q.clip, equipe_code:q.equipe,
                       auteur_id:(E.moi||{}).id || null, situation:q.situation,
                       options:q.options, destinataires:q.joueurs});
  journalChat(`a posé un quiz vision de jeu — « ${titre} » · ${nomEq(q.equipe)} · ${dest.length} joueur${dest.length>1?'s':''}`);
  NOUV_QUIZ = {options:['','','',''], bonnes:[]};
  E.sous = null;
  toast(`Quiz envoyé à ${dest.length} joueur${dest.length>1?'s':''}`);
  rendVue(); window.scrollTo(0,0);
}

function vueQuizJoueur(){

  if (E.quiz) return vueQuizPassage(DB.quiz.find(q => q.id === E.quiz));

  const aFaire = mes.filter(q => !(j.quizFaits || {})[q.id]);

  return `<h1 class="vue-titre">Quiz vision de jeu</h1>

  ${faits.map(q => carteQuiz(q, true)).join('')}` : ''}

  ${!mes.length ? '<div class="vide">Aucun quiz pour le moment. Ton coach t\'en enverra après le prochain match.</div>' : ''}`;
}

function carteQuiz(q, fait){
  const j = E.joueur;
  const rep = (j.quizFaits || {})[q.id] || [];
  const bonnes = q.options.map((o,i) => o.bonne ? i : -1).filter(i => i >= 0);
  const justes = rep.filter(i => bonnes.includes(i)).length;
  const fausses = rep.filter(i => !bonnes.includes(i)).length;
  return `<div class="carte">
    <div class="carte-tete">
      <span class="etiq pleine" style="background:${fait ? 'var(--physique)' : 'var(--or)'}">${fait ? 'Répondu' : 'À faire'}</span>
      <span class="carte-note pousse mono">${esc(q.date)}</span></div>
    <div class="carte-titre" style="font-size:15px">${esc(q.titre)}</div>
    <p class="msg-txt" style="margin-top:7px">${esc(q.situation.slice(0, 110))}…</p>
    ${fait ? `<div class="rang" style="margin-top:10px;gap:7px;flex-wrap:wrap">
      <span class="etiq" style="color:var(--physique)">${justes}/${bonnes.length} solutions trouvées</span>
      ${fausses ? `<span class="etiq" style="color:var(--danger)">${fausses} à écarter</span>` : ''}</div>` : ''}
    <button class="bouton ${fait ? 'fant' : ''} plein" style="margin-top:11px"
      onclick="ouvreQuiz('${q.id}')">${fait ? 'Revoir la correction' : 'Répondre'}</button>
  </div>`;
}
function ouvreQuiz(id){
  E.quiz = id;
  const j = E.joueur;

/* ─────────────────────────────── graphiques version claire
   Le radar et la courbe de la plateforme sont dessinés pour un fond nuit.
   Sur une feuille blanche il faut d'autres valeurs de gris, sinon plus rien
   ne se lit à l'impression. Deux fonctions génériques, pas un copier-coller. */

function a4Radar(libelles, serieA, serieB, maxi){
  const n = libelles.length, R = 80, M = maxi || 10;
  const pt = (i, v) => {
    const a = -Math.PI/2 + i * 2*Math.PI/n, r = (v == null ? 0 : v)/M*R;
    return [Math.cos(a)*r, Math.sin(a)*r];
  };
  let g = '';
  [0.25, 0.5, 0.75, 1].forEach(f => {
    const d = Array.from({length:n}, (_,i) => pt(i, M*f).map(v => v.toFixed(1)).join(',')).join(' ');
    g += `<polygon points="${d}" fill="none" stroke="${f === 1 ? '#BDB69F' : '#E3DDCB'}" stroke-width="1"/>`;
  });
  for (let i = 0; i < n; i++){
    const [x,y] = pt(i, M);
    g += `<line x1="0" y1="0" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#E3DDCB" stroke-width="1"/>`;
  }
  const trace = (serie, coul, pointille) => {
    if (!serie) return '';
    const d = serie.map((v,i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
    return `<polygon points="${d}" fill="${coul}" fill-opacity="${pointille ? 0 : .13}" stroke="${coul}"
      stroke-width="${pointille ? 1.4 : 2}" ${pointille ? 'stroke-dasharray="4,3"' : ''} stroke-linejoin="round"/>`;
  };
  g += trace(serieB, '#C77A00', true);
  g += trace(serieA, '#1A6FAF', false);
  let pts = '', lab = '';
  serieA.forEach((v,i) => {
    const [x,y] = pt(i, v);
    pts += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" fill="#1A6FAF"/>`;
  });
  libelles.forEach((l,i) => {
    const [x,y] = pt(i, M*1.26);
    const anc = Math.abs(x) < 8 ? 'middle' : x > 0 ? 'start' : 'end';
    lab += `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anc}"
      font-size="9" fill="#5C584E" font-family="DM Sans,sans-serif">${esc(l)}</text>`;
    const [vx,vy] = pt(i, serieA[i] == null ? 0 : serieA[i]);
    lab += `<text x="${(vx + (x > 4 ? 7 : x < -4 ? -7 : 0)).toFixed(1)}" y="${(vy - 5).toFixed(1)}"
      text-anchor="${anc}" font-size="9" font-weight="600" fill="#111"
      font-family="IBM Plex Mono,monospace">${serieA[i] == null ? '–' : serieA[i]}</text>`;
  });
  return `<svg viewBox="-172 -106 344 212" role="img" aria-label="Profil par domaine">${g}${pts}${lab}</svg>`;
}

function a4Courbe(series, libelles, etiquettes, maxi){
  const L = 300, H = 62, mg = {g:22, d:7, h:7, b:15}, M = maxi || 10;
  const n = Math.max(...series.map(s => s.length));
  const X = i => mg.g + (n < 2 ? (L-mg.g-mg.d)/2 : i*(L-mg.g-mg.d)/(n-1));
  const Y = v => mg.h + (M-v)/M*(H-mg.h-mg.b);
  let g = '';
  for (let k = 0; k <= 4; k++){
    const v = M*k/4;
    g += `<line x1="${mg.g}" y1="${Y(v).toFixed(1)}" x2="${L-mg.d}" y2="${Y(v).toFixed(1)}"
      stroke="#E3DDCB" stroke-width="1"/>
      <text x="${mg.g-5}" y="${(Y(v)+3).toFixed(1)}" text-anchor="end" font-size="8"
      fill="#94908A" font-family="IBM Plex Mono,monospace">${Math.round(v)}</text>`;
  }
  const couls = ['#1A6FAF', '#C77A00'];
  series.forEach((s,k) => {
    const d = s.map((v,i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
    g += `<path d="${d}" fill="none" stroke="${couls[k]}" stroke-width="2" stroke-linejoin="round"/>`;
    s.forEach((v,i) => {
      g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="${couls[k]}"/>
        <text x="${X(i).toFixed(1)}" y="${(Y(v)-5).toFixed(1)}" text-anchor="middle" font-size="8.5"
        font-weight="600" fill="#111" font-family="IBM Plex Mono,monospace">${v}</text>`;
    });
  });
  etiquettes.forEach((e,i) => {
    const anc = i === 0 ? 'start' : i === etiquettes.length - 1 ? 'end' : 'middle';
    const x = i === 0 ? mg.g : i === etiquettes.length - 1 ? L - mg.d : X(i);
    g += `<text x="${x.toFixed(1)}" y="${H-4}" text-anchor="${anc}" font-size="8"
      fill="#7A756A" font-family="DM Sans,sans-serif">${esc(e)}</text>`;
  });
  const leg = libelles.map((l,k) =>
    `<span><i style="background:${couls[k]}"></i>${esc(l)}</span>`).join('');
  return `<div class="a4-bloc"><h3>Progression mois après mois</h3>
    ${libelles.length ? `<div class="a4-leg">${leg}</div>` : ''}
    <svg viewBox="0 0 ${L} ${H}" role="img" aria-label="Progression">${g}</svg></div>`;
}

/* ═══════════════════════════════════ FICHE DE SUIVI JOUEUR ═══════════════════════════════════ */

function ficheJoueurA4(j){
  const dern = j.moyennes.length - 1;
  const prec = dern > 0 ? dern - 1 : null;
  const A = DB.domaines.map(d => j.notes[d][dern]);
  const B = prec === null ? null : DB.domaines.map(d => j.notes[d][prec]);
  const m = j.moyennes[dern], m0 = j.moyennes[0];
  const evol = dern > 0 ? +(m - m0).toFixed(1) : null;
  const b = bilanTir(j, parcoursDe(j));

  const cls = d => d == null ? 'flat' : d > 0.05 ? 'up' : d < -0.05 ? 'down' : 'flat';

/* ═══════════════════════════════════ FICHE D'ÉVALUATION DU STAFF ═══════════════════════════════════
   Document du directeur technique, et de lui seul. Il ne remonte pas au
   président, n'apparaît pas dans le fil du staff, et aucun autre compte n'y
   accède — ni les coachs évalués, ni l'analyste, ni le kiné. La plateforme
   l'affiche et l'imprime ; le classeur qui le porte reste hors du Drive du club. */

/* « Septembre-Octobre 2026 » ne tient pas sous un point de courbe. */
function periodeCourte(p){
  return String(p).replace(/\s*\d{4}$/, '')
    .split('-').map(m => m.trim().slice(0, 3)).join('-');
}

function evalStaff(role, periode){
  return (DB.evalStaff || []).find(e => e.role === role && e.periode === periode);
}
function poidsStaff(role, espoirs){
  return (DB.grillesStaff[role] || {criteres: []}).criteres.map(c => espoirs ? c[3] : c[2]);
}
function scoreStaff(role, e){
  if (!e) return null;
  const p = poidsStaff(role, e.equipe === 'espoirs');
  const s = e.notes.reduce((a, n, i) => a + (n || 0) * p[i], 0);
  return Math.round(s / 5 * 100);
}

function ficheStaffA4(role, periode){
  const g = DB.grillesStaff[role];
  const e = evalStaff(role, periode);
  if (!g || !e) return '<div class="a4"><p>Aucune évaluation sur cette période.</p></div>';

  const ps = DB.periodesStaff;
  const ip = ps.indexOf(periode);
  const pPrec = ip > 0 ? ps[ip-1] : null;
  const eB = pPrec ? evalStaff(role, pPrec) : null;
  const A = e.notes, B = eB ? eB.notes : null;
  const sc = scoreStaff(role, e), scB = eB ? scoreStaff(role, eB) : null;
  const d = (sc != null && scB != null) ? sc - scB : null;
  const espoirs = e.equipe === 'espoirs';
  const poids = poidsStaff(role, espoirs);

  const cls = v => v == null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
  const sgn = v => v == null ? '—' : (v > 0 ? '+' : '') + v;

  let bas = 0; A.forEach((v,k) => { if (v < A[bas]) bas = k; });

  const lignes = g.criteres.map((c,k) => {
    const dd = B ? A[k] - B[k] : null;
    return `<tr><td>${esc(c[0])}</td>
      <td class="num" style="color:#94908A">${Math.round(poids[k]*100)} %</td>
      <td class="num"><b>${A[k]}</b><span style="color:#94908A">/5</span></td>
      <td class="num" style="color:#94908A">${B ? B[k] : '—'}</td>
      <td class="num ${cls(dd)}">${sgn(dd)}</td></tr>`;
  }).join('');

  const nom = (DB.staff.find(s => s.role === role) || {}).nom || g.lib;
  const serie = ps.map(p => scoreStaff(role, evalStaff(role, p)))
                  .filter(v => v != null);

  return `<div class="a4">
    <div class="a4-tete">
      <div class="a4-g">
        <div class="a4-logo"><img src="${logoSrc()}" alt="Association Sportive Adjamé"></div>

        </div>
      </div>
      <div class="a4-meta">
        <b>${esc(periode)}</b>
        Évaluation du staff ${espoirs ? 'de formation' : 'professionnel'}<br>
        Directeur technique : ${esc((E.moi && E.moi.nom) || '')}
      </div>
    </div>

    <div class="a4-conf">Document du directeur technique. Ne se diffuse pas au staff,
      ne figure pas au rapport du président.</div>

    <div class="a4-tuiles">
      <div class="a4-tuile"><div class="l">Score de la période</div>
        <div class="v">${sc}<span style="font-size:15px;color:#9C978B"> /100</span></div>
        <div class="s">moyenne pondérée des 8 critères</div></div>
      <div class="a4-tuile"><div class="l">Évolution</div>
        <div class="v ${cls(d)}">${sgn(d)}</div>
        <div class="s">${pPrec ? 'vs ' + esc(pPrec) : 'première évaluation'}</div></div>
      <div class="a4-tuile"><div class="l">Point de vigilance</div>
        <div class="v" style="font-size:16px;line-height:1.15;margin-top:1.4mm">${esc(g.criteres[bas][1])}</div>

      <div class="a4-bloc">
        <div class="a4-leg">
          <span><i style="background:#1A6FAF"></i>${esc(periode)}</span>
          ${B ? `<span><i style="background:#C77A00"></i>${esc(pPrec)}</span>` : ''}
        </div>
        ${a4Radar(g.criteres.map(c => c[1]), A, B, 5)}
      </div>
      <div class="a4-bloc">
        <h3>Critère par critère — pondération ${espoirs ? 'espoirs' : 'pro'}</h3>

    <div class="a4-sign">
      <div>Le coach — date et signature</div>
      <div>Le directeur technique — date et signature</div>
    </div>

    <div class="a4-pied">
      <div>Document interne Direction technique — ne pas diffuser · saison ${esc(DB.saison)}</div>
      <div>Confidentiel</div>
    </div>
  </div>`;
}

/* ═══════════════════════════════════ LE PROCHAIN MATCH ═══════════════════════════════════
   Ce qui est écrit au classeur (onglets 4_SCOUTING et 5_PREPA_MATCH) devient
   lisible dans la plateforme, sans avoir à ouvrir le tableur ni à imprimer.

   Tout le monde n'en voit pas la même chose. Les trois clés et les joueurs à
   neutraliser sont faits pour être connus des joueurs : ils arrivent en sachant
   ce qu'on attend d'eux. Le scouting détaillé et surtout les rotations restent
   au staff technique — un joueur qui lit la veille qu'il est neuvième dans la
   rotation, ça ne se répare pas par une conversation. */

const RUBRIQUES_PREPA = [
  {cle:'cles',        lib:'Les 3 clés du match'},
  {cle:'cinq',        lib:'Cinq majeur adverse'},
  {cle:'forces',      lib:'Leurs forces'},
  {cle:'faiblesses',  lib:'Ce qu\'on exploite'},
  {cle:'neutraliser', lib:'Joueurs à neutraliser'},
  {cle:'systemes',    lib:'Leurs systèmes'},
  {cle:'defense',     lib:'Leur défense'},
  {cle:'consignes',   lib:'Nos consignes défensives'},
  {cle:'rotations',   lib:'Rotations prévues'},
];

const rempli = v => Array.isArray(v)
  ? v.filter(x => String(x || '').trim()).length > 0
  : String(v || '').trim().length > 0;

function completudePrepa(m){
  const manquants = RUBRIQUES_PREPA.filter(r => !rempli(m[r.cle])).map(r => r.lib);
  return {faits: RUBRIQUES_PREPA.length - manquants.length,
          total: RUBRIQUES_PREPA.length, manquants,
          pct: Math.round((RUBRIQUES_PREPA.length - manquants.length) / RUBRIQUES_PREPA.length * 100)};
}

/* La rencontre à venir du groupe : celle marquée « à venir » au classeur, sinon
   celle dont l'adversaire correspond au prochain match du championnat. */
function prochainMatch(equipe){
  const ms = (DB.prepaMatch || []).filter(m => m.equipe === equipe);
  const av = ms.find(m => m.statut === 'à venir');
  if (av) return av;
  const p = (DB.championnat || {}).prochain || {};
  return ms.find(m => m.adversaire === p.adversaire) || null;
}

const joursAvant = dateFr => {
  const [j, mo, a] = String(dateFr || '').split('/');
  if (!a) return null;
  return Math.round((Date.parse(`${a}-${mo}-${j}`) - Date.parse(AUJ())) / 86400000);
};

        <div class="ban-lib">${esc(m.convocation)}</div></div>` : ''}
    </div>
  </div>

  ${complet ? `<div class="carte" style="margin-bottom:12px;border-color:${c.pct === 100 ? 'var(--physique)' : 'var(--alerte)'}">
    <div class="carte-tete"><div class="carte-titre">Préparation au classeur</div>

  ${cles.length ? `<div class="section-titre">Les ${cles.length} clés du match</div>

  ${rempli(m.neutraliser) ? `<div class="section-titre">Joueurs à neutraliser</div>
  <div class="med indispo"><p class="msg-txt">${esc(m.neutraliser)}</p></div>` : ''}

  ${complet ? `
  ${rempli(m.cinq) ? `<div class="section-titre">Cinq majeur adverse</div>
