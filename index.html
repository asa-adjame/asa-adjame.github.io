<!-- Page d'accueil du site. À déposer À LA RACINE du dépôt, sous le nom
     index.html.

     Le nom de l'ensemble est désormais ASA Plateforme. La grille de tir et le
     pointage — ce qu'on appelait ASA Sniper — en sont une partie, et gardent
     leur adresse : c'est celle que le club connaît et celle qui sert au
     gymnase. Rien de ce qui fonctionne aujourd'hui ne change de place.

     La plateforme vit dans son propre sous-dossier, /plateforme/, et PAS ici.
     Le service worker de la grille de tir occupe la portée de la racine, et
     deux enregistrements sur la même portée se remplacent l'un l'autre — la
     grille perdrait son hors-ligne, et ça ne se verrait qu'à la prochaine
     coupure, au gymnase. -->
